<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>وعد — الموارد البشرية والمالية</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8fafc;--surface:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--line2:#cbd5e1;--line3:#f1f5f9;--accent:#2563eb;--accent-ink:#fff;--soft:#eff4ff;--soft2:#f1f5f9;--ok:#0d9488;--okbg:rgba(13,148,136,.10);--bad:#b91c1c;--badbg:rgba(239,68,68,.10);--wait:#b45309;--waitbg:rgba(245,158,11,.12);--prim:#131b2e;--prim-h:#1e293b;--prim-ink:#fff;--sh1:0 1px 3px 0 rgba(15,23,42,.04),0 1px 2px -1px rgba(15,23,42,.04);--sh2:0 10px 15px -3px rgba(15,23,42,.06),0 4px 6px -4px rgba(15,23,42,.04);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--surface:#111a2e;--ink:#e2e8f0;--muted:#94a3b8;--line:#1f2a44;--line2:#334155;--line3:#1a2438;--accent:#60a5fa;--accent-ink:#0b1220;--soft:rgba(96,165,250,.14);--soft2:#0f172a;--ok:#5eead4;--okbg:rgba(13,148,136,.22);--bad:#f87171;--badbg:rgba(239,68,68,.16);--wait:#fbbf24;--waitbg:rgba(245,158,11,.16);--prim:#2563eb;--prim-h:#3b82f6;--prim-ink:#fff;--sh1:0 1px 3px 0 rgba(0,0,0,.35);--sh2:0 10px 15px -3px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1220;--surface:#111a2e;--ink:#e2e8f0;--muted:#94a3b8;--line:#1f2a44;--line2:#334155;--line3:#1a2438;--accent:#60a5fa;--accent-ink:#0b1220;--soft:rgba(96,165,250,.14);--soft2:#0f172a;--ok:#5eead4;--okbg:rgba(13,148,136,.22);--bad:#f87171;--badbg:rgba(239,68,68,.16);--wait:#fbbf24;--waitbg:rgba(245,158,11,.16);--prim:#2563eb;--prim-h:#3b82f6;--prim-ink:#fff;--sh1:0 1px 3px 0 rgba(0,0,0,.35);--sh2:0 10px 15px -3px rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;line-height:1.7;font-size:15px}
[hidden]{display:none!important}
a{color:var(--accent);text-decoration:none}
h1{font-size:22px;margin:0 0 4px;font-weight:700}
h2{font-size:17px;margin:0 0 12px;font-weight:600}
.muted{color:var(--muted)}.small{font-size:13px}.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.ok{color:var(--ok)}.bad{color:var(--bad)}
/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.abox{width:100%;max-width:420px}
.brand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:18px}
.mark{width:40px;height:40px;border-radius:10px;background:var(--prim);color:var(--prim-ink);display:grid;place-items:center;font-weight:700;font-size:22px}
.brand b{font-size:22px}
.tabs{display:flex;gap:4px;background:var(--soft2);padding:4px;border-radius:10px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font:inherit;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh1);font-weight:600}
/* shell */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--surface);border-inline-end:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.side .brand{justify-content:flex-start;margin:0 6px 16px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:12px;color:var(--muted);margin:14px 10px 4px;font-weight:600}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:8px;color:var(--ink)}
.nav a:hover{background:var(--soft2)}
.nav a.on{background:var(--soft);color:var(--accent);font-weight:600}
.pill{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;line-height:18px}
.main{min-width:0}
.top{display:flex;align-items:center;gap:10px;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5}
.top .sp{flex:1}
.top .cname{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#cs{max-width:220px}
.btn.menu{display:none}
.page{padding:24px;max-width:1200px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
/* cards & tables */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--sh1);margin-bottom:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.card.kpi{color:var(--ink);display:block}.card.kpi:hover{border-color:var(--line2)}
.kpi .v{font-size:24px;font-weight:700}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--line3);white-space:nowrap}
th{background:var(--soft2);color:var(--muted);font-weight:600;font-size:13px}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:var(--soft2)}
td.r,th.r{text-align:end}
tfoot td{font-weight:700;background:var(--soft2)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.badge{display:inline-block;border-radius:99px;padding:0 10px;font-size:12px;line-height:22px;background:var(--soft2);color:var(--muted)}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.bad{background:var(--badbg);color:var(--bad)}.badge.wait{background:var(--waitbg);color:var(--wait)}.badge.info{background:var(--soft);color:var(--accent)}
/* forms */
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;min-height:40px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
input[type=checkbox]{width:auto;min-height:0}
.fg{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.fg .wide{grid-column:1/-1}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 14px;cursor:pointer;min-height:38px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--soft2)}
.btn.pri{background:var(--prim);border-color:var(--prim);color:var(--prim-ink)}.btn.pri:hover{background:var(--prim-h)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:30px;padding:3px 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.full{width:100%;justify-content:center}
.err{background:var(--badbg);color:var(--bad);border-radius:8px;padding:8px 12px;margin:10px 0;font-size:14px}
.note{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:14px;margin:10px 0}
.code{font-family:ui-monospace,Menlo,monospace;font-size:18px;letter-spacing:3px;background:var(--soft2);border-radius:6px;padding:2px 8px;direction:ltr;display:inline-block}
dialog{border:0;border-radius:14px;padding:0;width:min(620px,calc(100vw - 32px));background:var(--surface);color:var(--ink);box-shadow:var(--sh2)}
dialog::backdrop{background:rgba(15,23,42,.45)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.db{padding:18px;max-height:70vh;overflow:auto}
.df{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}
.x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted)}
#toast{position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(50%);background:var(--prim);color:var(--prim-ink);padding:10px 18px;border-radius:10px;box-shadow:var(--sh2);z-index:50;font-size:14px}
[dir=ltr] #toast{transform:translateX(-50%)}
.lines td{padding:4px}.lines input,.lines select{min-height:34px;padding:4px 8px}
.seg{display:inline-flex;gap:2px;background:var(--soft2);padding:3px;border-radius:9px;flex-wrap:wrap}
.seg a{padding:5px 12px;border-radius:7px;color:var(--muted);font-size:14px}
.seg a.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh1);font-weight:600}
.timeline{list-style:none;padding:0;margin:0}.timeline li{padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
@media(max-width:860px){
 .shell{grid-template-columns:1fr}
 .side{position:fixed;inset-block:0;inset-inline-start:0;width:270px;z-index:20;transform:translateX(110%);transition:transform .2s;box-shadow:var(--sh2)}
 [dir=ltr] .side{transform:translateX(-110%)}
 .side.open{transform:none}
 .btn.menu{display:inline-flex}
 .page{padding:16px}
 .top{padding:10px 16px;flex-wrap:wrap;gap:6px}
 .top .cname .badge{display:none}
 #cs{max-width:150px}
 .fg{grid-template-columns:1fr}
}
@media print{.side,.top,.btn{display:none!important}.shell{display:block}.card{box-shadow:none}}

.linkbtn{border:0;background:none;padding:0;font:inherit;color:var(--accent);cursor:pointer}
/* attendance */
.clock{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.btn.big{font-size:18px;padding:14px 28px;border-radius:12px;min-width:200px}
@media(max-width:640px){.btn.big{width:100%}}
.btn.wa{background:#25d366;border-color:#25d366;color:#fff}.btn.wa:hover{background:#1ebe5b;border-color:#1ebe5b}

/* A4 letter sheet: 210 × 297 mm, always paper-white whatever the theme */
.a4wrap{overflow:hidden;padding:4px 0 20px}
.a4{width:210mm;height:297mm;box-sizing:border-box;padding:16mm 20mm 12mm;margin:0 auto;background:#fff;color:#111;display:flex;flex-direction:column;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;font-size:12.5pt;line-height:1.9;box-shadow:0 2px 14px rgba(0,0,0,.18);overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.a4[dir=ltr]{font-family:'IBM Plex Sans Arabic',Georgia,serif}
.lt-head{display:flex;justify-content:space-between;gap:12mm;align-items:flex-start;border-bottom:1.2pt solid #1f3b57;padding-bottom:5mm}
.lt-brand{display:flex;align-items:center;gap:5mm;min-width:0}
.lt-logo{max-height:22mm;max-width:55mm;object-fit:contain;display:block}
.logo-prev{min-width:120px;min-height:56px;padding:6px;border:1px dashed var(--line,#ccc);border-radius:8px;display:flex;align-items:center;justify-content:center;background:#fff}
.logo-prev img{max-height:60px;max-width:220px;object-fit:contain}
.lt-co{font-size:17pt;font-weight:700;color:#1f3b57;line-height:1.4}
.lt-ids,.lt-meta{font-size:9.5pt;color:#444;line-height:1.7}
.lt-meta,.lt-ids{white-space:nowrap}
.lt-main{flex:1;padding-top:9mm}
.lt-title{text-align:center;font-size:18pt;margin:0 0 8mm;color:#111;text-decoration:underline;text-underline-offset:3mm;text-decoration-thickness:.8pt}
.lt-to{font-weight:700;margin:0 0 5mm!important}
.a4 p{margin:0 0 4mm;text-align:justify;color:#111}
.lt-tbl{width:72%;margin:2mm auto 6mm;border-collapse:collapse;font-size:11.5pt;color:#111}
.lt-tbl th,.lt-tbl td{border:.6pt solid #999;padding:1.4mm 4mm;text-align:start;background:#fff}
.lt-tbl thead th{background:#eef2f6;font-weight:600}
.lt-tbl tfoot td{font-weight:700;background:#f6f8fa}
.lt-tbl .amt{text-align:end;width:42%}
.lt-close{margin-top:6mm!important}
.lt-sign{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12mm}
.lt-by{font-weight:700;margin-bottom:3mm}
.lt-line{min-width:64mm;border-bottom:.6pt dotted #777;margin-bottom:5mm;padding-bottom:1mm}
.lt-stamp{width:34mm;height:34mm;border:.8pt dashed #aaa;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9pt;color:#999;text-align:center}
.lt-foot{border-top:.6pt solid #ccc;padding-top:3mm;font-size:8.5pt;color:#666;text-align:center;line-height:1.6}
.a4.nohead .lt-head,.a4.nohead .lt-foot{visibility:hidden}
#printarea{display:none}
@media print{body.printing>*:not(#printarea){display:none!important}body.printing #printarea{display:block}html:has(body.printing),body.printing{background:#fff!important;margin:0;padding:0}#printarea .a4{box-shadow:none;margin:0;zoom:1}}
/* company letterhead on every printout */
#printhead{display:none}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:8mm;border-bottom:1.2pt solid #1f3b57;padding-bottom:4mm;margin-bottom:6mm;color:#111}
.ph-brand{display:flex;align-items:center;gap:4mm;min-width:0}
.ph-logo{max-height:18mm;max-width:50mm;object-fit:contain;display:block}
.ph-co{font-size:15pt;font-weight:700;color:#1f3b57;line-height:1.4}
.ph-ids{font-size:9pt;color:#444;line-height:1.6}
.ph-meta{font-size:9pt;color:#444;text-align:end;white-space:nowrap}
.ph-t{font-size:12pt;font-weight:700;color:#111;margin-bottom:1mm}
.pdoc .ph-dup{display:none}
.pdoc .card{box-shadow:none;border:0;padding:0;margin:0}
.pdoc table{width:100%}
@media print{
:root:root:root,:root:root:root[data-theme]{--bg:#fff;--surface:#fff;--ink:#111;--muted:#555;--line:#ccc;--line2:#bbb;--line3:#eee;--soft:#eef2f6;--soft2:#f3f4f6;--ok:#0d9488;--okbg:rgba(13,148,136,.10);--bad:#b91c1c;--badbg:rgba(239,68,68,.10);--wait:#b45309;--waitbg:rgba(245,158,11,.12);--accent:#1f3b57}
body:not(.printing) #printhead{display:block}
body.printing #printarea .pdoc{display:block;background:#fff;color:#111;font-size:11pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#dlg{display:none!important}
}
/* team leave calendar */
.lcal table{border-collapse:collapse;font-size:12px}
.lcal th,.lcal td{padding:4px 0;text-align:center;min-width:26px;border-inline-start:1px solid var(--line3)}
.lcal .lname{position:sticky;inset-inline-start:0;background:var(--surface);text-align:start;padding:6px 10px;min-width:150px;white-space:nowrap;z-index:1;border-inline-start:0}
.lcal th.off,.lcal td.off{background:var(--soft2)}
.lcal th.hol,.lcal td.hol{background:var(--waitbg)}
.lcal td.lc.on{background:var(--accent)}
.lcal td.lc.pend{background:repeating-linear-gradient(45deg,var(--soft),var(--soft) 4px,var(--accent) 4px,var(--accent) 6px);opacity:.75}
.lcal tfoot td.bad{background:var(--badbg);font-weight:700}
.lk{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:middle;margin-inline-end:4px;border:1px solid var(--line2)}
.lk.on{background:var(--accent)}.lk.pend{background:repeating-linear-gradient(45deg,var(--soft),var(--soft) 3px,var(--accent) 3px,var(--accent) 5px)}.lk.hol{background:var(--waitbg)}.lk.off{background:var(--soft2)}
/* notifications bell */
.bellw{position:relative}
.bell{position:relative;padding-inline:8px}
.bdot{position:absolute;top:-6px;inset-inline-end:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;text-align:center;font-weight:700}
.bpanel{position:absolute;top:calc(100% + 6px);inset-inline-end:0;width:min(340px,calc(100vw - 24px));max-height:60vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);z-index:20}
.bpanel .bh{padding:10px 12px;border-bottom:1px solid var(--line)}
.bpanel .bi{display:block;padding:10px 12px;border-bottom:1px solid var(--line3);color:var(--ink);font-size:13px;line-height:1.6}
.bpanel .bi:hover{background:var(--soft2)}
.bpanel .bi.hot{border-inline-start:3px solid var(--bad)}
.bpanel .bi.new{background:var(--soft)}
@media(max-width:700px){.bpanel{position:fixed;top:58px;left:12px;right:12px;width:auto}}
/* violations table: long titles wrap so all four steps stay visible */
.pentbl th,.pentbl td{white-space:normal;vertical-align:top}
.pentbl td:nth-child(2){min-width:240px}
.pentbl td:nth-child(n+3),.pentbl th:nth-child(n+3){min-width:90px}
.wrapcells th,.wrapcells td{white-space:normal}
/* bilingual invoice printout */
#printarea .iv{background:#fff;color:#111;font-size:10pt;line-height:1.5;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.iv .iv-en{font-size:.85em;color:#444}
.iv-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8mm;border-bottom:1.2pt solid #1f3b57;padding-bottom:4mm;margin-bottom:5mm}
.iv-title{text-align:center;font-size:15pt;font-weight:700;color:#1f3b57;white-space:nowrap}
.iv table{width:100%;border-collapse:collapse;margin-bottom:5mm}
.iv th,.iv td{border:.6pt solid #bbb;padding:1.6mm 2.4mm;text-align:start;white-space:normal;vertical-align:top}
.iv th{background:#eef2f6;font-weight:600}
.iv .r{text-align:end}
.iv-meta td:nth-child(odd){background:#f6f8fa;width:22%}
.iv-tot{width:60%!important;margin-inline-start:auto}
.iv-grand td{font-weight:700;font-size:11pt;background:#eef2f6}
.iv-foot{margin-top:8mm;text-align:center;color:#666;font-size:8.5pt}

/* organisation chart */
.orgcard{padding:12px}
.orgwrap{overflow:auto;direction:ltr;padding:4px 4px 12px}
.org,.org ul{display:flex;justify-content:center;margin:0;padding:18px 0 0;list-style:none;position:relative}
.org{padding-top:0;min-width:max-content;margin:0 auto}
.org li{position:relative;padding:18px 5px 0;display:flex;flex-direction:column;align-items:center}
.org>li{padding-top:0}
.org li::before,.org li::after{content:'';position:absolute;top:0;width:50%;height:18px;border-top:1.5px solid var(--line2)}
.org li::before{right:50%}.org li::after{left:50%;border-left:1.5px solid var(--line2)}
.org li:only-child::before{display:none}.org li:only-child::after{border-top:0}
.org li:first-child::before,.org li:last-child::after{border-top:0}
.org li:last-child::before{border-right:1.5px solid var(--line2);border-top-right-radius:6px}
.org li:first-child:not(:only-child)::after{border-top-left-radius:6px}
.org>li::before,.org>li::after{display:none}
.org ul::before{content:'';position:absolute;top:0;left:50%;height:18px;border-left:1.5px solid var(--line2)}
.org li.col>ul{display:none}
.onode{position:relative;display:flex;align-items:center;gap:8px;min-width:170px;max-width:220px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);box-shadow:var(--sh1);cursor:pointer;text-align:start;line-height:1.45}
html[dir=rtl] .onode{direction:rtl}
.onode:hover,.onode:focus{border-color:var(--accent);outline:none}
.onode.ohead{border-top:3px solid var(--accent)}
.onode.ohit{box-shadow:0 0 0 3px var(--soft);border-color:var(--accent)}
.onode b{display:block;font-size:13.5px}
.otx{min-width:0;flex:1}.otx .small{font-size:12px}
.oav{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--accent);font-weight:700;font-size:13px}
.otog{position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);min-width:24px;height:22px;padding:0 6px;border-radius:99px;border:1px solid var(--line2);background:var(--surface);color:var(--muted);font:600 11px/20px inherit;cursor:pointer;z-index:1}
.org li.col>.onode .otog{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.org li:has(>ul)>.onode{margin-bottom:6px}
.odept .tw{margin-top:10px}
@media print{#printarea .orgwrap{overflow:visible}#printarea .onode{box-shadow:none;break-inside:avoid}#printarea .otog{position:static;transform:none;display:inline-block;margin-inline-start:4px}}

</style>
</head>
<body>

const AR_PUNCT = { '،': ',', '؛': ';', '؟': '?', '«': '"', '»': '"' };
function trRun(run) {
  if (EN[run] != null) return EN[run];
  const w = run.split(/[  ]+/), out = [];
  for (let i = 0; i < w.length;) {
    let j = w.length, hit = null;
    for (; j > i; j--) { const k = w.slice(i, j).join(' '); if (EN[k] != null) { hit = EN[k]; break; } }
    if (hit != null) { out.push(hit); i = j; continue; }
    const x = w[i];
    if (x.length > 2 && x[0] === 'و' && EN[x.slice(1)] != null) { out.push('and ' + EN[x.slice(1)]); i++; continue; }
    return run;   // an unknown word means user data (a name, a memo): leave the whole run as typed
  }
  return out.join(' ');
}
function trTo(s) {
  s = String(s == null ? '' : s); if (!/[؀-ۿ«»]/.test(s)) return s;
  return s.replace(AR_RUN, trRun).replace(/[،؛؟«»]/g, c => AR_PUNCT[c]).replace(/Art\.(\d)/g, 'Art. $1')
    .replace(/[٠-٩]/g, d => d.charCodeAt(0) - 0x660);
}
const tr = s => LANG === 'en' ? trTo(s) : s;
const TR_ATTRS = ['placeholder', 'title', 'aria-label'];

  if (n.nodeType === 3) { const p = n.parentElement; if (p && !p.closest('[data-nt],textarea,script,style')) { const t = trTo(n.nodeValue); if (t !== n.nodeValue) n.nodeValue = t; } return; }
  if (n.nodeType !== 1 || n.closest('[data-nt],script,style')) return;
  for (const a of TR_ATTRS) if (n.hasAttribute(a)) { const v = n.getAttribute(a), t = trTo(v); if (t !== v) n.setAttribute(a, t); }
  if (n.tagName !== 'TEXTAREA') for (const c of [...n.childNodes]) trWalk(c);
}
let trObs = null;
function applyLang() {
  const h = document.documentElement; h.lang = LANG; h.dir = LANG === 'en' ? 'ltr' : 'rtl';
  document.title = LANG === 'en' ? 'Waad — HR and finance' : 'وعد — الموارد البشرية والمالية';
  if (trObs) { trObs.disconnect(); trObs = null; }
  if (LANG !== 'en') return;

  trObs = new MutationObserver(ms => { for (const m of ms) { if (m.type === 'childList') m.addedNodes.forEach(trWalk); else trWalk(m.target); } });
  trObs.observe(document.body, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: TR_ATTRS });
}

const S = { session: LS.get('waad.session'), cid: LS.get('waad.cid'), companies: [], role: null, emp: null, perms: new Set(), company: null, myEmp: null };
let refreshing = null;
function setSession(s) { S.session = s ? { access_token: s.access_token, refresh_token: s.refresh_token, expires_at: Date.now() + (s.expires_in || 3600) * 1000, user: s.user } : null; LS.set('waad.session', S.session); }
async function refreshSession() {

    const j = await r.json().catch(() => ({}));

  [/permission denied|row-level security|42501/i, 'ليست لديك صلاحية لهذا الإجراء'],
  [/duplicate key.*(emp_no)/i, 'الرقم الوظيفي مستخدم مسبقاً'],

  [/invalid input syntax for type date/i, 'أدخل تاريخاً صحيحاً'],
  [/Invalid login credentials/i, 'البريد أو كلمة المرور غير صحيحة'],

function arMsg(m) { m = String(m || ''); if (/[؀-ۿ]/.test(m)) return m; for (const [re, ar] of EN_AR) if (re.test(m)) return ar; return m || 'حدث خطأ غير متوقع'; }

async function api(path, { method = 'GET', body, headers = {}, retry = true } = {}) {

  const h = Object.assign({ apikey: CFG.key, 'Content-Type': 'application/json' }, headers);
  if (S.session) h.Authorization = 'Bearer ' + S.session.access_token;

  try { r = await fetch(CFG.url + path, { method, headers: h, body: body === undefined ? undefined : JSON.stringify(body) }); }
  catch (e) { throw new ApiError(arMsg(e.message), 0); }

    const t = await r.clone().text();

  const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) { j = txt; }

const qs = o => Object.entries(o).filter(([, v]) => v !== undefined && v !== null).map(([k, v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v)).join('&');

  async signUp(email, password) { const r = await fetch(CFG.url + '/auth/v1/signup', { method: 'POST', headers: { apikey: CFG.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) }).catch(e => { throw new ApiError(arMsg(e.message), 0); }); const j = await r.json().catch(() => ({})); if (!r.ok) throw new ApiError(authMsg(j), r.status); if (j.access_token) { setSession(j); return true; } return false; },

/* modal */
function modal(title, body, { ok = 'حفظ', onOk, wide } = {}) {
  const d = $('#dlg');
  d.style.width = wide ? 'min(960px,calc(100vw - 32px))' : '';
  d.innerHTML = `<form method="dialog" id="mform" novalidate><div class="dh"><b>${esc(title)}</b><button type="button" class="x" aria-label="إغلاق" id="mx">×</button></div><div class="db">${body}<div id="merr"></div></div>${onOk ? `<div class="df"><button type="button" class="btn" id="mc">إلغاء</button><button class="btn pri" id="mok">${esc(ok)}</button></div>` : ''}</form>`;
  const close = () => d.close();
  $('#mx', d).onclick = close; if ($('#mc', d)) $('#mc', d).onclick = close;
  $('#mform', d).onsubmit = async ev => { ev.preventDefault(); if (!onOk) return close(); const b = $('#mok', d); try { await busy(b, () => onOk(formData($('#mform', d)), d)); close(); } catch (e) { showErr($('#merr', d), e); } };
  d.showModal(); const first = $('input,select,textarea', d); if (first) first.focus();
  return d;
}

function printHead(title) {
  const c = S.company || {}, ids = [c.cr_no && 'السجل التجاري ' + c.cr_no, c.vat_no && 'الرقم الضريبي ' + c.vat_no].filter(Boolean).join(' · ');
  return `<div class="ph"><div class="ph-brand">${c.logo ? `<img class="ph-logo" src="${esc(c.logo)}" alt="">` : ''}<div><div class="ph-co">${esc(c.name || '')}</div>${ids ? `<div class="ph-ids">${esc(ids)}</div>` : ''}${c.address ? `<div class="ph-ids">${esc(c.address)}</div>` : ''}</div></div>

}
// print only `node` (one prepared sheet, or a copy of part of the page): everything else is hidden for this job
function printWith(node, pageCss) {
  let pa = document.getElementById('printarea'); if (!pa) { pa = document.createElement('div'); pa.id = 'printarea'; document.body.appendChild(pa); }
  pa.replaceChildren(node);
  const st = document.createElement('style'); st.textContent = pageCss; document.head.appendChild(st);
  document.body.classList.add('printing');
  const done = () => { document.body.classList.remove('printing'); st.remove(); pa.replaceChildren(); window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  window.print();
}
function printBlock(node, title) {
  const doc = document.createElement('div'); doc.className = 'pdoc'; doc.innerHTML = printHead(title);
  const cp = node.cloneNode(true); cp.removeAttribute('id'); cp.querySelectorAll('.btn,button,input[type=file],.wa').forEach(x => x.remove()); doc.appendChild(cp);
  printWith(doc, '@page{size:A4 portrait;margin:12mm}');
}
// the browser's own print (Ctrl+P) on any page gets the same letterhead
window.addEventListener('beforeprint', () => {
  if (document.body.classList.contains('printing')) return;
  let h = document.getElementById('printhead'); if (!h) { h = document.createElement('div'); h.id = 'printhead'; document.body.prepend(h); }
  const t = document.querySelector('#page h1'); h.innerHTML = S.company && S.session ? printHead(t ? t.textContent.trim() : '') : '';
});

/* ===== boot & context ===== */
async function loadContext() {
  S.companies = await db.rpc('my_companies');
  if (!S.companies.length) return false;
  let c = S.companies.find(x => x.company_id === S.cid) || S.companies[0];
  S.cid = c.company_id; LS.set('waad.cid', S.cid); S.role = c.role; S.emp = c.employee_id; S.mustChange = !!c.must_change_password; if (c.code) { LS.set('waad.ccode', c.code); LS.set('waad.cname', c.name); }
  const [co] = await db.get('companies', { id: 'eq.' + S.cid });
  S.company = co;
  await preloadNames();
  S.perms = new Set();
  if (['accountant', 'storekeeper'].includes(S.role)) (await db.get('finance_permissions', { company_id: 'eq.' + S.cid, role: 'eq.' + S.role, select: 'perm' })).forEach(p => S.perms.add(p.perm));
  S.myEmp = S.emp ? (await db.get('employees', { id: 'eq.' + S.emp }))[0] || null : null;
  return true;
}
async function boot() {
  if (!S.session) return authView();
  try {
    if (!(await loadContext())) return onboardView();
    if (S.mustChange) return changePasswordView(true);
  } catch (e) {
    if (e.status === 401) { setSession(null); return authView('in', 'انتهت الجلسة — سجّل الدخول مجدداً'); }
    $('#app').innerHTML = `<div class="auth"><div class="abox">${brand()}<div class="card"><div class="err">${esc(e.message)}</div><button class="btn" onclick="boot()">إعادة المحاولة</button></div></div></div>`; return;
  }
  shell(); route();
}

async function drawBell(open) {
  if (!$('#bell')) return;
  if (open && $('#bpanel')) $('#bpanel').innerHTML = '<div class="muted small" style="padding:12px">جارٍ التحميل…</div>';
  try { NOTIFS = await loadNotifs(); BELL_AT = Date.now(); } catch (e) { NOTIFS = []; }
  const seen = new Date(LS.get(seenKey()) || 0), isNew = x => !!x.at && new Date(x.at) > seen, n = NOTIFS.filter(x => x.hot || isNew(x)).length;
  const c = $('#bcnt'); if (c) { c.hidden = !n; c.textContent = n > 9 ? '9+' : n; }
  const p = $('#bpanel'); if (!p) return;
  p.innerHTML = `<div class="bh" data-ready><b>التنبيهات</b></div>${NOTIFS.length ? NOTIFS.map(x => `<a href="${x.h}" class="bi${x.hot ? ' hot' : ''}${isNew(x) ? ' new' : ''}">${x.ok === true ? '<span class="ok">✓</span> ' : x.ok === false ? '<span class="bad">✕</span> ' : ''}${esc(x.t)}${x.n ? ` <b>${esc(x.n)}</b>` : ''}${x.tail ? ' ' + esc(x.tail) : ''}${x.at ? ` <span class="muted small num">${esc(String(x.at).slice(0, 10))}</span>` : ''}</a>`).join('') : '<div class="muted small" style="padding:12px">لا توجد تنبيهات</div>'}`;
  $$('a', p).forEach(a => a.onclick = () => { p.hidden = true; });
}
async function route() {
  if (!S.session || !S.cid || !$('#page')) return;
  const [path, q] = (location.hash || '#/home').split('?');
  const parts = path.split('/'); // ['#', 'sales', 'id']
  let key = parts.slice(0, 2).join('/'), arg = parts.slice(2).join('/');
  if (!VIEWS[key]) { key = '#/home'; arg = ''; }
  $('#side') && $('#side').classList.remove('open');
  drawNav();
  // each navigation renders into its own container, so a slow earlier page can never overwrite a newer one
  const page = document.createElement('div'); page.innerHTML = '<div class="muted">جارٍ التحميل…</div>';
  $('#page').replaceChildren(page);
  try { await VIEWS[key](page, arg, new URLSearchParams(q || '')); }
  catch (e) { if (e.status === 401 && !S.session) return authView('in', 'انتهت الجلسة — سجّل الدخول مجدداً'); if (page.isConnected) page.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

const cache = {};
async function employeesMap(force) { if (force || !cache.emps) { cache.emps = await db.get('employees', { company_id: 'eq.' + S.cid, order: 'emp_no' }); } const m = {}; cache.emps.forEach(e => m[e.id] = e); return m; }
async function pendingForMe() {
  const reqs = await db.get('requests', { company_id: 'eq.' + S.cid, status: 'eq.pending', order: 'created_at' });
  if (!reqs.length) return [];
  const ids = [...new Set(reqs.map(r => r.employee_id))];
  const emps = await db.get('employees', { id: 'in.(' + ids.join(',') + ')', select: 'id,manager_id,department_id,full_name,emp_no' });
  const em = {}; emps.forEach(e => em[e.id] = e);
  return reqs.filter(r => canAct(r, em[r.employee_id])).map(r => Object.assign(r, { _emp: em[r.employee_id] }));
}
function canAct(r, e) {
  const st = r.route[r.step]; if (!st) return false;
  if (S.emp && r.employee_id === S.emp) return false;
  if (st === 'm') return !!(e && S.emp && e.manager_id === S.emp);
  if (st === 'p') return has('hr', 'admin');
  if (st === 'f') return has('finance');
  if (st === 'g') return has('owner');
  return false;
}

// Art. 109: annual leave accrues daily — 21 days a year, 30 after five continuous years
async function leaveBalance() {
  if (!S.myEmp) return { ent: 0, used: 0, left: 0 };
  const [b] = await db.rpc('annual_leave_balance', { p_emp: S.emp });
  const yrs = (new Date(today()) - new Date(S.myEmp.hire_date)) / 864e5 / 365;
  return { ent: yrs >= 5 ? 30 : 21, used: n0(b && b.taken), left: Math.floor(n0(b && b.balance)) };
}

// temporary password HR hands over; the employee must replace it at first sign-in
function tempPassword() {
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', r = crypto.getRandomValues(new Uint32Array(8));
  let p = ''; for (const x of r) p += A[x % A.length]; return p;
}
function createStaffLogin(e) {
  if (!/^[A-Za-z0-9_-]{1,20}$/.test(e.emp_no)) return toast('الرقم الوظيفي يجب أن يكون أرقاماً أو حروفاً إنجليزية ليُستخدم في الدخول');

    ok: 'إنشاء الدخول', onOk: async f => {

async function payrollRun(page, id) {

  const sum = k => lines.reduce((a, l) => a + n0(l[k]), 0);
  const draft = run.status === 'draft';
  page.innerHTML = `<div class="head"><div><a href="#/payroll" class="small">← المسيرات</a><h1>مسير ${run.month}/${run.year} ${badge(run.status)}</h1><div class="muted">${lines.length} موظف · الصافي <b class="num">${money(sum('net'))}</b></div></div>
    <div class="row">${draft && isHR() ? '<button class="btn" id="re">إعادة الاحتساب</button>' : ''}${draft && has('owner', 'finance') ? '<button class="btn pri" id="ap">اعتماد وترحيل القيد</button>' : ''}${run.status === 'approved' && has('owner', 'finance') ? '<button class="btn pri" id="pd">تسجيل الصرف</button>' : ''}${run.status !== 'draft' ? '<button class="btn" id="wps">ملف حماية الأجور</button>' : ''}</div></div>
    ${draft && !has('owner', 'finance') ? '<div class="note">بعد المراجعة يعتمده المدير العام أو المدير المالي.</div>' : ''}
    ${tbl([{ t: 'الموظف', h: l => esc((em[l.employee_id] || {}).full_name || '') }, { t: 'الإجمالي', r: 1, h: l => money(l.gross) }, { t: 'إضافي', r: 1, h: l => money(l.overtime) }, { t: 'مكافأة', r: 1, h: l => money(l.bonus) },
      { t: 'التأمينات', r: 1, h: l => money(l.gosi) }, { t: 'بدون أجر', r: 1, h: l => money(l.absence) }, { t: 'غياب وتأخير', r: 1, h: l => money(n0(l.att_absence) + n0(l.late_deduction)) }, { t: 'مرضية', r: 1, h: l => money(l.sick_deduction) }, { t: 'غرامات وجزاءات', r: 1, h: l => money(n0(l.deductions) + n0(l.penalty_fine)) }, { t: 'تلفيات', r: 1, h: l => money(l.damages) }, { t: 'سلفة', r: 1, h: l => money(l.advance) }, { t: 'الصافي', r: 1, h: l => '<b>' + money(l.net) + '</b>' }],
      lines, { onRow: true, foot: `<td>الإجمالي</td>${['gross', 'overtime', 'bonus', 'gosi', 'absence', 'att', 'sick_deduction', 'fines', 'damages', 'advance', 'net'].map(k => `<td class="r num">${money(k === 'att' ? sum('att_absence') + sum('late_deduction') : k === 'fines' ? sum('deductions') + sum('penalty_fine') : sum(k))}</td>`).join('')}` })}
    <p class="muted small">المرضية: أول 30 يوماً بأجر كامل، ثم 60 يوماً بثلاثة أرباع الأجر، ثم 30 يوماً بدون أجر خلال سنة الإجازة المرضية (م117). قسط السلفة لا يتجاوز 10% من الأجر (م92)، ومجموع الحسميات لا يتجاوز نصف الأجر (م93).</p>
    <p class="muted small">حصة المنشأة في التأمينات: <span class="num">${money(sum('employer_gosi'))}</span></p>`;
  bindRows(page, lines, l => {

function wpsFile(run, lines, em) {
  const miss = lines.filter(l => !(em[l.employee_id] || {}).iban || !(em[l.employee_id] || {}).national_id);
  const rows = lines.map(l => { const e = em[l.employee_id] || {}; return [e.national_id || '', e.full_name || '', e.iban || '', r2(l.basic).toFixed(2), r2(l.housing).toFixed(2), r2(n0(l.transport) + n0(l.allowances) + n0(l.overtime) + n0(l.bonus)).toFixed(2), r2(n0(l.gosi) + n0(l.absence) + n0(l.att_absence) + n0(l.late_deduction) + n0(l.sick_deduction) + n0(l.deductions) + n0(l.penalty_fine) + n0(l.damages) + n0(l.advance)).toFixed(2), r2(l.net).toFixed(2)].join(','); });
  const csv = '﻿' + ['national_id,name,iban,basic,housing,other_earnings,deductions,net', ...rows].join('\r\n');
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  modal('ملف حماية الأجور', `${miss.length ? `<div class="err">${miss.length} موظف بلا آيبان أو رقم هوية — أكملها قبل الرفع.</div>` : ''}<p>ملف CSV بالحقول المطلوبة لرفع الرواتب في «مدد» أو البنك. راجع قالب بنكك قبل الرفع، فبعض البنوك تطلب ترتيب أعمدة مختلفاً.</p><a class="btn pri" download="wps-${run.year}-${String(run.month).padStart(2, '0')}.csv" href="${url}">تنزيل الملف</a>`);
}

const ratingTxt = o => o == null ? '—' : `<span class="num">${(+o).toFixed(2)}</span> ${esc(RATING[Math.min(5, Math.max(1, Math.round(+o)))])}`;

VIEWS['#/reviews'] = async (page, arg) => {
  if (arg) return reviewCycle(page, arg);
  const hr = isHR();
  const [cycles, revs, em] = await Promise.all([db.get('review_cycles', { company_id: 'eq.' + S.cid, order: 'period_end.desc' }), db.get('reviews', { company_id: 'eq.' + S.cid }), employeesMap().catch(() => ({}))]);
  const cyc = {}; cycles.forEach(c => cyc[c.id] = c);
  const mine = revs.filter(r => r.employee_id === S.emp && r.status === 'approved');
  const team = revs.filter(r => S.emp && r.reviewer_id === S.emp && r.employee_id !== S.emp && cyc[r.cycle_id] && cyc[r.cycle_id].status === 'open');
  const nm = id => esc((em[id] || {}).full_name || '—');
  page.innerHTML = `<div class="head"><div><h1>تقييم الأداء</h1><div class="muted">أهداف بأوزان ودرجات من 1 إلى 5، يقيّم المدير المباشر وتعتمد الموارد البشرية ثم يطّلع الموظف</div></div>${hr ? '<button class="btn pri" id="nc">دورة تقييم جديدة</button>' : ''}</div>
    ${team.length ? `<h2>تقييم فريقي</h2>${tbl([{ t: 'الموظف', h: r => nm(r.employee_id) }, { t: 'الدورة', h: r => esc(cyc[r.cycle_id].name) }, { t: 'الحالة', h: r => rvBadge(r.status) }, { t: 'النتيجة', h: r => ratingTxt(r.overall) }], team, { onRow: true })}<div style="height:18px"></div>` : ''}
    ${S.emp ? `<h2>تقييماتي</h2>${tbl([{ t: 'الدورة', h: r => esc((cyc[r.cycle_id] || {}).name || '') }, { t: 'النتيجة', h: r => ratingTxt(r.overall) }, { t: 'الاطلاع', h: r => r.ack_at ? '<span class="badge ok">اطّلعت</span>' : '<span class="badge wait">بانتظار اطلاعك</span>' }], mine, { empty: 'لا توجد تقييمات معتمدة لك بعد', onRow: true })}<div style="height:18px"></div>` : ''}
    ${hr ? `<h2>دورات التقييم</h2>${tbl([{ t: 'الدورة', k: 'name' }, { t: 'الفترة', h: c => fdate(c.period_start) + ' → ' + fdate(c.period_end) }, { t: 'الإنجاز', h: c => { const rs = revs.filter(r => r.cycle_id === c.id); return `<span class="num">${rs.filter(r => r.status === 'approved').length}/${rs.length}</span>`; } }, { t: 'الحالة', h: c => c.status === 'open' ? '<span class="badge info">مفتوحة</span>' : '<span class="badge">مغلقة</span>' }], cycles, { empty: 'لم تبدأ أي دورة تقييم', onRow: true })}` : ''}`;
  const tbls = $$('.tw', page); let i = 0;
  if (team.length) bindRows(tbls[i++], team, r => reviewForm(r, em, cyc[r.cycle_id]));
  if (S.emp) bindRows(tbls[i++], mine, r => reviewView(r, em, cyc[r.cycle_id], { ack: !r.ack_at }));
  if (hr) bindRows(tbls[i++], cycles, c => location.hash = '#/reviews/' + c.id);
  if ($('#nc', page)) $('#nc', page).onclick = () => { const y = new Date().getFullYear();
    modal('دورة تقييم جديدة', `<div class="fg">${field('اسم الدورة', inp('n', 'تقييم الأداء ' + y))}${enF('ne', 'Performance review ' + y)}${field('من', `<input type="date" name="s" value="${y}-01-01">`)}${field('إلى', `<input type="date" name="e" value="${y}-12-31">`)}</div><p class="muted small">يُنشأ تقييم لكل موظف على رأس العمل، ويكون المقيّم مديره المباشر. من ليس له مدير مباشر تقيّمه الموارد البشرية.</p>`, {
      ok: 'بدء الدورة', onOk: async f => { const id = await db.rpc('start_review_cycle', { p_company: S.cid, p_name: f.n, p_start: f.s, p_end: f.e }); if ((f.ne || '').trim()) await db.rpc('review_cycle_set_name_en', { p_id: id, p_name_en: f.ne }); location.hash = '#/reviews/' + id; } }); };
};
async function reviewCycle(page, id) {
  const [[c], revs, em] = await Promise.all([db.get('review_cycles', { id: 'eq.' + id }), db.get('reviews', { cycle_id: 'eq.' + id }), employeesMap()]);
  if (!c) throw new Error('الدورة غير موجودة');
  revs.sort((a, b) => String((em[a.employee_id] || {}).emp_no).localeCompare(String((em[b.employee_id] || {}).emp_no)));
  const nm = i => esc((em[i] || {}).full_name || '—');
  const dist = [1, 2, 3, 4, 5].map(k => revs.filter(r => r.status === 'approved' && Math.round(+r.overall) === k).length);
  page.innerHTML = `<div class="head"><div><a href="#/reviews" class="small">← تقييم الأداء</a><h1>${esc(c.name)} ${c.status === 'open' ? '<span class="badge info">مفتوحة</span>' : '<span class="badge">مغلقة</span>'}</h1><div class="muted">${fdate(c.period_start)} → ${fdate(c.period_end)}</div></div>${c.status === 'open' ? '<button class="btn" id="cl">إغلاق الدورة</button>' : ''}</div>
    <div class="grid" style="margin-bottom:16px">${[5, 4, 3, 2, 1].map(k => `<div class="card kpi"><div class="muted small">${esc(RATING[k])}</div><div class="v num">${dist[k - 1]}</div></div>`).join('')}</div>
    ${tbl([{ t: 'الموظف', h: r => nm(r.employee_id) }, { t: 'المقيّم', h: r => r.reviewer_id ? nm(r.reviewer_id) : '<span class="muted">الموارد البشرية</span>' }, { t: 'الحالة', h: r => rvBadge(r.status) }, { t: 'النتيجة', h: r => ratingTxt(r.overall) }, { t: 'اطلاع الموظف', h: r => r.ack_at ? '<span class="badge ok">اطّلع</span>' : '—' }], revs, { onRow: true })}`;
  bindRows(page, revs, r => r.status === 'submitted' ? reviewView(r, em, c, { decide: true }) : r.status === 'draft' && c.status === 'open' ? reviewForm(r, em, c) : reviewView(r, em, c));
  if ($('#cl', page)) $('#cl', page).onclick = async () => { if (!await confirmBox('إغلاق الدورة', 'لن يمكن تعديل أي تقييم في هذه الدورة بعد الإغلاق.', 'إغلاق')) return; try { await db.rpc('close_review_cycle', { p_id: id }); route(); } catch (e) { toast(e.message); } };
}
function reviewForm(r, em, c) {
  const goals = (r.goals && r.goals.length ? r.goals : [{ t: '', w: 100, s: null, c: '' }]).map(g => Object.assign({}, g));
  const e = em[r.employee_id] || {};
  const d = modal('تقييم ' + (e.full_name || ''), `<p class="muted small">${esc(c.name)} · ${esc(e.job_title || '')}${r.hr_comment ? ` — <span class="bad">ملاحظة الموارد البشرية: ${esc(r.hr_comment)}</span>` : ''}</p>
    <div class="tw"><table><thead><tr><th>الهدف</th><th>الوزن %</th><th>الدرجة</th><th>تعليق</th><th></th></tr></thead><tbody id="gl"></tbody></table></div>
    <div class="row" style="margin:8px 0 14px"><button type="button" class="btn sm" id="ga">+ هدف</button><span class="sp" style="flex:1"></span><span class="small">مجموع الأوزان: <b class="num" id="gw"></b>% · النتيجة: <b id="go"></b></span></div>
    <div class="fg">${field('نقاط القوة', `<textarea name="st" rows="2">${esc(r.strengths || '')}</textarea>`, 'wide')}${field('مجالات التطوير', `<textarea name="im" rows="2">${esc(r.improvements || '')}</textarea>`, 'wide')}${field('تعليق المقيّم', `<textarea name="cm" rows="2">${esc(r.manager_comment || '')}</textarea>`, 'wide')}</div>
    <p class="muted small">الدرجات: ${[1, 2, 3, 4, 5].map(k => k + ' ' + RATING[k]).join(' · ')}</p>`, {
    wide: true, ok: 'إرسال للاعتماد', onOk: async f => { await save(f, true); toast('أُرسل التقييم للموارد البشرية'); route(); } });
  const save = (f, submit) => db.rpc('save_review', { p_id: r.id, p_goals: goals.map(g => ({ t: g.t.trim(), w: +g.w || 0, s: g.s ? +g.s : null, c: (g.c || '').trim() || undefined })), p_strengths: f.st, p_improvements: f.im, p_comment: f.cm, p_submit: submit });
  const draw = () => {
    $('#gl', d).innerHTML = goals.map((g, i) => `<tr><td style="min-width:200px"><input data-i="${i}" data-k="t" value="${esc(g.t)}" placeholder="مثال: إنجاز المشروع في موعده"></td>
      <td style="width:90px"><input data-i="${i}" data-k="w" type="number" min="0" max="100" value="${esc(g.w)}"></td>
      <td style="width:150px"><select data-i="${i}" data-k="s"><option value="">—</option>${[1, 2, 3, 4, 5].map(k => opt(k, k + ' — ' + RATING[k], g.s)).join('')}</select></td>
      <td style="min-width:160px"><input data-i="${i}" data-k="c" value="${esc(g.c || '')}"></td><td><button type="button" class="btn sm danger" data-rm="${i}" aria-label="حذف الهدف">×</button></td></tr>`).join('');
    $$('[data-k]', d).forEach(x => x.oninput = x.onchange = () => { goals[+x.dataset.i][x.dataset.k] = x.value; sums(); });
    $$('[data-rm]', d).forEach(b => b.onclick = () => { goals.splice(+b.dataset.rm, 1); draw(); });
    sums();
  };
  const sums = () => { const w = goals.reduce((a, g) => a + n0(g.w), 0), ok = w === 100 && goals.every(g => g.s);
    $('#gw', d).textContent = w; $('#gw', d).className = 'num ' + (w === 100 ? 'ok' : 'bad');
    $('#go', d).innerHTML = ok ? ratingTxt(goals.reduce((a, g) => a + n0(g.w) * n0(g.s), 0) / 100) : '—'; };
  $('#ga', d).onclick = () => { if (goals.length < 10) { goals.push({ t: '', w: 0, s: null, c: '' }); draw(); } };
  draw();
  const sv = document.createElement('button'); sv.type = 'button'; sv.className = 'btn'; sv.textContent = 'حفظ كمسودة';
  $('.df', d).insertBefore(sv, $('#mok', d));
  sv.onclick = async () => { try { await busy(sv, () => save(formData($('#mform', d)), false)); d.close(); toast('حُفظت المسودة'); route(); } catch (er) { showErr($('#merr', d), er); } };
}
function reviewView(r, em, c, { decide, ack } = {}) {
  const e = em[r.employee_id] || S.myEmp || {};
  const body = `<p><b>${esc(e.full_name || '')}</b> <span class="muted">${esc(c ? c.name : '')}</span> ${rvBadge(r.status)}</p>
    <div class="tw"><table><thead><tr><th>الهدف</th><th class="r">الوزن</th><th class="r">الدرجة</th><th>تعليق</th></tr></thead><tbody>${(r.goals || []).map(g => `<tr><td>${esc(g.t)}</td><td class="r num">${esc(g.w)}%</td><td class="r num">${g.s ? esc(g.s) : '—'}</td><td>${esc(g.c || '')}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td>النتيجة</td><td></td><td class="r" colspan="2">${ratingTxt(r.overall)}</td></tr></tfoot></table></div>
    ${r.strengths ? `<p><b>نقاط القوة:</b> ${esc(r.strengths)}</p>` : ''}${r.improvements ? `<p><b>مجالات التطوير:</b> ${esc(r.improvements)}</p>` : ''}${r.manager_comment ? `<p><b>تعليق المقيّم:</b> ${esc(r.manager_comment)}</p>` : ''}
    ${r.hr_comment ? `<p><b>ملاحظة الموارد البشرية:</b> ${esc(r.hr_comment)}</p>` : ''}${r.ack_at ? `<p class="muted small">اطّلع الموظف في ${fdate(r.ack_at)}${r.employee_comment ? ': ' + esc(r.employee_comment) : ''}</p>` : ''}
    ${decide ? field('ملاحظة (إلزامية عند الإعادة)', '<textarea name="note" rows="2"></textarea>') : ''}${ack ? field('تعليقك (اختياري)', '<textarea name="note" rows="2"></textarea>') : ''}`;
  const d = modal('تقييم الأداء', body, decide ? { ok: 'اعتماد', onOk: async f => { await db.rpc('decide_review', { p_id: r.id, p_approve: true, p_comment: blank(f.note) }); toast('اعتُمد التقييم'); route(); } }
    : ack ? { ok: 'اطّلعت على التقييم', onOk: async f => { await db.rpc('acknowledge_review', { p_id: r.id, p_comment: blank(f.note) }); toast('شكراً، سُجّل اطلاعك'); route(); } } : {});
  if (decide) {
    const rb = document.createElement('button'); rb.type = 'button'; rb.className = 'btn danger'; rb.textContent = 'إعادة للمقيّم';
    $('.df', d).insertBefore(rb, $('#mok', d));
    rb.onclick = async () => { try { await busy(rb, () => db.rpc('decide_review', { p_id: r.id, p_approve: false, p_comment: $('#mform', d).note.value })); d.close(); toast('أُعيد التقييم للمقيّم'); route(); } catch (er) { showErr($('#merr', d), er); } };
  }
}

/* ===== recruitment ===== */
const STAGES = { applied: 'تقدّم', screening: 'فرز أولي', interview: 'مقابلة', offer: 'عرض وظيفي', hired: 'تم التعيين', rejected: 'مرفوض' };
const STAGE_CLS = { applied: '', screening: 'info', interview: 'info', offer: 'wait', hired: 'ok', rejected: 'bad' };
const OPEN_ST = { open: ['مفتوحة', 'ok'], onhold: ['معلّقة', 'wait'], closed: ['مغلقة', ''] };
const stBadge = s => `<span class="badge ${STAGE_CLS[s]}">${esc(STAGES[s])}</span>`;
VIEWS['#/recruit'] = async (page, arg) => {
  if (!isHR()) { page.innerHTML = '<div class="note">هذه الصفحة للموارد البشرية.</div>'; return; }
  if (arg) return opening(page, arg);
  const [ops, cands, deps] = await Promise.all([db.get('job_openings', { company_id: 'eq.' + S.cid, order: 'created_at.desc' }), db.get('candidates', { company_id: 'eq.' + S.cid, select: 'opening_id,stage' }), db.get('departments', { company_id: 'eq.' + S.cid, order: 'name' })]);
  const dm = {}; deps.forEach(d => dm[d.id] = d.name);
  const cnt = (o, f) => cands.filter(c => c.opening_id === o.id && f(c)).length;
  page.innerHTML = `<div class="head"><div><h1>التوظيف</h1><div class="muted">الوظائف الشاغرة والمرشحون حتى التعيين</div></div><button class="btn pri" id="no">وظيفة شاغرة جديدة</button></div>
    ${tbl([{ t: 'الوظيفة', k: 'title' }, { t: 'القسم', h: o => esc(dm[o.department_id] || '—') }, { t: 'العدد', r: 1, h: o => o.positions }, { t: 'المرشحون', r: 1, h: o => cnt(o, () => true) }, { t: 'في المقابلات', r: 1, h: o => cnt(o, c => c.stage === 'interview') }, { t: 'عُيّن', r: 1, h: o => cnt(o, c => c.stage === 'hired') }, { t: 'الحالة', h: o => `<span class="badge ${OPEN_ST[o.status][1]}">${esc(OPEN_ST[o.status][0])}</span>` }], ops, { empty: 'لا توجد وظائف شاغرة', onRow: true })}`;
  bindRows(page, ops, o => location.hash = '#/recruit/' + o.id);
  $('#no', page).onclick = () => openingForm(null, deps);
};
function openingForm(o, deps) {
  const v = o || { positions: 1, status: 'open' };
  modal(o ? 'تعديل الوظيفة' : 'وظيفة شاغرة جديدة', `<div class="fg">${field('المسمى الوظيفي', inp('title', v.title, 'required'))}${enF('title_en', v.title_en, 'المسمى الوظيفي بالإنجليزية')}${field('القسم', `<select name="dep"><option value="">—</option>${deps.map(d => opt(d.id, d.name, v.department_id)).join('')}</select>`)}
    ${field('عدد الشواغر', inp('pos', v.positions, 'type="number" min="1" max="100"'))}${field('الحالة', `<select name="st">${Object.entries(OPEN_ST).map(([k, [t]]) => opt(k, t, v.status)).join('')}</select>`)}
    ${field('الوصف والمتطلبات', `<textarea name="desc" rows="4">${esc(v.description || '')}</textarea>`, 'wide')}</div>`, {
    onOk: async f => { if (f.title.length < 2) throw new Error('أدخل المسمى الوظيفي');
      const row = { title: f.title, title_en: blank((f.title_en || '').trim()), department_id: blank(f.dep), positions: +f.pos || 1, status: f.st, description: blank(f.desc) };
      if (o) await db.upd('job_openings', { id: 'eq.' + o.id }, row); else { const [x] = await db.ins('job_openings', Object.assign(row, { company_id: S.cid })); location.hash = '#/recruit/' + x.id; return; }
      route(); } });
}
async function opening(page, id) {
  const [[o], cands, deps] = await Promise.all([db.get('job_openings', { id: 'eq.' + id }), db.get('candidates', { opening_id: 'eq.' + id, order: 'created_at' }), db.get('departments', { company_id: 'eq.' + S.cid, order: 'name' })]);
  if (!o) throw new Error('الوظيفة غير موجودة');
  const by = s => cands.filter(c => c.stage === s).length;
  page.innerHTML = `<div class="head"><div><a href="#/recruit" class="small">← التوظيف</a><h1>${esc(o.title)} <span class="badge ${OPEN_ST[o.status][1]}">${esc(OPEN_ST[o.status][0])}</span></h1><div class="muted">${o.positions} شاغر · ${by('hired')} عُيّن</div></div>
    <div class="row"><button class="btn" id="eo">تعديل الوظيفة</button><button class="btn pri" id="nc">إضافة مرشح</button></div></div>
    ${o.description ? `<div class="card" style="white-space:pre-wrap">${esc(o.description)}</div>` : ''}
    <div class="grid" style="margin-bottom:16px">${Object.keys(STAGES).map(s => `<div class="card kpi"><div class="muted small">${esc(STAGES[s])}</div><div class="v num">${by(s)}</div></div>`).join('')}</div>
    ${tbl([{ t: 'المرشح', k: 'full_name' }, { t: 'الجوال', h: c => `<span class="num">${esc(c.phone || '—')}</span>` }, { t: 'الجنسية', h: c => c.is_saudi ? 'سعودي' : 'غير سعودي' }, { t: 'الراتب المتوقع', r: 1, h: c => money(c.expected_salary) }, { t: 'التقييم', h: c => c.rating ? '★'.repeat(c.rating) : '—' }, { t: 'المقابلة', h: c => c.interview_at ? `<span class="num">${esc(String(c.interview_at).slice(0, 16).replace('T', ' '))}</span>` : '—' }, { t: 'المرحلة', h: c => stBadge(c.stage) }], cands, { empty: 'لا يوجد مرشحون بعد', onRow: true })}`;
  bindRows(page, cands, c => candidateForm(c, o, deps));
  $('#nc', page).onclick = () => candidateForm(null, o, deps);
  $('#eo', page).onclick = () => openingForm(o, deps);
}
function candidateForm(c, o, deps) {
  const v = c || { is_saudi: true, gender: 'm', stage: 'applied' };
  const locked = v.stage === 'hired';
  const stages = Object.entries(STAGES).filter(([k]) => k !== 'hired' || locked);
  const local = v.interview_at ? new Date(new Date(v.interview_at).getTime() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16) : '';
  const d = modal(c ? 'المرشح: ' + c.full_name : 'مرشح جديد — ' + o.title, `<div class="fg">
    ${field('الاسم الكامل', inp('full_name', v.full_name, 'required'))}${enF('full_name_en', v.full_name_en)}${field('الجوال', inp('phone', v.phone, 'dir="ltr" placeholder="05XXXXXXXX"'))}${field('البريد', inp('email', v.email, 'dir="ltr" type="email"'))}
    ${field('رقم الهوية/الإقامة', inp('national_id', v.national_id, 'dir="ltr" inputmode="numeric" maxlength="10"'))}
    ${field('الجنسية', `<select name="is_saudi">${opt('true', 'سعودي', String(v.is_saudi))}${opt('false', 'غير سعودي', String(v.is_saudi))}</select>`)}
    ${field('الجنس', `<select name="gender">${opt('m', 'ذكر', v.gender)}${opt('f', 'أنثى', v.gender)}</select>`)}
    ${field('الراتب المتوقع', inp('sal', v.expected_salary, 'type="number" step="0.01" min="0"'))}
    ${field('المرحلة', `<select name="stage" ${locked ? 'disabled' : ''}>${stages.map(([k, t]) => opt(k, t, v.stage)).join('')}</select>`)}
    ${field('موعد المقابلة', `<input type="datetime-local" name="iv" value="${local}">`)}
    ${field('تقييم المقابلة', `<select name="rating"><option value="">—</option>${[1, 2, 3, 4, 5].map(k => opt(k, '★'.repeat(k), v.rating)).join('')}</select>`)}
    ${field('ملاحظات', `<textarea name="notes" rows="3">${esc(v.notes || '')}</textarea>`, 'wide')}
    ${c && !['hired', 'rejected'].includes(c.stage) ? '<div class="wide"><button type="button" class="btn pri" id="hire">تعيين وإنشاء سجل موظف</button></div>' : ''}
    ${locked ? '<div class="wide note">عُيّن هذا المرشح وأُنشئ سجله في «الموظفون».</div>' : ''}</div>`, {
    wide: true, onOk: async f => {

const monthEnd = ym => { const [y, m] = ym.split('-').map(Number); return new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10); };
const dayName = d => DOW[new Date(d + 'T12:00:00Z').getUTCDay()];
const attOn = () => !!(S.company && S.company.att_enabled);

/* ---------- employee: my attendance ---------- */

  const from = ym + '-01', to = monthEnd(ym) < rToday() ? monthEnd(ym) : rToday();
  const rows = from <= to ? await db.rpc('att_sheet', { p_company: S.cid, p_from: from, p_to: to, p_emp: S.emp }) : [];
  rows.reverse();
  const cnt = s => rows.filter(r => s.includes(r.status)).length;
  const prev = new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5) - 2, 1)).toISOString().slice(0, 7), next = new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5), 1)).toISOString().slice(0, 7);
  page.innerHTML = `<div class="head"><div><h1>الحضور والانصراف</h1><div class="muted">${esc(S.myEmp ? S.myEmp.full_name : '')}</div></div></div>
    ${attOn() ? await clockCard() : `<div class="note">تسجيل الحضور غير مفعّل في منشأتك.${isHR() ? ' <a href="#/att/settings">فعّله من الإعدادات</a>' : ''}</div>`}
    <div class="row" style="margin:14px 0 10px;align-items:center"><a class="btn sm" href="#/attendance/${prev}">→</a><b class="num">${ym}</b>${next <= rToday().slice(0, 7) ? `<a class="btn sm" href="#/attendance/${next}">←</a>` : ''}</div>
    <div class="grid" style="margin-bottom:14px">
      <div class="card kpi"><div class="muted small">أيام الحضور</div><div class="v num">${cnt(['present', 'late', 'open', 'nocheckout'])}</div></div>
      <div class="card kpi"><div class="muted small">أيام الغياب</div><div class="v num ${cnt(['absent']) ? 'bad' : ''}">${cnt(['absent'])}</div></div>
      <div class="card kpi"><div class="muted small">دقائق التأخير</div><div class="v num">${rows.reduce((a, r) => a + n0(r.late_min), 0)}</div></div>
      <div class="card kpi"><div class="muted small">إضافي معتمد</div><div class="v num">${mins(rows.reduce((a, r) => a + n0(r.ot_min), 0))}</div></div></div>
    ${tbl([{ t: 'التاريخ', h: r => `${esc(dayName(r.day))} <span class="num muted">${fdate(r.day)}</span>` }, { t: 'الحالة', h: r => atBadge(r.status) }, { t: 'الحضور', h: r => `<span class="num">${hm(r.check_in)}</span>` },
      { t: 'الانصراف', h: r => `<span class="num">${hm(r.check_out)}</span>` }, { t: 'التأخير', h: lateCell }, { t: 'إضافي', h: r => r.extra_min ? mins(r.extra_min) + (r.ot_min ? ` <span class="ok small">(معتمد ${mins(r.ot_min)})</span>` : '') : '—' },
      { t: 'ملاحظة', h: r => r.source === 'hr' ? `<span class="muted small">عدّلته الموارد البشرية: ${esc(r.note || '')}</span>` : '' }], rows.filter(r => r.status !== 'na'), { empty: 'لا توجد بيانات' })}`;
  bindClock(page);
};
async function clockCard() {
  const [t] = await db.rpc('att_sheet', { p_company: S.cid, p_from: rToday(), p_to: rToday(), p_emp: S.emp }).catch(() => []);
  const [sh] = S.myEmp && S.myEmp.shift_id ? await db.get('shifts', { id: 'eq.' + S.myEmp.shift_id }) : await db.get('shifts', { company_id: 'eq.' + S.cid, is_default: 'is.true' });
  if (S.myEmp && S.myEmp.att_exempt) return '<div class="note">أنت معفى من تسجيل الحضور.</div>';
  const done = t && t.check_out, inside = t && t.check_in && !t.check_out;
  return `<div class="card clock"><div><div class="muted small">${esc(dayName(rToday()))} <span class="num">${rToday()}</span>${sh ? ` · ${esc(sh.name)} <span class="num">${sh.start_time.slice(0, 5)}–${sh.end_time.slice(0, 5)}</span>` : ''}</div>
      <div style="margin:4px 0 2px">${t ? atBadge(t.status) : ''} ${t && t.check_in ? `حضور <b class="num">${hm(t.check_in)}</b>` : ''} ${t && t.check_out ? ` · انصراف <b class="num">${hm(t.check_out)}</b>` : ''}</div>
      ${t && t.late_min ? `<div class="small bad">تأخير ${mins(t.late_min)}</div>` : ''}</div>
    ${done ? '<div class="muted">سجّلت الحضور والانصراف لهذا اليوم</div>' : `<button class="btn pri big" id="clk">${inside ? 'تسجيل الانصراف' : 'تسجيل الحضور'}</button>`}
    <div id="clkerr" style="width:100%"></div></div>`;
}
function bindClock(page) {
  const b = $('#clk', page); if (!b) return;
  b.onclick = () => busy(b, async () => {
    $('#clkerr', page).innerHTML = '';
    let pos = null;
    try { pos = await new Promise((res, rej) => navigator.geolocation ? navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }) : rej(new Error('no geolocation'))); }
    catch (e) { pos = null; }
    try {
      const r = await db.rpc('clock', pos ? { p_company: S.cid, p_lat: +pos.coords.latitude.toFixed(6), p_lng: +pos.coords.longitude.toFixed(6), p_acc: Math.round(pos.coords.accuracy) } : { p_company: S.cid });
      toast(r.action === 'in' ? 'سُجّل حضورك ' + hm(r.at) + (r.late_min ? ' — تأخير ' + mins(r.late_min) : '') : 'سُجّل انصرافك ' + hm(r.at));
      route();
    } catch (e) { showErr($('#clkerr', page), e); }
  });
}

async function attToday(box) {

  const c = s => rows.filter(r => s.includes(r.status)).length;
  box.innerHTML = `<div class="grid" style="margin-bottom:14px">

      <div class="card kpi"><div class="muted small">متأخرون</div><div class="v num">${rows.filter(r => n0(r.late_min) > 0).length}</div></div>

      rows.filter(r => r.status !== 'na'), { empty: 'لا يوجد موظفون', onRow: isHR() })}
    <p class="muted small">يوم <span class="num">${d}</span> بتوقيت الرياض.${isHR() ? ' اضغط على أي موظف لتعديل حضوره.' : ''}</p>`;

async function attMonth(box, sub) {

  const from = ym + '-01', to = monthEnd(ym) < rToday() ? monthEnd(ym) : rToday();
  const em = await employeesMap(true);
  const rows = from <= to ? await db.rpc('att_sheet', { p_company: S.cid, p_from: from, p_to: to, p_emp: empArg || null }) : [];
  const ids = [...new Set(rows.map(r => r.employee_id))];
  const pick = `<div class="row" style="margin-bottom:12px;align-items:end"><div><label>الشهر</label><input type="month" id="amy" value="${ym}" max="${rToday().slice(0, 7)}"></div>
    <div><label>الموظف</label><select id="ame"><option value="">كل الموظفين</option>${Object.values(em).filter(e => !e.att_exempt).map(e => opt(e.id, e.full_name + ' (' + e.emp_no + ')', empArg || '')).join('')}</select></div></div>`;
  if (empArg) {
    box.innerHTML = pick + tbl([{ t: 'التاريخ', h: r => `${esc(dayName(r.day))} <span class="num muted">${fdate(r.day)}</span>` }, { t: 'الحالة', h: r => atBadge(r.status) }, { t: 'الحضور', h: r => `<span class="num">${hm(r.check_in)}</span>` }, { t: 'الانصراف', h: r => `<span class="num">${hm(r.check_out)}</span>` },
      { t: 'التأخير', h: lateCell }, { t: 'خروج مبكر', h: r => mins(r.early_min) }, { t: 'إضافي', h: r => mins(r.extra_min) }, { t: 'إضافي معتمد', h: r => r.ot_min ? `<span class="ok">${mins(r.ot_min)}</span>` : '—' }, { t: 'ملاحظة', h: r => esc(r.note || '') }],
      rows.filter(r => r.status !== 'na'), { empty: 'لا توجد بيانات', onRow: isHR() });
    if (isHR()) bindRows(box, rows.filter(r => r.status !== 'na'), r => attEdit(r, em));
  } else {
    const sumBy = id => { const l = rows.filter(r => r.employee_id === id); const n = s => l.filter(r => s.includes(r.status)).length;
      return { id, present: n(['present', 'late', 'open', 'nocheckout']), absent: n(['absent']), leave: n(['leave']), noout: n(['nocheckout']), late: l.reduce((a, r) => a + n0(r.late_min), 0), extra: l.reduce((a, r) => a + n0(r.extra_min), 0), ot: l.reduce((a, r) => a + n0(r.ot_min), 0) }; };
    const sums = ids.map(sumBy);
    box.innerHTML = pick + tbl([{ t: 'الموظف', h: x => esc((em[x.id] || {}).full_name || '') }, { t: 'حضور', r: 1, h: x => x.present }, { t: 'غياب', r: 1, h: x => x.absent ? `<span class="bad">${x.absent}</span>` : 0 }, { t: 'إجازة', r: 1, h: x => x.leave },
      { t: 'بدون انصراف', r: 1, h: x => x.noout ? `<span class="bad">${x.noout}</span>` : 0 }, { t: 'التأخير', h: x => mins(x.late) }, { t: 'إضافي', h: x => mins(x.extra) }, { t: 'إضافي معتمد', h: x => mins(x.ot) }], sums, { empty: 'لا يوجد موظفون', onRow: true })
      + `<p class="muted small">الغياب والتأخير والإضافي المعتمد تنتقل إلى مسير الرواتب عند إعداده. الإضافي لا يُحتسب إلا بعد اعتماده (م107).</p>`;
    bindRows(box, sums, x => location.hash = '#/att/month/' + ym + ':' + x.id);
  }
  const go = () => location.hash = '#/att/month/' + ($('#amy', box).value || ym) + ($('#ame', box).value ? ':' + $('#ame', box).value : '');
  $('#amy', box).onchange = go; $('#ame', box).onchange = go;
}
function attEdit(r, em) {

    ${field('سبب التعديل', inp('note', '', 'required placeholder="مثال: نسي تسجيل الانصراف"'), 'wide')}
    ${n0(r.extra_min) ? field('الإضافي المعتمد بالدقائق (من ' + r.extra_min + ')', inp('ot', r.ot_min || 0, `type="number" min="0" max="${r.extra_min}" step="1"`), 'wide') : ''}</div>
    <p class="muted small">اترك وقت الحضور فارغاً لحذف السجل واعتبار اليوم غياباً. التعديل يُحفظ في سجل التدقيق.</p>
    ${n0(r.ot_min) && r.att_id ? '<div class="row"><button type="button" class="btn sm" id="ot2c">تحويل الإضافي المعتمد إلى إجازة تعويضية</button></div>' : ''}`, {

      if (changed || !r.att_id) await db.rpc('att_set', { p_company: S.cid, p_emp: r.employee_id, p_day: r.day, p_in: blank(f.tin), p_out: blank(f.tout), p_note: f.note });
      if (f.ot != null && f.ot !== '' && r.att_id && +f.ot !== n0(r.ot_min)) await db.rpc('att_approve_ot', { p_id: r.att_id, p_minutes: Math.round(+f.ot) });
      toast('تم الحفظ'); route();

  if ($('#ot2c', d)) $('#ot2c', d).onclick = () => { d.close(); modal('تحويل إلى إجازة تعويضية', `<div class="fg">${field('الدقائق المحوّلة (من ' + r.ot_min + ')', inp('m', r.ot_min, `type="number" min="1" max="${r.ot_min}" step="1"`))}${field('ساعات الإجازة عن كل ساعة (1.5 على الأقل)', inp('rate', 1.5, 'type="number" step="0.25" min="1.5"'))}
      <label class="wide row small" style="gap:6px"><input type="checkbox" name="ok"> ${esc('وافق العامل على الإجازة التعويضية بدل أجر العمل الإضافي')}</label></div>
      <p class="muted small">م107 والمادة 22 مكرر من اللائحة: الدقائق المحوّلة لا تُصرف في المسير، وتُضاف لرصيد الإجازة التعويضية للموظف.</p>`, {
      ok: 'تحويل', onOk: async f => { await db.rpc('att_ot_to_comp', { p_att: r.att_id, p_minutes: Math.round(+f.m || 0), p_rate: +f.rate || 0, p_consent: !!f.ok }); toast('أُضيفت للإجازة التعويضية'); route(); } }); };
  return d;
}

// leave overlap inside the requester's team, shown to whoever decides the request
async function teamOverlap(r) {

  if (!os.length) return '<p class="small ok">لا أحد من الفريق في إجازة خلال هذه الفترة.</p>';
  const em = await db.get('employees', { id: 'in.(' + [...new Set(os.map(o => o.employee_id))].join(',') + ')', select: 'id,full_name,manager_id,department_id' }).catch(() => []);
  const mates = em.filter(x => (r._emp.manager_id && x.manager_id === r._emp.manager_id) || (r._emp.department_id && x.department_id === r._emp.department_id));

'use strict';
/* ===== letter templates, rendered on an A4 sheet (210 × 297 mm). The sheet is always in the language chosen for the
   letter (data-nt keeps the UI translator away), so this file is skipped by i18n/extract.py. ===== */
function hijriOf(d, en) {
  try { return new Intl.DateTimeFormat(en ? 'en-GB-u-ca-islamic-umalqura' : 'ar-SA-u-ca-islamic-umalqura-nu-latn', { day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(String(d).slice(0, 10) + 'T12:00:00')); } catch (e) { return ''; }
}
const gregOf = (d, en) => { const s = String(d || '').slice(0, 10); if (!s) return '—'; return en ? new Date(s + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) : s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) + 'م'; };
// service length between two dates, inclusive of both ends
function servicePeriod(a, b) {
  const s = new Date(String(a).slice(0, 10) + 'T12:00:00'), e = new Date(String(b).slice(0, 10) + 'T12:00:00'); e.setDate(e.getDate() + 1);
  let y = e.getFullYear() - s.getFullYear(), m = e.getMonth() - s.getMonth(), d = e.getDate() - s.getDate();
  if (d < 0) { m--; d += new Date(e.getFullYear(), e.getMonth(), 0).getDate(); }
  if (m < 0) { y--; m += 12; }
  return { y, m, d };
}
function periodTxt(p, en) {
  if (en) return [[p.y, 'year'], [p.m, 'month'], [p.d, 'day']].filter(x => x[0]).map(([n, w]) => n + ' ' + w + (n === 1 ? '' : 's')).join(', ') || '0 days';
  const u = (n, one, two, few, many) => n === 1 ? one : n === 2 ? two : n <= 10 ? n + ' ' + few : n + ' ' + many;
  return [p.y && u(p.y, 'سنة', 'سنتان', 'سنوات', 'سنة'), p.m && u(p.m, 'شهر', 'شهران', 'أشهر', 'شهراً'), p.d && u(p.d, 'يوم', 'يومان', 'أيام', 'يوماً')].filter(Boolean).join(' و') || '0';
}

  const w = D.wage && typeof D.wage === 'object' ? D.wage : null, svc = l.kind === 'service';
  const logo = S.company && S.company.id === l.company_id ? S.company.logo : null;   // the company's current logo
  const g = (m, fm) => f ? fm : m, b = s => `<b>${esc(s)}</b>`;
  const comp = en ? (x.company || c.name) : c.name, name = en ? (x.name || e.full_name) : e.full_name, job = en ? (x.job || e.job_title) : e.job_title;
  let nat = e.nationality || ''; if (en && (nat === 'سعودي' || (e.is_saudi && !nat))) nat = 'Saudi'; else if (!en && f && nat === 'سعودي') nat = 'سعودية';
  const sar = v => `<span class="num">${money(v)}</span>`;
  const wageRows = w ? [[en ? 'Basic salary' : 'الراتب الأساسي', w.basic], [en ? 'Housing allowance' : 'بدل السكن', w.housing], [en ? 'Transport allowance' : 'بدل النقل', w.transport], [en ? 'Other allowances' : 'بدلات أخرى', w.other]]

    <tfoot><tr><td>${en ? 'Total monthly salary' : 'إجمالي الراتب الشهري'}</td><td class="amt">${sar(w.gross)}</td></tr></tfoot></table>` : '';
  const idLbl = e.is_saudi ? (en ? 'National ID' : 'هوية وطنية') : (en ? 'Iqama' : 'إقامة');
  const title = svc ? (en ? 'Service Certificate' : 'شهادة خدمة') : w ? (en ? 'Salary Certificate' : 'تعريف بالراتب') : (en ? 'Employment Certificate' : 'خطاب تعريف');

  let body;

    const who = `${g('السيد', 'السيدة')}/ ${b(name)}${nat ? '، الجنسية: ' + esc(nat) : ''}${e.national_id ? `، ${g('ويحمل', 'وتحمل')} ${idLbl} رقم (<span class="num">${esc(e.national_id)}</span>)` : ''}`;

         ${wageTbl}<p>وقد أُعطيت ${g('له', 'لها')} هذه الشهادة بناءً على ${g('طلبه', 'طلبها')} دون مقابل، وفقاً للمادة الرابعة والستين من نظام العمل.</p>`
      : `<p>تفيد ${b(comp)} بأن ${who}، ${g('يعمل', 'تعمل')} لديها ${jobTxt} اعتباراً من ${b(gregOf(e.hire_date))}، ${g('ولا يزال', 'ولا تزال')} على رأس العمل حتى تاريخه${w ? `، ${g('ويتقاضى', 'وتتقاضى')} راتباً شهرياً إجمالياً قدره (${sar(w.gross)}) ريال سعودي، على النحو الآتي:` : '.'}</p>
         ${wageTbl}<p>وقد أُعطي هذا الخطاب بناءً على ${g('طلبه', 'طلبها')} دون أدنى مسؤولية على المنشأة تجاه الغير.</p>`;
    body = `<p>السلام عليكم ورحمة الله وبركاته، وبعد:</p>${body.replace(/ ،/g, '،')}<p class="lt-close">وتفضلوا بقبول فائق الاحترام والتقدير،</p>`;
  } else {
    const t = g('Mr.', 'Ms.'), his = g('his', 'her'), His = g('His', 'Her');
    const who = `${t} ${b(name)}${nat ? ', ' + esc(nat) + ' national' : ''}${e.national_id ? `, holder of ${idLbl} No. <span class="num">${esc(e.national_id)}</span>` : ''}`;
    const jobTxt = job ? ` as ${b(job)}` : '';

      ? `<p>This is to certify that ${who}, was employed by ${b(comp)}${jobTxt} from ${b(gregOf(e.hire_date, 1))} to ${b(gregOf(e.end_date, 1))}, a period of service of ${b(periodTxt(servicePeriod(e.hire_date, e.end_date), 1))}. ${His} last monthly wage was SAR ${sar(w.gross)}, as follows:</p>
         ${wageTbl}<p>This certificate is issued upon ${his} request, free of charge, in accordance with Article 64 of the Saudi Labor Law.</p>`
      : `<p>This is to certify that ${who}, has been employed by ${b(comp)}${jobTxt} since ${b(gregOf(e.hire_date, 1))}, and is still in service as of the date of this letter.${w ? ` ${His} total monthly salary is SAR ${sar(w.gross)}, as follows:` : ''}</p>

    <header class="lt-head"><div class="lt-brand">${logo ? `<img class="lt-logo" src="${esc(logo)}" alt="">` : ''}<div><div class="lt-co">${esc(comp)}</div>${ids ? `<div class="lt-ids">${ids}</div>` : ''}</div></div>
      <div class="lt-meta"><div>${en ? 'Ref.' : 'الرقم'}: <span class="num">${esc(l.ref_no)}</span></div><div>${en ? 'Date' : 'التاريخ'}: <bdi class="num">${gregOf(D.date, en).replace(/م$/, '')}</bdi>${en ? '' : 'م'}</div><div>${en ? 'Hijri' : 'الموافق'}: <bdi>${esc(hijriOf(D.date, en).replace(/\s*(هـ|AH)$/, '') + (en ? ' AH' : 'هـ'))}</bdi></div></div></header>
    <main class="lt-main"><h1 class="lt-title">${title}</h1><p class="lt-to">${to}</p>${body}

}

/* print exactly one A4 page with zero page margins (the sheet carries its own) */
function printSheet(sheet) { const cp = sheet.cloneNode(true); cp.style.zoom = ''; printWith(cp, '@page{size:A4 portrait;margin:0}'); }

/* company logo: resize in the browser (≤ 800×300) and keep it as a small raster data URL */
async function imgToLogo(file) {
  const url = URL.createObjectURL(file);
  try {
    const im = new Image();
    await new Promise((ok, no) => { im.onload = ok; im.onerror = () => no(new Error('تعذّر قراءة الصورة')); im.src = url; });
    let w = im.naturalWidth || 600, h = im.naturalHeight || 240; const k = Math.min(1, 800 / w, 300 / h); w = Math.max(1, Math.round(w * k)); h = Math.max(1, Math.round(h * k));
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const g = cv.getContext('2d'); g.drawImage(im, 0, 0, w, h);
    let d = cv.toDataURL('image/png');
    if (d.length > 190000) { const x = cv.toDataURL('image/webp', 0.9); if (x.startsWith('data:image/webp')) d = x; }
    if (d.length > 190000) { g.globalCompositeOperation = 'destination-over'; g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); d = cv.toDataURL('image/jpeg', 0.85); }
    if (d.length > 190000) throw new Error('الصورة كبيرة جداً');
    return d;
  } finally { URL.revokeObjectURL(url); }
}

function invoiceSheet({ key, doc, lines, party, im, am, paid }) {

  const nm = l => { if (l.item_id) { const it = im[l.item_id] || {}; return [it.name || '', it.name_en || enOf(it.name || '')]; } const a = am[l.account_code] || ''; return [l.account_code + ' — ' + a, l.account_code + ' — ' + enOf(a)]; };

      <div class="iv-title">${L(title[0], title[1])}</div></div>

      <tr><td>${L('رقم الفاتورة', 'Invoice No.')}</td><td class="num">${esc(doc.no)}</td><td>${L('تاريخ الإصدار', 'Issue date')}</td><td class="num">${esc(fdate(doc.date))}</td></tr>
      <tr><td>${L(sale ? 'العميل' : 'المورد', sale ? 'Customer' : 'Supplier')}</td><td>${two(party ? party.name : '', party ? (party.name_en || enOf(party.name)) : '')}</td><td>${L('تاريخ الاستحقاق', 'Due date')}</td><td class="num">${esc(fdate(doc.due_date))}</td></tr>
      ${party && party.vat_no ? `<tr><td>${L('الرقم الضريبي للعميل', "Buyer's VAT No.")}</td><td class="num" colspan="3">${esc(party.vat_no)}</td></tr>` : ''}
      ${doc.supplier_ref ? `<tr><td>${L('رقم فاتورة المورد', "Supplier's ref.")}</td><td class="num" colspan="3">${esc(doc.supplier_ref)}</td></tr>` : ''}
      ${doc.status === 'void' ? `<tr><td colspan="4"><b>${L('ملغاة', 'VOID')}</b></td></tr>` : ''}</tbody></table>
    <table class="iv-lines"><thead><tr><th>${L('البند', 'Item')}</th><th class="r">${L('الكمية', 'Qty')}</th><th class="r">${L('سعر الوحدة', 'Unit price')}</th><th class="r">${L('المبلغ قبل الضريبة', 'Taxable amount')}</th><th class="r">${L('نسبة الضريبة', 'VAT rate')}</th><th class="r">${L('مبلغ الضريبة', 'VAT amount')}</th><th class="r">${L('الإجمالي شامل الضريبة', 'Total incl. VAT')}</th></tr></thead>
      <tbody>${lines.map(l => { const [a, e] = nm(l); return `<tr><td>${two(a, e)}</td><td class="num r">${+l.qty}</td><td class="num r">${money(l.unit_price)}</td><td class="num r">${money(l.amount)}</td><td class="num r">${n0(l.vat_rate)}%</td><td class="num r">${money(vat(l))}</td><td class="num r">${money(n0(l.amount) + vat(l))}</td></tr>`; }).join('')}</tbody></table>

}

async function docsEmployee(page, id) {

/* employee self-service: own documents and contract on the profile page */

  const [docs, cons] = await Promise.all([db.get('employee_documents', { employee_id: 'eq.' + S.emp, order: 'expiry_date.asc.nullslast' }).catch(() => []), db.get('contracts', { employee_id: 'eq.' + S.emp, status: 'eq.active' }).catch(() => [])]);
  if (!docs.length && !cons.length) return '';
  const c = cons[0];
  return `<div class="card"><h2>مستنداتي وعقدي</h2>${c ? `<p class="small">العقد: ${esc(CT_T[c.contract_type])} من ${fdate(c.start_date)}${c.end_date ? ' إلى ' + fdate(c.end_date) : ''}. <span class="muted">${esc(noticeTxt(c))}</span></p>` : ''}
