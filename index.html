<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>وعد — الموارد البشرية والمالية</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8fafc;--surface:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--line2:#cbd5e1;--line3:#f1f5f9;--accent:#2563eb;--accent-ink:#fff;--soft:#eff4ff;--soft2:#f1f5f9;--ok:#0d9488;--okbg:rgba(13,148,136,.10);--bad:#b91c1c;--badbg:rgba(239,68,68,.10);--wait:#b45309;--waitbg:rgba(245,158,11,.12);--prim:#131b2e;--prim-h:#1e293b;--prim-ink:#fff;--sh1:0 1px 3px 0 rgba(15,23,42,.04),0 1px 2px -1px rgba(15,23,42,.04);--sh2:0 10px 15px -3px rgba(15,23,42,.06),0 4px 6px -4px rgba(15,23,42,.04);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--surface:#111a2e;--ink:#e2e8f0;--muted:#94a3b8;--line:#1f2a44;--line2:#334155;--line3:#1a2438;--accent:#60a5fa;--accent-ink:#0b1220;--soft:rgba(96,165,250,.14);--soft2:#0f172a;--ok:#5eead4;--okbg:rgba(13,148,136,.22);--bad:#f87171;--badbg:rgba(239,68,68,.16);--wait:#fbbf24;--waitbg:rgba(245,158,11,.16);--prim:#2563eb;--prim-h:#3b82f6;--prim-ink:#fff;--sh1:0 1px 3px 0 rgba(0,0,0,.35);--sh2:0 10px 15px -3px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1220;--surface:#111a2e;--ink:#e2e8f0;--muted:#94a3b8;--line:#1f2a44;--line2:#334155;--line3:#1a2438;--accent:#60a5fa;--accent-ink:#0b1220;--soft:rgba(96,165,250,.14);--soft2:#0f172a;--ok:#5eead4;--okbg:rgba(13,148,136,.22);--bad:#f87171;--badbg:rgba(239,68,68,.16);--wait:#fbbf24;--waitbg:rgba(245,158,11,.16);--prim:#2563eb;--prim-h:#3b82f6;--prim-ink:#fff;--sh1:0 1px 3px 0 rgba(0,0,0,.35);--sh2:0 10px 15px -3px rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;line-height:1.7;font-size:15px}
[hidden]{display:none!important}
a{color:var(--accent);text-decoration:none}
h1{font-size:22px;margin:0 0 4px;font-weight:700}
h2{font-size:17px;margin:0 0 12px;font-weight:600}
.muted{color:var(--muted)}.small{font-size:13px}.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.ok{color:var(--ok)}.bad{color:var(--bad)}
/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.abox{width:100%;max-width:420px}
.brand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:18px}
.mark{width:40px;height:40px;border-radius:10px;background:var(--prim);color:var(--prim-ink);display:grid;place-items:center;font-weight:700;font-size:22px}
.brand b{font-size:22px}
.tabs{display:flex;gap:4px;background:var(--soft2);padding:4px;border-radius:10px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font:inherit;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh1);font-weight:600}
/* shell */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--surface);border-inline-end:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.side .brand{justify-content:flex-start;margin:0 6px 16px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:12px;color:var(--muted);margin:14px 10px 4px;font-weight:600}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:8px;color:var(--ink)}
.nav a:hover{background:var(--soft2)}
.nav a.on{background:var(--soft);color:var(--accent);font-weight:600}
.pill{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;line-height:18px}
.main{min-width:0}
.top{display:flex;align-items:center;gap:10px;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5}
.top .sp{flex:1}
.top .cname{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#cs{max-width:220px}
.btn.menu{display:none}
.page{padding:24px;max-width:1200px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
/* cards & tables */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--sh1);margin-bottom:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.card.kpi{color:var(--ink);display:block}.card.kpi:hover{border-color:var(--line2)}
.kpi .v{font-size:24px;font-weight:700}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--line3);white-space:nowrap}
th{background:var(--soft2);color:var(--muted);font-weight:600;font-size:13px}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:var(--soft2)}
td.r,th.r{text-align:end}
tfoot td{font-weight:700;background:var(--soft2)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.badge{display:inline-block;border-radius:99px;padding:0 10px;font-size:12px;line-height:22px;background:var(--soft2);color:var(--muted)}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.bad{background:var(--badbg);color:var(--bad)}.badge.wait{background:var(--waitbg);color:var(--wait)}.badge.info{background:var(--soft);color:var(--accent)}
/* forms */
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;min-height:40px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
input[type=checkbox]{width:auto;min-height:0}
.fg{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.fg .wide{grid-column:1/-1}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 14px;cursor:pointer;min-height:38px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--soft2)}
.btn.pri{background:var(--prim);border-color:var(--prim);color:var(--prim-ink)}.btn.pri:hover{background:var(--prim-h)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:30px;padding:3px 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.full{width:100%;justify-content:center}
.err{background:var(--badbg);color:var(--bad);border-radius:8px;padding:8px 12px;margin:10px 0;font-size:14px}
.note{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:14px;margin:10px 0}
.code{font-family:ui-monospace,Menlo,monospace;font-size:18px;letter-spacing:3px;background:var(--soft2);border-radius:6px;padding:2px 8px;direction:ltr;display:inline-block}
dialog{border:0;border-radius:14px;padding:0;width:min(620px,calc(100vw - 32px));background:var(--surface);color:var(--ink);box-shadow:var(--sh2)}
dialog::backdrop{background:rgba(15,23,42,.45)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.db{padding:18px;max-height:70vh;overflow:auto}
.df{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}
.x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted)}
#toast{position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(50%);background:var(--prim);color:var(--prim-ink);padding:10px 18px;border-radius:10px;box-shadow:var(--sh2);z-index:50;font-size:14px}
[dir=ltr] #toast{transform:translateX(-50%)}
.lines td{padding:4px}.lines input,.lines select{min-height:34px;padding:4px 8px}
.seg{display:inline-flex;gap:2px;background:var(--soft2);padding:3px;border-radius:9px;flex-wrap:wrap}
.seg a{padding:5px 12px;border-radius:7px;color:var(--muted);font-size:14px}
.seg a.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh1);font-weight:600}
.timeline{list-style:none;padding:0;margin:0}.timeline li{padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
@media(max-width:860px){
 .shell{grid-template-columns:1fr}
 .side{position:fixed;inset-block:0;inset-inline-start:0;width:270px;z-index:20;transform:translateX(110%);transition:transform .2s;box-shadow:var(--sh2)}
 [dir=ltr] .side{transform:translateX(-110%)}
 .side.open{transform:none}
 .btn.menu{display:inline-flex}
 .page{padding:16px}
 .top{padding:10px 16px;flex-wrap:wrap;gap:6px}
 .top .cname .badge{display:none}
 #cs{max-width:150px}
 .fg{grid-template-columns:1fr}
}
@media print{.side,.top,.btn{display:none!important}.shell{display:block}.card{box-shadow:none}}

.linkbtn{border:0;background:none;padding:0;font:inherit;color:var(--accent);cursor:pointer}
/* attendance */
.clock{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.btn.big{font-size:18px;padding:14px 28px;border-radius:12px;min-width:200px}
@media(max-width:640px){.btn.big{width:100%}}
.btn.wa{background:#25d366;border-color:#25d366;color:#fff}.btn.wa:hover{background:#1ebe5b;border-color:#1ebe5b}

/* A4 letter sheet: 210 × 297 mm, always paper-white whatever the theme */
.a4wrap{overflow:hidden;padding:4px 0 20px}
.a4{width:210mm;height:297mm;box-sizing:border-box;padding:16mm 20mm 12mm;margin:0 auto;background:#fff;color:#111;display:flex;flex-direction:column;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;font-size:12.5pt;line-height:1.9;box-shadow:0 2px 14px rgba(0,0,0,.18);overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.a4[dir=ltr]{font-family:'IBM Plex Sans Arabic',Georgia,serif}
.lt-head{display:flex;justify-content:space-between;gap:12mm;align-items:flex-start;border-bottom:1.2pt solid #1f3b57;padding-bottom:5mm}
.lt-brand{display:flex;align-items:center;gap:5mm;min-width:0}
.lt-logo{max-height:22mm;max-width:55mm;object-fit:contain;display:block}
.logo-prev{min-width:120px;min-height:56px;padding:6px;border:1px dashed var(--line,#ccc);border-radius:8px;display:flex;align-items:center;justify-content:center;background:#fff}
.logo-prev img{max-height:60px;max-width:220px;object-fit:contain}
.lt-co{font-size:17pt;font-weight:700;color:#1f3b57;line-height:1.4}
.lt-ids,.lt-meta{font-size:9.5pt;color:#444;line-height:1.7}
.lt-meta,.lt-ids{white-space:nowrap}
.lt-main{flex:1;padding-top:9mm}
.lt-title{text-align:center;font-size:18pt;margin:0 0 8mm;color:#111;text-decoration:underline;text-underline-offset:3mm;text-decoration-thickness:.8pt}
.lt-to{font-weight:700;margin:0 0 5mm!important}
.a4 p{margin:0 0 4mm;text-align:justify;color:#111}
.lt-tbl{width:72%;margin:2mm auto 6mm;border-collapse:collapse;font-size:11.5pt;color:#111}
.lt-tbl th,.lt-tbl td{border:.6pt solid #999;padding:1.4mm 4mm;text-align:start;background:#fff}
.lt-tbl thead th{background:#eef2f6;font-weight:600}
.lt-tbl tfoot td{font-weight:700;background:#f6f8fa}
.lt-tbl .amt{text-align:end;width:42%}
.lt-close{margin-top:6mm!important}
.lt-sign{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12mm}
.lt-by{font-weight:700;margin-bottom:3mm}
.lt-line{min-width:64mm;border-bottom:.6pt dotted #777;margin-bottom:5mm;padding-bottom:1mm}
.lt-stamp{width:34mm;height:34mm;border:.8pt dashed #aaa;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9pt;color:#999;text-align:center}
.lt-foot{border-top:.6pt solid #ccc;padding-top:3mm;font-size:8.5pt;color:#666;text-align:center;line-height:1.6}
.a4.nohead .lt-head,.a4.nohead .lt-foot{visibility:hidden}
#printarea{display:none}
@media print{body.printing>*:not(#printarea){display:none!important}body.printing #printarea{display:block}html:has(body.printing),body.printing{background:#fff!important;margin:0;padding:0}#printarea .a4{box-shadow:none;margin:0;zoom:1}}

</style>

// three modes: follow the device (default), always light, always dark
const THEMES = { auto: ['المظهر: حسب الجهاز', '◐'], light: ['المظهر: نهاري', '☀'], dark: ['المظهر: ليلي', '☾'] };
const curTheme = () => { const t = LS.get('waad.theme'); return THEMES[t] ? t : 'auto'; };
function applyTheme(t) { if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  for (const b of document.querySelectorAll('[data-theme-btn]')) { const [label, icon] = THEMES[curTheme()]; b.title = label; b.setAttribute('aria-label', label); b.textContent = b.dataset.themeBtn === 'icon' ? icon : icon + ' ' + label; } }
applyTheme(curTheme());
function toggleTheme() { const order = ['auto', 'light', 'dark'], t = order[(order.indexOf(curTheme()) + 1) % 3]; LS.set('waad.theme', t === 'auto' ? null : t); applyTheme(t); toast(THEMES[t][0]); }

/* ===== boot & context ===== */
async function loadContext() {
  S.companies = await db.rpc('my_companies');
  if (!S.companies.length) return false;
  let c = S.companies.find(x => x.company_id === S.cid) || S.companies[0];
  S.cid = c.company_id; LS.set('waad.cid', S.cid); S.role = c.role; S.emp = c.employee_id; S.mustChange = !!c.must_change_password; if (c.code) { LS.set('waad.ccode', c.code); LS.set('waad.cname', c.name); }
  const [co] = await db.get('companies', { id: 'eq.' + S.cid });
  S.company = co;
  S.perms = new Set();
  if (['accountant', 'storekeeper'].includes(S.role)) (await db.get('finance_permissions', { company_id: 'eq.' + S.cid, role: 'eq.' + S.role, select: 'perm' })).forEach(p => S.perms.add(p.perm));
  S.myEmp = S.emp ? (await db.get('employees', { id: 'eq.' + S.emp }))[0] || null : null;
  return true;
}
async function boot() {
  if (!S.session) return authView();
  try {
    if (!(await loadContext())) return onboardView();
    if (S.mustChange) return changePasswordView(true);
  } catch (e) {
    if (e.status === 401) { setSession(null); return authView('in', 'انتهت الجلسة — سجّل الدخول مجدداً'); }
    $('#app').innerHTML = `<div class="auth"><div class="abox">${brand()}<div class="card"><div class="err">${esc(e.message)}</div><button class="btn" onclick="boot()">إعادة المحاولة</button></div></div></div>`; return;
  }
  shell(); route();
}

    if (isHR()) it.push({ h: '#/recruit', t: 'التوظيف' }, { h: '#/training', t: 'التدريب' });
    it.push({ h: '#/hrreports', t: 'تقارير الموارد البشرية' });
  }
  if (has('manager') && !isHR()) { g('فريقي'); it.push({ h: '#/att', t: 'حضور الفريق' }); }
  if (isFin()) {
    g('المالية');
    if (can('sales')) it.push({ h: '#/sales', t: 'المبيعات' }, { h: '#/parties/customer', t: 'العملاء' });
    if (can('purch')) it.push({ h: '#/purchases', t: 'المشتريات' }, { h: '#/parties/supplier', t: 'الموردون' });
    if (can('sales') || can('purch')) it.push({ h: '#/payments', t: 'سندات القبض والصرف' });

function shell() {

function drawNav() {
  const cur = location.hash.split('?')[0] || '#/home';
  $('#nav').innerHTML = navItems().map(i => i.g ? `<div class="grp">${esc(i.g)}</div>` : `<a href="${i.h}" class="${cur === i.h || (cur.startsWith(i.h + '/') && i.h !== '#/home') ? 'on' : ''}">${esc(i.t)}${i.pill ? `<span class="pill">${i.pill}</span>` : ''}</a>`).join('');

async function refreshCounts() { try { NAVC.approvals = (await pendingForMe()).length; if (isHR()) NAVC.docs = await docAlertCount(); drawNav(); } catch (e) {} }
async function route() {
  if (!S.session || !S.cid || !$('#page')) return;
  const [path, q] = (location.hash || '#/home').split('?');
  const parts = path.split('/'); // ['#', 'sales', 'id']
  let key = parts.slice(0, 2).join('/'), arg = parts.slice(2).join('/');
  if (!VIEWS[key]) { key = '#/home'; arg = ''; }
  $('#side') && $('#side').classList.remove('open');
  drawNav();
  // each navigation renders into its own container, so a slow earlier page can never overwrite a newer one
  const page = document.createElement('div'); page.innerHTML = '<div class="muted">جارٍ التحميل…</div>';
  $('#page').replaceChildren(page);
  try { await VIEWS[key](page, arg, new URLSearchParams(q || '')); }
  catch (e) { if (e.status === 401 && !S.session) return authView('in', 'انتهت الجلسة — سجّل الدخول مجدداً'); if (page.isConnected) page.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}
window.addEventListener('hashchange', route);

const cache = {};
async function employeesMap(force) { if (force || !cache.emps) { cache.emps = await db.get('employees', { company_id: 'eq.' + S.cid, order: 'emp_no' }); } const m = {}; cache.emps.forEach(e => m[e.id] = e); return m; }
async function pendingForMe() {
  const reqs = await db.get('requests', { company_id: 'eq.' + S.cid, status: 'eq.pending', order: 'created_at' });
  if (!reqs.length) return [];
  const ids = [...new Set(reqs.map(r => r.employee_id))];
  const emps = await db.get('employees', { id: 'in.(' + ids.join(',') + ')', select: 'id,manager_id,full_name,emp_no' });
  const em = {}; emps.forEach(e => em[e.id] = e);

function canAct(r, e) {
  const st = r.route[r.step]; if (!st) return false;

  if (st === 'm') return !!(e && S.emp && e.manager_id === S.emp);

  if (st === 'f') return has('finance');
  if (st === 'g') return has('owner');
  return false;
}

// Art. 109: annual leave accrues daily — 21 days a year, 30 after five continuous years
async function leaveBalance() {
  if (!S.myEmp) return { ent: 0, used: 0, left: 0 };
  const [b] = await db.rpc('annual_leave_balance', { p_emp: S.emp });
  const yrs = (new Date(today()) - new Date(S.myEmp.hire_date)) / 864e5 / 365;
  return { ent: yrs >= 5 ? 30 : 21, used: n0(b && b.taken), left: Math.floor(n0(b && b.balance)) };
}

/* ===== staff logins by employee number ===== */
// temporary password HR hands over; the employee must replace it at first sign-in
function tempPassword() {
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', r = crypto.getRandomValues(new Uint32Array(8));
  let p = ''; for (const x of r) p += A[x % A.length]; return p;
}
function createStaffLogin(e) {
  if (!/^[A-Za-z0-9_-]{1,20}$/.test(e.emp_no)) return toast('الرقم الوظيفي يجب أن يكون أرقاماً أو حروفاً إنجليزية ليُستخدم في الدخول');
  const roles = INVITABLE().filter(r => !['finance', 'accountant', 'storekeeper', 'admin', 'hr'].includes(r) || has('owner', 'admin'));
  modal('إنشاء دخول — ' + e.full_name, `<p>سيدخل الموظف برمز المنشأة <b class="num">${esc(S.company.code)}</b> ثم <b>رقمه الوظيفي ${esc(e.emp_no)}</b> وكلمة مرور مؤقتة تظهر لك الآن، ويُطلب منه تغييرها عند أول دخول.</p>
    ${field('الصلاحية', `<select name="role">${roles.map(r => opt(r, ROLES[r], 'employee')).join('')}</select>`)}`, {
    ok: 'إنشاء الدخول', onOk: async f => {
      const pw = tempPassword();
      const res = await authApi.createStaff(staffEmail(S.company.code, e.emp_no), pw);
      await db.rpc('link_staff_login', { p_company: S.cid, p_employee: e.id, p_role: f.role });
      if (res.existed) await db.rpc('reset_staff_password', { p_company: S.cid, p_employee: e.id, p_password: pw });
      cache.logins = null; route(); setTimeout(() => credentialsBox(e, pw, !res.confirmed && !res.existed), 60);
    }
  });
}
function resetStaffPassword(e) {
  modal('إعادة تعيين كلمة المرور — ' + e.full_name, '<p>تتوقف كلمة المرور الحالية وتظهر لك كلمة مؤقتة جديدة، ويُطلب من الموظف تغييرها عند الدخول.</p>', {
    ok: 'إعادة التعيين', onOk: async () => { const pw = tempPassword(); await db.rpc('reset_staff_password', { p_company: S.cid, p_employee: e.id, p_password: pw }); route(); setTimeout(() => credentialsBox(e, pw), 60); }
  });
}
/* ===== WhatsApp: opens the chat with the message typed; the user presses send (nothing is sent automatically) ===== */
function waPhone(p) { let d = String(p || '').replace(/\D/g, ''); if (/^05\d{8}$/.test(d)) d = '966' + d.slice(1); else if (/^5\d{8}$/.test(d)) d = '966' + d; else if (/^00966/.test(d)) d = d.slice(2); return /^9665\d{8}$/.test(d) ? d : ''; }
const waUrl = (phone, text) => 'https://wa.me/' + waPhone(phone) + '?text=' + encodeURIComponent(text);
const waBtn = (phone, text, label = 'إرسال واتساب', cls = 'btn wa') => `<a class="${cls}" target="_blank" rel="noopener" href="${esc(waUrl(phone, text))}">${esc(label)}</a>`;
function credentialsBox(e, pw, warnConfirm) {
  const link = location.origin + location.pathname + '?c=' + S.company.code;
  const msg = 'بيانات دخولك لنظام وعد (' + S.company.name + '):\nالرابط: ' + link + '\nرمز المنشأة: ' + S.company.code + '\nالرقم الوظيفي: ' + e.emp_no + '\nكلمة المرور المؤقتة: ' + pw + '\nسيُطلب منك تغييرها عند أول دخول.';
  const row = (t, v) => `<tr><td class="muted">${t}</td><td class="num" style="font-weight:700;font-size:17px">${esc(v)}</td></tr>`;
  const d = modal('بيانات دخول ' + e.full_name, `${warnConfirm ? '<div class="err">خيار «Confirm email» مفعّل في Supabase، فلن يستطيع الموظف الدخول حتى يُطفأ.</div>' : ''}
    <div class="tw"><table><tbody>${row('رمز المنشأة', S.company.code)}${row('الرقم الوظيفي', e.emp_no)}${row('كلمة المرور المؤقتة', pw)}</tbody></table></div>
    <p class="muted small">لن تظهر كلمة المرور مجدداً. أعطها للموظف الآن، ويمكنك إعادة تعيينها لاحقاً.</p>
    <div class="row" style="justify-content:center">${waBtn(e.phone, tr(msg), waPhone(e.phone) ? 'إرسال واتساب إلى ' + e.phone : 'إرسال واتساب')}<button type="button" class="btn pri" id="cpm">نسخ الرسالة</button>${navigator.share ? '<button type="button" class="btn" id="shm">مشاركة</button>' : ''}</div>
    ${waPhone(e.phone) ? '' : '<p class="muted small" style="text-align:center">لا يوجد جوال صحيح في سجل الموظف — سيفتح واتساب لتختار المحادثة بنفسك.</p>'}`);
  $('#cpm', d).onclick = async ev => { try { await navigator.clipboard.writeText(tr(msg)); ev.target.textContent = 'نُسخت ✓'; } catch (er) { toast('تعذر النسخ — انسخ البيانات من الجدول'); } };
  if ($('#shm', d)) $('#shm', d).onclick = () => navigator.share({ text: tr(msg) }).catch(() => {});
}

function wpsFile(run, lines, em) {
  const miss = lines.filter(l => !(em[l.employee_id] || {}).iban || !(em[l.employee_id] || {}).national_id);
  const rows = lines.map(l => { const e = em[l.employee_id] || {}; return [e.national_id || '', e.full_name || '', e.iban || '', r2(l.basic).toFixed(2), r2(l.housing).toFixed(2), r2(n0(l.transport) + n0(l.overtime) + n0(l.bonus)).toFixed(2), r2(n0(l.gosi) + n0(l.absence) + n0(l.att_absence) + n0(l.late_deduction) + n0(l.sick_deduction) + n0(l.deductions) + n0(l.damages) + n0(l.advance)).toFixed(2), r2(l.net).toFixed(2)].join(','); });
  const csv = '﻿' + ['national_id,name,iban,basic,housing,other_earnings,deductions,net', ...rows].join('\r\n');
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  modal('ملف حماية الأجور', `${miss.length ? `<div class="err">${miss.length} موظف بلا آيبان أو رقم هوية — أكملها قبل الرفع.</div>` : ''}<p>ملف CSV بالحقول المطلوبة لرفع الرواتب في «مدد» أو البنك. راجع قالب بنكك قبل الرفع، فبعض البنوك تطلب ترتيب أعمدة مختلفاً.</p><a class="btn pri" download="wps-${run.year}-${String(run.month).padStart(2, '0')}.csv" href="${url}">تنزيل الملف</a>`);
}

async function reviewCycle(page, id) {
  const [[c], revs, em] = await Promise.all([db.get('review_cycles', { id: 'eq.' + id }), db.get('reviews', { cycle_id: 'eq.' + id }), employeesMap()]);
  if (!c) throw new Error('الدورة غير موجودة');
  revs.sort((a, b) => String((em[a.employee_id] || {}).emp_no).localeCompare(String((em[b.employee_id] || {}).emp_no)));
  const nm = i => esc((em[i] || {}).full_name || '—');
  const dist = [1, 2, 3, 4, 5].map(k => revs.filter(r => r.status === 'approved' && Math.round(+r.overall) === k).length);
  page.innerHTML = `<div class="head"><div><a href="#/reviews" class="small">← تقييم الأداء</a><h1>${esc(c.name)} ${c.status === 'open' ? '<span class="badge info">مفتوحة</span>' : '<span class="badge">مغلقة</span>'}</h1><div class="muted">${fdate(c.period_start)} → ${fdate(c.period_end)}</div></div>${c.status === 'open' ? '<button class="btn" id="cl">إغلاق الدورة</button>' : ''}</div>
    <div class="grid" style="margin-bottom:16px">${[5, 4, 3, 2, 1].map(k => `<div class="card kpi"><div class="muted small">${esc(RATING[k])}</div><div class="v num">${dist[k - 1]}</div></div>`).join('')}</div>
    ${tbl([{ t: 'الموظف', h: r => nm(r.employee_id) }, { t: 'المقيّم', h: r => r.reviewer_id ? nm(r.reviewer_id) : '<span class="muted">الموارد البشرية</span>' }, { t: 'الحالة', h: r => rvBadge(r.status) }, { t: 'النتيجة', h: r => ratingTxt(r.overall) }, { t: 'اطلاع الموظف', h: r => r.ack_at ? '<span class="badge ok">اطّلع</span>' : '—' }], revs, { onRow: true })}`;
  bindRows(page, revs, r => r.status === 'submitted' ? reviewView(r, em, c, { decide: true }) : r.status === 'draft' && c.status === 'open' ? reviewForm(r, em, c) : reviewView(r, em, c));
  if ($('#cl', page)) $('#cl', page).onclick = async () => { if (!await confirmBox('إغلاق الدورة', 'لن يمكن تعديل أي تقييم في هذه الدورة بعد الإغلاق.', 'إغلاق')) return; try { await db.rpc('close_review_cycle', { p_id: id }); route(); } catch (e) { toast(e.message); } };
}
function reviewForm(r, em, c) {
  const goals = (r.goals && r.goals.length ? r.goals : [{ t: '', w: 100, s: null, c: '' }]).map(g => Object.assign({}, g));
  const e = em[r.employee_id] || {};
  const d = modal('تقييم ' + (e.full_name || ''), `<p class="muted small">${esc(c.name)} · ${esc(e.job_title || '')}${r.hr_comment ? ` — <span class="bad">ملاحظة الموارد البشرية: ${esc(r.hr_comment)}</span>` : ''}</p>
    <div class="tw"><table><thead><tr><th>الهدف</th><th>الوزن %</th><th>الدرجة</th><th>تعليق</th><th></th></tr></thead><tbody id="gl"></tbody></table></div>
    <div class="row" style="margin:8px 0 14px"><button type="button" class="btn sm" id="ga">+ هدف</button><span class="sp" style="flex:1"></span><span class="small">مجموع الأوزان: <b class="num" id="gw"></b>% · النتيجة: <b id="go"></b></span></div>
    <div class="fg">${field('نقاط القوة', `<textarea name="st" rows="2">${esc(r.strengths || '')}</textarea>`, 'wide')}${field('مجالات التطوير', `<textarea name="im" rows="2">${esc(r.improvements || '')}</textarea>`, 'wide')}${field('تعليق المقيّم', `<textarea name="cm" rows="2">${esc(r.manager_comment || '')}</textarea>`, 'wide')}</div>
    <p class="muted small">الدرجات: ${[1, 2, 3, 4, 5].map(k => k + ' ' + RATING[k]).join(' · ')}</p>`, {
    wide: true, ok: 'إرسال للاعتماد', onOk: async f => { await save(f, true); toast('أُرسل التقييم للموارد البشرية'); route(); } });
  const save = (f, submit) => db.rpc('save_review', { p_id: r.id, p_goals: goals.map(g => ({ t: g.t.trim(), w: +g.w || 0, s: g.s ? +g.s : null, c: (g.c || '').trim() || undefined })), p_strengths: f.st, p_improvements: f.im, p_comment: f.cm, p_submit: submit });
  const draw = () => {
    $('#gl', d).innerHTML = goals.map((g, i) => `<tr><td style="min-width:200px"><input data-i="${i}" data-k="t" value="${esc(g.t)}" placeholder="مثال: إنجاز المشروع في موعده"></td>
      <td style="width:90px"><input data-i="${i}" data-k="w" type="number" min="0" max="100" value="${esc(g.w)}"></td>
      <td style="width:150px"><select data-i="${i}" data-k="s"><option value="">—</option>${[1, 2, 3, 4, 5].map(k => opt(k, k + ' — ' + RATING[k], g.s)).join('')}</select></td>
      <td style="min-width:160px"><input data-i="${i}" data-k="c" value="${esc(g.c || '')}"></td><td><button type="button" class="btn sm danger" data-rm="${i}" aria-label="حذف الهدف">×</button></td></tr>`).join('');
    $$('[data-k]', d).forEach(x => x.oninput = x.onchange = () => { goals[+x.dataset.i][x.dataset.k] = x.value; sums(); });
    $$('[data-rm]', d).forEach(b => b.onclick = () => { goals.splice(+b.dataset.rm, 1); draw(); });
    sums();
  };
  const sums = () => { const w = goals.reduce((a, g) => a + n0(g.w), 0), ok = w === 100 && goals.every(g => g.s);
    $('#gw', d).textContent = w; $('#gw', d).className = 'num ' + (w === 100 ? 'ok' : 'bad');
    $('#go', d).innerHTML = ok ? ratingTxt(goals.reduce((a, g) => a + n0(g.w) * n0(g.s), 0) / 100) : '—'; };
  $('#ga', d).onclick = () => { if (goals.length < 10) { goals.push({ t: '', w: 0, s: null, c: '' }); draw(); } };
  draw();
  const sv = document.createElement('button'); sv.type = 'button'; sv.className = 'btn'; sv.textContent = 'حفظ كمسودة';
  $('.df', d).insertBefore(sv, $('#mok', d));
  sv.onclick = async () => { try { await busy(sv, () => save(formData($('#mform', d)), false)); d.close(); toast('حُفظت المسودة'); route(); } catch (er) { showErr($('#merr', d), er); } };
}
function reviewView(r, em, c, { decide, ack } = {}) {
  const e = em[r.employee_id] || S.myEmp || {};
  const body = `<p><b>${esc(e.full_name || '')}</b> <span class="muted">${esc(c ? c.name : '')}</span> ${rvBadge(r.status)}</p>

    ${decide ? field('ملاحظة (إلزامية عند الإعادة)', '<textarea name="note" rows="2"></textarea>') : ''}${ack ? field('تعليقك (اختياري)', '<textarea name="note" rows="2"></textarea>') : ''}`;

  }

/* ===== attendance: check-in/out from the phone, HR board, monthly sheet, settings ===== */
const AT_ST = { present: ['حاضر', 'ok'], late: ['متأخر', 'wait'], open: ['داخل الدوام', 'info'], nocheckout: ['بدون انصراف', 'bad'], absent: ['غائب', 'bad'],
  leave: ['إجازة', 'info'], holiday: ['عطلة رسمية', ''], off: ['راحة', ''], pending: ['لم يسجّل بعد', 'wait'], na: ['—', ''] };
const atBadge = s => `<span class="badge ${(AT_ST[s] || ['', ''])[1]}">${esc((AT_ST[s] || [s])[0])}</span>`;
const DOW = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
const rToday = () => new Date(Date.now() + 3 * 3600e3).toISOString().slice(0, 10);          // Riyadh (UTC+3, no DST)
const hm = ts => ts ? new Date(ts).toLocaleTimeString('en-GB', { timeZone: 'Asia/Riyadh', hour: '2-digit', minute: '2-digit' }) : '—';
const mins = m => { m = n0(m); if (!m) return '—'; const h = Math.floor(m / 60); return (h ? h + ' س ' : '') + (m % 60 ? (m % 60) + ' د' : ''); };
const monthEnd = ym => { const [y, m] = ym.split('-').map(Number); return new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10); };
const dayName = d => DOW[new Date(d + 'T12:00:00Z').getUTCDay()];
const attOn = () => !!(S.company && S.company.att_enabled);

    <div class="row" style="margin:14px 0 10px;align-items:center"><a class="btn sm" href="#/attendance/${prev}">→</a><b class="num">${ym}</b>${next <= rToday().slice(0, 7) ? `<a class="btn sm" href="#/attendance/${next}">←</a>` : ''}</div>

      { t: 'الانصراف', h: r => `<span class="num">${hm(r.check_out)}</span>` }, { t: 'التأخير', h: r => mins(r.late_min) }, { t: 'إضافي', h: r => r.extra_min ? mins(r.extra_min) + (r.ot_min ? ` <span class="ok small">(معتمد ${mins(r.ot_min)})</span>` : '') : '—' },
      { t: 'ملاحظة', h: r => r.source === 'hr' ? `<span class="muted small">عدّلته الموارد البشرية: ${esc(r.note || '')}</span>` : '' }], rows.filter(r => r.status !== 'na'), { empty: 'لا توجد بيانات' })}`;
  bindClock(page);
};
async function clockCard() {
  const [t] = await db.rpc('att_sheet', { p_company: S.cid, p_from: rToday(), p_to: rToday(), p_emp: S.emp }).catch(() => []);
  const [sh] = S.myEmp && S.myEmp.shift_id ? await db.get('shifts', { id: 'eq.' + S.myEmp.shift_id }) : await db.get('shifts', { company_id: 'eq.' + S.cid, is_default: 'is.true' });
  if (S.myEmp && S.myEmp.att_exempt) return '<div class="note">أنت معفى من تسجيل الحضور.</div>';
  const done = t && t.check_out, inside = t && t.check_in && !t.check_out;
  return `<div class="card clock"><div><div class="muted small">${esc(dayName(rToday()))} <span class="num">${rToday()}</span>${sh ? ` · ${esc(sh.name)} <span class="num">${sh.start_time.slice(0, 5)}–${sh.end_time.slice(0, 5)}</span>` : ''}</div>
      <div style="margin:4px 0 2px">${t ? atBadge(t.status) : ''} ${t && t.check_in ? `حضور <b class="num">${hm(t.check_in)}</b>` : ''} ${t && t.check_out ? ` · انصراف <b class="num">${hm(t.check_out)}</b>` : ''}</div>
      ${t && t.late_min ? `<div class="small bad">تأخير ${mins(t.late_min)}</div>` : ''}</div>
    ${done ? '<div class="muted">سجّلت الحضور والانصراف لهذا اليوم</div>' : `<button class="btn pri big" id="clk">${inside ? 'تسجيل الانصراف' : 'تسجيل الحضور'}</button>`}
    <div id="clkerr" style="width:100%"></div></div>`;
}
function bindClock(page) {
  const b = $('#clk', page); if (!b) return;
  b.onclick = () => busy(b, async () => {
    $('#clkerr', page).innerHTML = '';
    let pos = null;
    try { pos = await new Promise((res, rej) => navigator.geolocation ? navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }) : rej(new Error('no geolocation'))); }
    catch (e) { pos = null; }
    try {
      const r = await db.rpc('clock', pos ? { p_company: S.cid, p_lat: +pos.coords.latitude.toFixed(6), p_lng: +pos.coords.longitude.toFixed(6), p_acc: Math.round(pos.coords.accuracy) } : { p_company: S.cid });
      toast(r.action === 'in' ? 'سُجّل حضورك ' + hm(r.at) + (r.late_min ? ' — تأخير ' + mins(r.late_min) : '') : 'سُجّل انصرافك ' + hm(r.at));
      route();
    } catch (e) { showErr($('#clkerr', page), e); }
  });
}

  const rows = from <= to ? await db.rpc('att_sheet', { p_company: S.cid, p_from: from, p_to: to, p_emp: empArg || null }) : [];
  const ids = [...new Set(rows.map(r => r.employee_id))];
  const pick = `<div class="row" style="margin-bottom:12px;align-items:end"><div><label>الشهر</label><input type="month" id="amy" value="${ym}" max="${rToday().slice(0, 7)}"></div>

  if (empArg) {

      { t: 'التأخير', h: r => mins(r.late_min) }, { t: 'خروج مبكر', h: r => mins(r.early_min) }, { t: 'إضافي', h: r => mins(r.extra_min) }, { t: 'إضافي معتمد', h: r => r.ot_min ? `<span class="ok">${mins(r.ot_min)}</span>` : '—' }, { t: 'ملاحظة', h: r => esc(r.note || '') }],
      rows.filter(r => r.status !== 'na'), { empty: 'لا توجد بيانات', onRow: isHR() });
    if (isHR()) bindRows(box, rows.filter(r => r.status !== 'na'), r => attEdit(r, em));
  } else {
    const sumBy = id => { const l = rows.filter(r => r.employee_id === id); const n = s => l.filter(r => s.includes(r.status)).length;
      return { id, present: n(['present', 'late', 'open', 'nocheckout']), absent: n(['absent']), leave: n(['leave']), noout: n(['nocheckout']), late: l.reduce((a, r) => a + n0(r.late_min), 0), extra: l.reduce((a, r) => a + n0(r.extra_min), 0), ot: l.reduce((a, r) => a + n0(r.ot_min), 0) }; };
    const sums = ids.map(sumBy);

      { t: 'بدون انصراف', r: 1, h: x => x.noout ? `<span class="bad">${x.noout}</span>` : 0 }, { t: 'التأخير', h: x => mins(x.late) }, { t: 'إضافي', h: x => mins(x.extra) }, { t: 'إضافي معتمد', h: x => mins(x.ot) }], sums, { empty: 'لا يوجد موظفون', onRow: true })

  $('#amy', box).onchange = go; $('#ame', box).onchange = go;
}
function attEdit(r, em) {

'use strict';
/* ===== letter templates, rendered on an A4 sheet (210 × 297 mm). The sheet is always in the language chosen for the
   letter (data-nt keeps the UI translator away), so this file is skipped by i18n/extract.py. ===== */
function hijriOf(d, en) {
  try { return new Intl.DateTimeFormat(en ? 'en-GB-u-ca-islamic-umalqura' : 'ar-SA-u-ca-islamic-umalqura-nu-latn', { day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(String(d).slice(0, 10) + 'T12:00:00')); } catch (e) { return ''; }
}
const gregOf = (d, en) => { const s = String(d || '').slice(0, 10); if (!s) return '—'; return en ? new Date(s + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) : s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) + 'م'; };
// service length between two dates, inclusive of both ends
function servicePeriod(a, b) {
  const s = new Date(String(a).slice(0, 10) + 'T12:00:00'), e = new Date(String(b).slice(0, 10) + 'T12:00:00'); e.setDate(e.getDate() + 1);
  let y = e.getFullYear() - s.getFullYear(), m = e.getMonth() - s.getMonth(), d = e.getDate() - s.getDate();
  if (d < 0) { m--; d += new Date(e.getFullYear(), e.getMonth(), 0).getDate(); }
  if (m < 0) { y--; m += 12; }
  return { y, m, d };
}
function periodTxt(p, en) {
  if (en) return [[p.y, 'year'], [p.m, 'month'], [p.d, 'day']].filter(x => x[0]).map(([n, w]) => n + ' ' + w + (n === 1 ? '' : 's')).join(', ') || '0 days';
  const u = (n, one, two, few, many) => n === 1 ? one : n === 2 ? two : n <= 10 ? n + ' ' + few : n + ' ' + many;
  return [p.y && u(p.y, 'سنة', 'سنتان', 'سنوات', 'سنة'), p.m && u(p.m, 'شهر', 'شهران', 'أشهر', 'شهراً'), p.d && u(p.d, 'يوم', 'يومان', 'أيام', 'يوماً')].filter(Boolean).join(' و') || '0';
}

function letterHtml(l, { head = true } = {}) {

  const wageTbl = w ? `<table class="lt-tbl"><thead><tr><th>${en ? 'Item' : 'البند'}</th><th class="amt">${en ? 'Amount (SAR)' : 'المبلغ (ريال سعودي)'}</th></tr></thead><tbody>${wageRows}</tbody>

  const idLbl = e.is_saudi ? (en ? 'National ID' : 'هوية وطنية') : (en ? 'Iqama' : 'إقامة');
  const title = svc ? (en ? 'Service Certificate' : 'شهادة خدمة') : w ? (en ? 'Salary Certificate' : 'تعريف بالراتب') : (en ? 'Employment Certificate' : 'خطاب تعريف');

  let body;

         ${wageTbl}<p>وقد أُعطيت ${g('له', 'لها')} هذه الشهادة بناءً على ${g('طلبه', 'طلبها')} دون مقابل، وفقاً للمادة الرابعة والستين من نظام العمل.</p>`
      : `<p>تفيد ${b(comp)} بأن ${who}، ${g('يعمل', 'تعمل')} لديها ${jobTxt} اعتباراً من ${b(gregOf(e.hire_date))}، ${g('ولا يزال', 'ولا تزال')} على رأس العمل حتى تاريخه${w ? `، ${g('ويتقاضى', 'وتتقاضى')} راتباً شهرياً إجمالياً قدره (${sar(w.gross)}) ريال سعودي، على النحو الآتي:` : '.'}</p>
         ${wageTbl}<p>وقد أُعطي هذا الخطاب بناءً على ${g('طلبه', 'طلبها')} دون أدنى مسؤولية على المنشأة تجاه الغير.</p>`;
    body = `<p>السلام عليكم ورحمة الله وبركاته، وبعد:</p>${body.replace(/ ،/g, '،')}<p class="lt-close">وتفضلوا بقبول فائق الاحترام والتقدير،</p>`;
  } else {

      <div class="lt-sign"><div><div class="lt-by">${en ? 'Human Resources' : 'إدارة الموارد البشرية'}</div><div class="lt-line">${en ? 'Name' : 'الاسم'}:</div><div class="lt-line">${en ? 'Signature' : 'التوقيع'}:</div></div><div class="lt-stamp">${en ? 'Company stamp' : 'ختم المنشأة'}</div></div></main>
    <footer class="lt-foot">${c.address ? esc(c.address) + ' &nbsp;·&nbsp; ' : ''}${en ? 'Reference' : 'رقم مرجعي'} <span class="num">${esc(l.ref_no)}</span> — ${en ? 'not valid without signature and stamp' : 'لا يعتد به دون توقيع وختم المنشأة'}</footer></div>`;

/* print exactly one A4 page: copy the sheet into #printarea, hide everything else, zero page margins for this job only */
function printSheet(sheet) {
  let pa = document.getElementById('printarea'); if (!pa) { pa = document.createElement('div'); pa.id = 'printarea'; document.body.appendChild(pa); }
  pa.innerHTML = ''; const cp = sheet.cloneNode(true); cp.style.zoom = ''; pa.appendChild(cp);
  const st = document.createElement('style'); st.textContent = '@page{size:A4 portrait;margin:0}'; document.head.appendChild(st);
  document.body.classList.add('printing');
  const done = () => { document.body.classList.remove('printing'); st.remove(); pa.innerHTML = ''; window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  window.print();
}

/* company logo: resize in the browser (≤ 800×300) and keep it as a small raster data URL */
async function imgToLogo(file) {
  const url = URL.createObjectURL(file);
  try {
    const im = new Image();
    await new Promise((ok, no) => { im.onload = ok; im.onerror = () => no(new Error('تعذّر قراءة الصورة')); im.src = url; });
    let w = im.naturalWidth || 600, h = im.naturalHeight || 240; const k = Math.min(1, 800 / w, 300 / h); w = Math.max(1, Math.round(w * k)); h = Math.max(1, Math.round(h * k));
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const g = cv.getContext('2d'); g.drawImage(im, 0, 0, w, h);
    let d = cv.toDataURL('image/png');
    if (d.length > 190000) { const x = cv.toDataURL('image/webp', 0.9); if (x.startsWith('data:image/webp')) d = x; }
    if (d.length > 190000) { g.globalCompositeOperation = 'destination-over'; g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); d = cv.toDataURL('image/jpeg', 0.85); }
    if (d.length > 190000) throw new Error('الصورة كبيرة جداً');
    return d;
  } finally { URL.revokeObjectURL(url); }
}

'use strict';
/* ===== employee documents and contracts: expiry alerts (Labor Law Arts. 37, 55, 75) ===== */
const DOC_T = { iqama: 'الإقامة', national_id: 'الهوية الوطنية', passport: 'جواز السفر', work_permit: 'رخصة العمل', health: 'الشهادة الصحية', driving: 'رخصة القيادة', other: 'مستند آخر', contract: 'عقد العمل' };
const DOC_LVL = { expired: ['منتهي', 'bad'], d30: ['خلال 30 يوماً', 'bad'], d60: ['خلال 60 يوماً', 'wait'], d90: ['خلال 90 يوماً', 'info'], missing: ['غير مسجّل', 'wait'] };
const CT_T = { fixed: 'محدد المدة', indefinite: 'غير محدد المدة' };
const lvlBadge = l => `<span class="badge ${DOC_LVL[l][1]}">${esc(DOC_LVL[l][0])}</span>`;
const daysTxt = n => n == null ? '—' : n < 0 ? 'منتهي منذ ' + (-n) + ' يوم' : n === 0 ? 'ينتهي اليوم' : 'باقي ' + n + ' يوم';
const docName = d => d.doc_type === 'other' ? (d.title || DOC_T.other) : DOC_T[d.doc_type];
// Art. 75: notice for an indefinite contract — 30 days from the worker, 60 from the employer (30 both ways if not paid monthly)
const noticeTxt = c => c.contract_type === 'fixed' ? 'ينتهي بانتهاء مدته، ويُستحق التعويض عن المدة الباقية إذا أُنهي قبلها بلا سبب مشروع (م77)'
  : c.monthly_paid ? 'مهلة الإشعار: 30 يوماً إذا أنهاه الموظف، و60 يوماً إذا أنهته المنشأة (م75)' : 'مهلة الإشعار: 30 يوماً من أي طرف (م75)';
async function docAlertCount() { try { return (await db.rpc('doc_alerts', { p_company: S.cid, p_within: 30 })).filter(a => a.level === 'expired' || a.level === 'd30').length; } catch (e) { return 0; } }
const docWaMsg = (a, e) => 'السلام عليكم ' + String(e.full_name || '').split(' ')[0] + '،\n' + (a.days_left < 0 ? 'انتهت ' : 'تنتهي ') + DOC_T[a.label] + (a.ref_no ? ' رقم ' + a.ref_no : '') + ' بتاريخ ' + a.due + '.\nنأمل تجهيز متطلبات التجديد والتواصل مع الموارد البشرية.\n' + S.company.name;

VIEWS['#/docs'] = async (page, arg) => {
  if (!isHR()) { page.innerHTML = '<div class="note">هذه الصفحة للموارد البشرية.</div>'; return; }
  if (arg && arg !== 'all') return docsEmployee(page, arg);
  const within = +(new URLSearchParams(location.hash.split('?')[1] || '').get('d') || 90);
  const [alerts, em] = await Promise.all([db.rpc('doc_alerts', { p_company: S.cid, p_within: within }), employeesMap(true)]);
  NAVC.docs = alerts.filter(a => a.level === 'expired' || a.level === 'd30').length; drawNav();
  const c = l => alerts.filter(a => a.level === l).length;
  page.innerHTML = `<div class="head"><div><h1>المستندات والعقود</h1><div class="muted">الإقامات ورخص العمل والجوازات والعقود — نحفظ الأرقام والتواريخ فقط بدون صور المستندات</div></div>
      <div class="row"><select id="dw">${[30, 60, 90, 180].map(n => opt(n, 'خلال ' + n + ' يوماً', within)).join('')}</select></div></div>
    <div class="grid" style="margin-bottom:16px">
      <div class="card kpi"><div class="muted small">منتهية</div><div class="v num ${c('expired') ? 'bad' : ''}">${c('expired')}</div></div>
      <div class="card kpi"><div class="muted small">خلال 30 يوماً</div><div class="v num ${c('d30') ? 'bad' : ''}">${c('d30')}</div></div>
      <div class="card kpi"><div class="muted small">خلال 31–${within} يوماً</div><div class="v num">${c('d60') + c('d90')}</div></div>
      <div class="card kpi"><div class="muted small">غير مسجّلة</div><div class="v num">${c('missing')}</div></div></div>
    ${tbl([{ t: 'الموظف', h: a => esc((em[a.employee_id] || {}).full_name || '') }, { t: 'البند', h: a => esc(DOC_T[a.label] || a.label) + (a.ref_no ? ` <span class="num muted small">${esc(a.ref_no)}</span>` : '') },
      { t: 'تاريخ الانتهاء', h: a => fdate(a.due) }, { t: 'المتبقي', h: a => daysTxt(a.days_left) }, { t: 'الحالة', h: a => lvlBadge(a.level) },
      { t: 'ملاحظة', h: a => a.note ? `<span class="small">${esc(a.note)}</span>` : '' },
      { t: '', h: a => a.kind === 'doc' && em[a.employee_id] ? waBtn(em[a.employee_id].phone, tr(docWaMsg(a, em[a.employee_id])), 'تذكير', 'btn sm wa') : '' }], alerts, { empty: 'لا توجد تنبيهات — كل المستندات والعقود سارية', onRow: true })}
    <p class="muted small">غير السعودي: يُفترض وجود إقامة ورخصة عمل سارية، وعقد مكتوب محدد المدة (م37). عدم تجديد رخص العمل والإقامة يعرّض المنشأة لإيقاف الخدمات.</p>
    <h2 style="margin-top:20px">الموظفون</h2>${tbl([{ t: 'الرقم', k: 'emp_no' }, { t: 'الاسم', k: 'full_name' }, { t: 'الجنسية', h: e => e.is_saudi ? 'سعودي' : 'غير سعودي' }, { t: 'التنبيهات', r: 1, h: e => alerts.filter(a => a.employee_id === e.id).length || '' }],
      Object.values(em).filter(e => !e.end_date || e.end_date >= today()), { empty: 'لا يوجد موظفون', onRow: true })}`;
  const [t1, t2] = $$('.tw', page);
  bindRows(t1, alerts, a => location.hash = '#/docs/' + a.employee_id);
  bindRows(t2, Object.values(em).filter(e => !e.end_date || e.end_date >= today()), e => location.hash = '#/docs/' + e.id);
  $$('a.wa', page).forEach(a => a.addEventListener('click', ev => ev.stopPropagation()));
  $('#dw', page).onchange = ev => location.hash = '#/docs?d=' + ev.target.value;
};

async function docsEmployee(page, id) {
  const em = await employeesMap(true), e = em[id];
  if (!e) throw new Error('الموظف غير موجود');
  const [docs, cons] = await Promise.all([db.get('employee_documents', { employee_id: 'eq.' + id, order: 'expiry_date.asc.nullslast' }), db.get('contracts', { employee_id: 'eq.' + id, order: 'start_date.desc' })]);
  const cur = cons.find(c => c.status === 'active'), td = today();
  const left = d => d ? Math.round((new Date(d) - new Date(td)) / 864e5) : null;
  const st = d => { const n = left(d); return n == null ? '' : n < 0 ? lvlBadge('expired') : n <= 30 ? lvlBadge('d30') : n <= 60 ? lvlBadge('d60') : n <= 90 ? lvlBadge('d90') : '<span class="badge ok">ساري</span>'; };
  const conv = cur && cur.contract_type === 'fixed' && e.is_saudi && (cur.renewal_no >= 3 || (new Date(cur.end_date) - new Date(cur.first_start)) / 864e5 >= 4 * 365 - 1);
  page.innerHTML = `<div class="head"><div><a href="#/docs" class="small">← المستندات والعقود</a><h1>${esc(e.full_name)}</h1><div class="muted"><span class="num">${esc(e.emp_no)}</span> · ${e.is_saudi ? 'سعودي' : 'غير سعودي'} · المباشرة ${fdate(e.hire_date)}</div></div></div>
    <div class="card"><div class="row" style="justify-content:space-between"><h2>العقد</h2><div class="row">${cur && cur.contract_type === 'fixed' ? '<button class="btn sm" id="crn">تجديد</button><button class="btn sm" id="cind">تحويل لغير محدد المدة</button>' : ''}<button class="btn sm pri" id="cnew">عقد جديد</button></div></div>
      ${cur ? `<div class="tw"><table><tbody>
        <tr><td class="muted">النوع</td><td>${esc(CT_T[cur.contract_type])}${cur.renewal_no ? ' — التجديد رقم ' + cur.renewal_no : ''}</td></tr>
        <tr><td class="muted">من</td><td>${fdate(cur.start_date)}</td></tr><tr><td class="muted">إلى</td><td>${cur.end_date ? fdate(cur.end_date) + ' ' + st(cur.end_date) : '—'}</td></tr>
        <tr><td class="muted">بداية أول عقد</td><td>${fdate(cur.first_start)}</td></tr>
        <tr><td class="muted">الإشعار</td><td class="small">${esc(noticeTxt(cur))}</td></tr></tbody></table></div>
        ${conv ? '<div class="note" style="margin-top:10px">جُدد العقد ثلاث مرات أو بلغت مدته أربع سنوات؛ إذا استمر الطرفان بعد نهايته يتحوّل إلى غير محدد المدة (م55).</div>' : ''}
        ${cur.contract_type === 'fixed' && !e.is_saudi ? '<p class="muted small">إذا استمر العمل بعد انتهاء العقد عُدّ متجدداً لمدة مماثلة (م37).</p>' : ''}`
      : `<div class="note">لا يوجد عقد مسجّل لهذا الموظف.${e.is_saudi ? '' : ' عقد غير السعودي يكون مكتوباً ومحدد المدة (م37).'}</div>`}
      ${cons.length > 1 ? `<details style="margin-top:10px"><summary class="small">العقود السابقة (${cons.length - 1})</summary>${tbl([{ t: 'النوع', h: c => esc(CT_T[c.contract_type]) }, { t: 'من', h: c => fdate(c.start_date) }, { t: 'إلى', h: c => fdate(c.end_date) }, { t: 'الحالة', h: c => c.status === 'renewed' ? 'جُدّد' : 'انتهى' }], cons.filter(c => c !== cur))}</details>` : ''}</div>
    <div class="card" id="dcard"><div class="row" style="justify-content:space-between"><h2>المستندات</h2><button class="btn sm pri" id="dnew">+ مستند</button></div>
      ${tbl([{ t: 'المستند', h: d => esc(docName(d)) }, { t: 'الرقم', h: d => `<span class="num">${esc(d.doc_no || '—')}</span>` }, { t: 'تاريخ الإصدار', h: d => fdate(d.issue_date) }, { t: 'تاريخ الانتهاء', h: d => fdate(d.expiry_date) }, { t: 'الحالة', h: d => st(d.expiry_date) }], docs, { empty: 'لا توجد مستندات مسجّلة', onRow: true })}
      ${!e.is_saudi ? '<p class="muted small">لغير السعودي: سجّل الإقامة ورخصة العمل وجواز السفر.</p>' : ''}</div>`;
  const docForm = d => { const v = d || { doc_type: e.is_saudi ? 'national_id' : 'iqama', doc_no: (!d && e.national_id) ? e.national_id : '' };
    const m = modal(d ? 'تعديل مستند' : 'مستند جديد', `<div class="fg">${field('نوع المستند', `<select name="t">${Object.entries(DOC_T).filter(([k]) => k !== 'contract').map(([k, t]) => opt(k, t, v.doc_type)).join('')}</select>`)}
      <div data-o>${field('اسم المستند', inp('title', v.title))}</div>${field('رقم المستند', inp('no', v.doc_no, 'dir="ltr"'))}
      ${field('تاريخ الإصدار', `<input type="date" name="is" value="${esc(v.issue_date || '')}">`)}${field('تاريخ الانتهاء', `<input type="date" name="ex" value="${esc(v.expiry_date || '')}">`)}
      ${field('ملاحظات', inp('notes', v.notes), 'wide')}${d ? '<div class="wide"><button type="button" class="btn sm danger" id="ddel">حذف المستند</button></div>' : ''}</div>
      <p class="muted small">التنبيه يظهر قبل الانتهاء بـ90 و60 و30 يوماً. عند التجديد عدّل تاريخ الانتهاء أو أضف المستند الجديد.</p>`, {
      onOk: async f => { if (f.t === 'other' && (f.title || '').trim().length < 2) throw new Error('أدخل اسم المستند'); if (f.is && f.ex && f.ex < f.is) throw new Error('تاريخ الانتهاء قبل الإصدار');
        const row = { doc_type: f.t, title: f.t === 'other' ? f.title.trim() : null, doc_no: blank(f.no), issue_date: blank(f.is), expiry_date: blank(f.ex), notes: blank(f.notes) };
        if (d) await db.upd('employee_documents', { id: 'eq.' + d.id }, row); else await db.ins('employee_documents', Object.assign(row, { company_id: S.cid, employee_id: id })); toast('تم الحفظ'); route(); } });
    const sync = () => $('[data-o]', m).hidden = $('select[name=t]', m).value !== 'other'; $('select[name=t]', m).onchange = sync; sync();
    if (d) $('#ddel', m).onclick = async () => { try { await db.del('employee_documents', { id: 'eq.' + d.id }); m.close(); route(); } catch (er) { showErr($('#merr', m), er); } }; };
  bindRows($('#dcard', page), docs, docForm);
  $('#dnew', page).onclick = () => docForm(null);
  $('#cnew', page).onclick = () => { const m = modal('عقد جديد', `<div class="fg">${field('نوع العقد', `<select name="ty">${e.is_saudi ? opt('indefinite', CT_T.indefinite) : ''}${opt('fixed', CT_T.fixed, 'fixed')}</select>`)}
      ${field('تاريخ البداية', `<input type="date" name="st" value="${cur ? '' : esc(e.hire_date)}">`)}<div data-f>${field('تاريخ النهاية', `<input type="date" name="en">`)}</div>
      ${field('الأجر', `<select name="mp">${opt('true', 'شهري')}${opt('false', 'غير شهري')}</select>`)}<div data-f>${field('فيه شرط تجديد تلقائي؟', `<select name="cl">${opt('false', 'لا')}${opt('true', 'نعم')}</select>`)}</div>${field('ملاحظات', inp('notes', ''), 'wide')}</div>
      <p class="muted small">${e.is_saudi ? 'العقد المحدد المدة إذا استمر الطرفان بعد نهايته صار غير محدد المدة (م55).' : 'عقد غير السعودي محدد المدة؛ إذا لم تُحدد النهاية فمدته سنة من تاريخ البداية (م37).'}${cur ? ' سيُغلق العقد الحالي.' : ''}</p>`, {
      onOk: async f => { if (!f.st) throw new Error('أدخل تاريخ بداية العقد'); if (f.ty === 'fixed' && f.en && f.en < f.st) throw new Error('تاريخ النهاية قبل البداية');
        await db.rpc('contract_add', { p_company: S.cid, p_emp: id, p_type: f.ty, p_start: f.st, p_end: f.ty === 'fixed' ? blank(f.en) : null, p_monthly: f.mp === 'true', p_clause: f.cl === 'true', p_notes: blank(f.notes) }); toast('تم الحفظ'); route(); } });
    const sync = () => $$('[data-f]', m).forEach(x => x.hidden = $('select[name=ty]', m).value !== 'fixed'); $('select[name=ty]', m).onchange = sync; sync(); };
  if ($('#crn', page)) $('#crn', page).onclick = () => { const def = new Date(new Date(cur.end_date).getTime() + (new Date(cur.end_date) - new Date(cur.start_date)) + 864e5).toISOString().slice(0, 10);
    modal('تجديد العقد', `<p class="small">يبدأ التجديد من <b class="num">${fdate(new Date(new Date(cur.end_date).getTime() + 864e5).toISOString())}</b>، اليوم التالي لنهاية العقد الحالي.</p>${field('نهاية العقد الجديد', `<input type="date" name="en" value="${def}">`)}
      ${e.is_saudi && cur.renewal_no >= 2 ? '<div class="note" style="margin-top:10px">هذا التجديد الثالث؛ إذا استمر الطرفان بعد نهايته يتحوّل العقد إلى غير محدد المدة (م55).</div>' : ''}`, {
      ok: 'تجديد', onOk: async f => { await db.rpc('contract_renew', { p_id: cur.id, p_end: f.en }); toast('جُدد العقد'); route(); } }); };
  if ($('#cind', page)) $('#cind', page).onclick = () => { if (!e.is_saudi) return toast('عقد غير السعودي يكون محدد المدة — م37');
    modal('تحويل إلى غير محدد المدة', `${field('من تاريخ', `<input type="date" name="fr" value="${esc(today())}">`)}<p class="muted small">يبقى تاريخ بداية الخدمة كما هو، ويُحفظ العقد الحالي في السجل.</p>`, {
      ok: 'تحويل', onOk: async f => { await db.rpc('contract_make_indefinite', { p_id: cur.id, p_from: blank(f.fr) }); toast('تم الحفظ'); route(); } }); };
  await lettersSection(page, e);
}

/* employee self-service: own documents and contract on the profile page */
async function myDocsHtml() {
  if (!S.emp) return '';
  const [docs, cons] = await Promise.all([db.get('employee_documents', { employee_id: 'eq.' + S.emp, order: 'expiry_date.asc.nullslast' }).catch(() => []), db.get('contracts', { employee_id: 'eq.' + S.emp, status: 'eq.active' }).catch(() => [])]);
  if (!docs.length && !cons.length) return '';
  const c = cons[0];
  return `<div class="card"><h2>مستنداتي وعقدي</h2>${c ? `<p class="small">العقد: ${esc(CT_T[c.contract_type])} من ${fdate(c.start_date)}${c.end_date ? ' إلى ' + fdate(c.end_date) : ''}. <span class="muted">${esc(noticeTxt(c))}</span></p>` : ''}
    ${docs.length ? tbl([{ t: 'المستند', h: d => esc(docName(d)) }, { t: 'الرقم', h: d => `<span class="num">${esc(d.doc_no || '—')}</span>` }, { t: 'تاريخ الانتهاء', h: d => fdate(d.expiry_date) }], docs) : ''}</div>`;
}

/* ===== ready-made letters: salary certificate and service certificate (Art. 64), printed on A4 ===== */
const LTR_KIND = { salary: 'تعريف بالراتب', service: 'شهادة خدمة' };
const LTR_COLS = [{ t: 'الرقم', h: l => `<span class="num">${esc(l.ref_no)}</span>` }, { t: 'النوع', h: l => esc(LTR_KIND[l.kind]) + (l.kind === 'salary' && !l.with_salary ? ' — بدون راتب' : '') },
  { t: 'اللغة', h: l => l.lang === 'en' ? 'إنجليزي' : 'عربي' }, { t: 'موجّه إلى', h: l => esc(l.addressee || 'إلى من يهمه الأمر') }, { t: 'تاريخ الإصدار', h: l => fdate(l.data && l.data.date) }];
const lettersOf = emp => db.get('letters', { employee_id: 'eq.' + emp, order: 'issued_at.desc' }).catch(() => []);
async function lettersSection(page, e) {
  const ls = await lettersOf(e.id), left = !!e.end_date && e.end_date <= today();
  page.insertAdjacentHTML('beforeend', `<div class="card" id="lcard"><div class="row" style="justify-content:space-between"><h2>الخطابات</h2><div class="row">
    ${left ? '' : '<button class="btn sm" id="lsal">خطاب تعريف بالراتب</button>'}<button class="btn sm${left ? ' pri' : ''}" id="lsvc">شهادة خدمة (م64)</button></div></div>
    ${tbl(LTR_COLS, ls, { empty: 'لم يصدر خطاب بعد', onRow: true })}</div>`);
  bindRows($('#lcard', page), ls, l => location.hash = '#/letter/' + l.id);
  if ($('#lsal', page)) $('#lsal', page).onclick = () => letterDialog(e, 'salary');
  $('#lsvc', page).onclick = () => left ? letterDialog(e, 'service') : toast('شهادة الخدمة تصدر عند انتهاء الخدمة — سجّل تاريخ نهاية الخدمة في بيانات الموظف أولاً (م64)');
}
async function letterDialog(e, kind, req) {
  const self = !isHR(), co = LS.get('waad.enco.' + S.cid) || '';
  const prev = ((await db.get('letters', { employee_id: 'eq.' + e.id, lang: 'eq.en', order: 'issued_at.desc', limit: 1 }).catch(() => []))[0] || { data: {} }).data.en || {};
  const m = modal(kind === 'service' ? 'شهادة خدمة (م64)' : 'خطاب تعريف بالراتب', `<div class="fg">
    ${field('لغة الخطاب', `<select name="lang">${opt('ar', 'عربي')}${opt('en', 'إنجليزي')}</select>`)}
    ${field('موجّه إلى', inp('to', '', 'placeholder="إلى من يهمه الأمر"'))}
    ${kind === 'salary' ? field('الراتب', `<select name="sal">${opt('true', 'يظهر الراتب وتفاصيله')}${opt('false', 'بدون راتب')}</select>`) : ''}
    ${!self && !e.is_saudi ? field('الجنسية', inp('nat', '')) : ''}
    ${field('الاسم بالإنجليزية', inp('en_name', prev.name || '', 'dir="ltr"'), 'en-only')}${field('المسمى الوظيفي بالإنجليزية', inp('en_job', prev.job || '', 'dir="ltr"'), 'en-only')}
    ${self ? '' : field('اسم المنشأة بالإنجليزية', inp('en_co', prev.company || co, 'dir="ltr"'), 'en-only')}</div>
    ${kind === 'service' ? '<p class="muted small">المادة 64: توضّح الشهادة تاريخ الالتحاق بالعمل وتاريخ انتهائه والمهنة وآخر أجر، وتُعطى دون مقابل، ولا يجوز أن تتضمن ما يسيء إلى سمعة العامل؛ لذلك لا تذكر سبب انتهاء الخدمة ولا أي ملاحظات.</p>' : ''}
    <p class="muted small">يُسجَّل الخطاب برقم مرجعي مع البيانات وقت إصداره، ويُطبع على ورقة A4.</p>`, { ok: 'إصدار', onOk: async f => {
      const en = f.lang === 'en';
      if (en && !self && f.en_co) LS.set('waad.enco.' + S.cid, f.en_co.trim());
      const p = { p_emp: e.id, p_kind: kind, p_lang: f.lang, p_to: blank((f.to || '').trim()), p_salary: kind === 'salary' ? f.sal === 'true' : true, p_nat: blank(f.nat), p_request: req ? req.id : null,

      { foot: `<td colspan="4">الإجمالي قبل الضريبة / الضريبة / الإجمالي</td><td class="r num">${money(doc.subtotal)} / ${money(doc.vat)} / <b>${money(doc.total)}</b></td>` })}
    <p>المسدد والمرتجع: <b class="num">${money(paid)}</b> · ${rem < -0.001 ? 'رصيد دائن للطرف: <b class="num ok">' + money(-rem) + '</b>' : 'المتبقي: <b class="num">' + money(rem) + '</b>'} · الاستحقاق ${fdate(doc.due_date)}</p>${doc.note ? `<p class="muted">${esc(doc.note)}</p>` : ''}</div>
    ${pays.length ? '<h2>السندات</h2>' + tbl([{ t: 'الرقم', h: p => `<span class="num">${esc(p.no)}</span>` }, { t: 'التاريخ', h: p => fdate(p.date) }, { t: 'المبلغ', r: 1, h: p => money(p.amount) }], pays) : ''}
    ${cns.length ? '<div style="height:12px"></div><h2>الإشعارات</h2>' + tbl([{ t: 'الرقم', h: c => `<span class="num">${esc(c.no)}</span>` }, { t: 'التاريخ', h: c => fdate(c.date) }, { t: 'السبب', k: 'reason' }, { t: 'المبلغ', r: 1, h: c => money(c.total) }], cns) : ''}`;
  if ($('#pay', page)) $('#pay', page).onclick = () => paymentForm({ dir: D.payDir, party: doc.party_id, doc: id, amount: rem });
  if ($('#vd', page)) $('#vd', page).onclick = () => modal('إلغاء الفاتورة', field('سبب الإلغاء', '<textarea name="r" rows="2" required></textarea>') + '<p class="muted small">يُعكس القيد وحركة المخزون، وتبقى الفاتورة ظاهرة بحالة ملغاة.</p>', { ok: 'إلغاء الفاتورة', onOk: async f => { await db.rpc(D.void, { p_id: id, p_reason: f.r }); toast('أُلغيت الفاتورة'); route(); } });
  if ($('#cn', page)) $('#cn', page).onclick = async () => {
    const used = {}; if (cns.length) (await db.get('credit_note_lines', { note_id: 'in.(' + cns.map(c => c.id).join(',') + ')', select: 'src_line,qty' })).forEach(x => used[x.src_line] = (used[x.src_line] || 0) + n0(x.qty));
    modal(D.cnT, `<div class="tw"><table class="lines"><thead><tr><th>البند</th><th>المتاح</th><th>كمية المرتجع</th></tr></thead><tbody>${lines.map(l => `<tr><td>${esc(l.item_id ? (im[l.item_id] || {}).name : am[l.account_code] || l.account_code)}</td><td class="num">${+(n0(l.qty) - n0(used[l.id])).toFixed(3)}</td><td><input name="q_${l.id}" type="number" min="0" step="0.001" max="${n0(l.qty) - n0(used[l.id])}" value="0" style="width:110px"></td></tr>`).join('')}</tbody></table></div><div style="height:10px"></div>${field('السبب', '<input name="reason" required>')}${field('التاريخ', `<input type="date" name="d" value="${today()}">`)}`, {
      wide: true, ok: 'ترحيل الإشعار', onOk: async f => { const ls = lines.map(l => ({ line: l.id, qty: +f['q_' + l.id] })).filter(x => x.qty > 0); if (!ls.length) throw new Error('أدخل كمية مرتجع لبند واحد على الأقل');
        await db.rpc('post_credit_note', { p_company: S.cid, p_doc: { kind: D.cnKind, doc: id, date: f.d, reason: f.reason, lines: ls } }); toast('رُحّل الإشعار'); route(); }
    });
  };
}

/* ===== payments ===== */
VIEWS['#/payments'] = async page => {
  const [pays, parties] = await Promise.all([db.get('payments', Object.assign(C(), { order: 'date.desc,no.desc', limit: 300 })), db.get('parties', Object.assign(C(), { select: 'id,name' }))]);
  const pm = {}; parties.forEach(p => pm[p.id] = p.name);
  page.innerHTML = `<div class="head"><div><h1>سندات القبض والصرف</h1></div><div class="row">${can('sales') ? '<button class="btn" id="pin">سند قبض</button>' : ''}${can('purch') ? '<button class="btn" id="pout">سند صرف</button>' : ''}</div></div>
    ${tbl([{ t: 'الرقم', h: p => `<span class="num">${esc(p.no)}</span>` }, { t: 'النوع', h: p => p.direction === 'in' ? '<span class="badge ok">قبض</span>' : '<span class="badge info">صرف</span>' }, { t: 'التاريخ', h: p => fdate(p.date) }, { t: 'الطرف', h: p => esc(pm[p.party_id] || '') }, { t: 'الحساب', h: p => p.account_code === '1110' ? 'الصندوق' : p.account_code === '1120' ? 'البنك' : esc(p.account_code) }, { t: 'المبلغ', r: 1, h: p => money(p.amount) }, { t: 'مقابل', h: p => p.invoice_id || p.bill_id ? 'فاتورة' : '<span class="muted">دفعة على الحساب</span>' }], pays, { empty: 'لا توجد سندات' })}`;
  if ($('#pin', page)) $('#pin', page).onclick = () => paymentForm({ dir: 'in' });
  if ($('#pout', page)) $('#pout', page).onclick = () => paymentForm({ dir: 'out' });
};
async function paymentForm({ dir, party, doc, amount }) {
  const D = dir === 'in' ? DOCS.sales : DOCS.purchases;
  const [parties, cash, open] = await Promise.all([db.get('parties', Object.assign(C(), { kind: 'eq.' + D.party, order: 'name' })), cashAccounts(), db.get(D.table, Object.assign(C(), { status: 'eq.posted', order: 'date', select: 'id,no,party_id,total,date' }))]);
  const paid = await paidMap(D, open.map(o => o.id));
  const openDocs = open.filter(o => n0(o.total) - n0(paid[o.id]) > 0.001);
  if (!parties.length) return toast(dir === 'in' ? 'أضف عميلاً أولاً' : 'أضف مورداً أولاً');
  const d = modal(dir === 'in' ? 'سند قبض' : 'سند صرف', `<div class="fg">${field(dir === 'in' ? 'العميل' : 'المورد', `<select name="party" id="pp">${parties.map(p => opt(p.id, p.name, party)).join('')}</select>`)}
     ${field('مقابل فاتورة', `<select name="doc" id="pdoc"></select>`)}${field('المبلغ', inp('amount', amount || '', 'type="number" step="0.01" min="0.01" id="pam"'))}${field(dir === 'in' ? 'إلى حساب' : 'من حساب', `<select name="acc">${cash.map(a => opt(a.code, a.name, '1120')).join('')}</select>`)}
     ${field('التاريخ', `<input type="date" name="date" value="${today()}" max="${today()}">`)}${field('ملاحظات', inp('note'))}</div>`, {
    ok: 'حفظ السند', onOk: async f => { if (!(+f.amount > 0)) throw new Error('أدخل مبلغاً أكبر من صفر');
      await db.rpc('record_payment', { p_company: S.cid, p_doc: { direction: dir, party: f.party, amount: +f.amount, account: f.acc, date: f.date, note: blank(f.note), [D.payKey]: f.doc || '' } }); toast('حُفظ السند'); route(); }
  });
  const fill = () => { const p = $('#pp', d).value; $('#pdoc', d).innerHTML = '<option value="">— دفعة على الحساب —</option>' + openDocs.filter(o => o.party_id === p).map(o => opt(o.id, o.no + ' — متبقي ' + money(n0(o.total) - n0(paid[o.id])), doc)).join(''); };
  $('#pp', d).onchange = () => { doc = null; fill(); }; fill();
  $('#pdoc', d).onchange = e => { const o = openDocs.find(x => x.id === e.target.value); if (o) $('#pam', d).value = r2(n0(o.total) - n0(paid[o.id])); };
}

/* ===== journal ===== */
const SRC = { manual: 'يدوي', reversal: 'عكس', sales: 'مبيعات', purchase: 'مشتريات', receipt: 'قبض', payment: 'صرف', stock: 'مخزون', payroll: 'رواتب', payroll_pay: 'صرف رواتب', advance: 'سلفة', expense: 'مصروفات', opening: 'افتتاحي', sales_return: 'مرتجع مبيعات', purchase_return: 'مرتجع مشتريات' };
VIEWS['#/journal'] = async page => {
  const [jes, acc] = await Promise.all([db.get('journal_entries', Object.assign(C(), { order: 'date.desc,created_at.desc', limit: 200 })), accounts()]);
  const am = {}; acc.forEach(a => am[a.code] = a.name);
  const reversed = new Set(jes.filter(j => j.reverses).map(j => j.reverses));
  page.innerHTML = `<div class="head"><div><h1>القيود اليومية</h1><div class="muted">آخر 200 قيد — القيود لا تُعدّل، تُعكس فقط</div></div>${can('jepost') ? '<button class="btn pri" id="nj">قيد يدوي</button>' : ''}</div>
    ${tbl([{ t: 'الرقم', h: j => `<span class="num">${esc(j.no)}</span>` }, { t: 'التاريخ', h: j => fdate(j.date) }, { t: 'البيان', k: 'memo' }, { t: 'المصدر', h: j => `<span class="badge">${esc(SRC[j.source] || j.source)}</span>` + (reversed.has(j.id) ? ' <span class="badge bad">معكوس</span>' : '') }], jes, { empty: 'لا توجد قيود', onRow: true })}`;
  bindRows(page, jes, async j => {
    const ls = await db.get('journal_lines', { entry_id: 'eq.' + j.id, order: 'id' });
    const d = modal('قيد ' + j.no, `<p>${esc(j.memo)} · ${fdate(j.date)}</p>${tbl([{ t: 'الحساب', h: l => esc(l.account_code + ' — ' + (am[l.account_code] || '')) }, { t: 'مدين', r: 1, h: l => n0(l.debit) ? money(l.debit) : '' }, { t: 'دائن', r: 1, h: l => n0(l.credit) ? money(l.credit) : '' }], ls)}
      ${j.source === 'manual' && !reversed.has(j.id) && can('jepost') ? '<button type="button" class="btn danger sm" id="rv" style="margin-top:12px">عكس القيد</button>' : ''}`);
    if ($('#rv', d)) $('#rv', d).onclick = async () => { try { await db.rpc('reverse_journal', { p_entry: j.id, p_date: today() }); d.close(); toast('عُكس القيد'); route(); } catch (e) { showErr($('#merr', d), e); } };
  });
  if ($('#nj', page)) $('#nj', page).onclick = () => {
    const post = acc.filter(a => !a.is_header); const ao = '<option value="">—</option>' + post.map(a => opt(a.code, a.code + ' — ' + a.name)).join('');
    const row = () => `<tr><td><select data-a>${ao}</select></td><td><input data-d type="number" step="0.01" min="0" style="width:120px"></td><td><input data-c type="number" step="0.01" min="0" style="width:120px"></td></tr>`;
    const d = modal('قيد يدوي', `<div class="fg">${field('التاريخ', `<input type="date" name="date" value="${today()}">`)}${field('البيان', inp('memo'))}</div><div style="height:10px"></div><div class="tw"><table class="lines"><thead><tr><th>الحساب</th><th>مدين</th><th>دائن</th></tr></thead><tbody id="jl">${row()}${row()}</tbody><tfoot><tr><td>الفرق</td><td colspan="2" class="num" id="jd">0.00</td></tr></tfoot></table></div><button type="button" class="btn sm" id="ja" style="margin-top:8px">+ سطر</button>`, {
      wide: true, ok: 'ترحيل', onOk: async f => {
        const lines = $$('#jl tr', d).map(tr => ({ a: $('[data-a]', tr).value, d: +$('[data-d]', tr).value || 0, c: +$('[data-c]', tr).value || 0 })).filter(l => l.a && (l.d || l.c));
        if (lines.some(l => l.d && l.c)) throw new Error('السطر الواحد إما مدين أو دائن');
        const dd = r2(lines.reduce((a, l) => a + l.d, 0)), cc = r2(lines.reduce((a, l) => a + l.c, 0));
        if (lines.length < 2 || dd !== cc) throw new Error('القيد غير متوازن');
        await db.rpc('post_manual_journal', { p_company: S.cid, p_date: f.date, p_memo: f.memo, p_lines: lines }); toast('رُحّل القيد'); route();
      }
    });
    $('#ja', d).onclick = () => $('#jl', d).insertAdjacentHTML('beforeend', row());
    $('#jl', d).addEventListener('input', () => { let s = 0; $$('#jl tr', d).forEach(tr => s += (+$('[data-d]', tr).value || 0) - (+$('[data-c]', tr).value || 0)); $('#jd', d).textContent = money(Math.abs(s)); });
  };
};

/* ===== chart of accounts ===== */
VIEWS['#/coa'] = async page => {
  cache.acc = null; const acc = await accounts();
  page.innerHTML = `<div class="head"><div><h1>دليل الحسابات</h1></div>${can('coa') ? '<button class="btn pri" id="na">حساب فرعي</button>' : ''}</div>
    ${tbl([{ t: 'الرمز', h: a => `<span class="num">${esc(a.code)}</span>` }, { t: 'الحساب', h: a => a.is_header ? '<b>' + esc(a.name) + '</b>' : '&nbsp;&nbsp;&nbsp;' + esc(a.name) }, { t: 'النوع', h: a => ({ asset: 'أصول', liab: 'خصوم', equity: 'حقوق ملكية', rev: 'إيرادات', exp: 'مصروفات' })[a.type] }], acc, { onRow: can('ledger') })}`;
  if (can('ledger')) bindRows(page, acc, a => { if (!a.is_header) location.hash = '#/reports?r=ledger&code=' + a.code; });
  if ($('#na', page)) $('#na', page).onclick = () => modal('حساب فرعي جديد', `<div class="fg">${field('الحساب الرئيسي', `<select name="p">${acc.filter(a => a.is_header).map(a => opt(a.code, a.code + ' — ' + a.name)).join('')}</select>`)}${field('الرمز (4 أرقام)', inp('code', '', 'dir="ltr" maxlength="4" inputmode="numeric"'))}${field('الاسم', inp('name'), 'wide')}</div>`, {
    onOk: async f => { await db.rpc('add_account', { p_company: S.cid, p_code: f.code, p_name: f.name, p_parent: f.p }); toast('أُضيف الحساب'); route(); }
  });
};

/* ===== reports ===== */
VIEWS['#/reports'] = async (page, arg, q) => {
  const tabs = [['tb', 'ميزان المراجعة', 'reports'], ['is', 'قائمة الدخل', 'reports'], ['bs', 'المركز المالي', 'reports'], ['vat', 'إقرار الضريبة', 'vat'], ['ar', 'أعمار الذمم المدينة', 'sales'], ['ap', 'أعمار الذمم الدائنة', 'purch'], ['ledger', 'دفتر الأستاذ', 'ledger']].filter(t => can(t[2]));
  if (!tabs.length) { page.innerHTML = '<div class="note">لا تملك صلاحية التقارير.</div>'; return; }
  const r = tabs.some(t => t[0] === q.get('r')) ? q.get('r') : tabs[0][0];
  const from = q.get('from') || today().slice(0, 4) + '-01-01', to = q.get('to') || today();
  const acc = await accounts();
  const ranged = ['is', 'vat', 'ledger'].includes(r);
  page.innerHTML = `<div class="head"><div><h1>التقارير</h1></div></div><div class="seg" style="margin-bottom:14px">${tabs.map(t => `<a href="#/reports?r=${t[0]}" class="${t[0] === r ? 'on' : ''}">${t[1]}</a>`).join('')}</div>
    <form id="rf" class="row card" style="padding:12px">${r === 'ledger' ? `<select name="code" style="width:auto">${acc.filter(a => !a.is_header).map(a => opt(a.code, a.code + ' — ' + a.name, q.get('code') || '1120')).join('')}</select>` : ''}
      ${ranged ? `<label style="margin:0">من</label><input type="date" name="from" value="${from}" style="width:auto">` : ''}<label style="margin:0">${ranged ? 'إلى' : 'حتى تاريخ'}</label><input type="date" name="to" value="${to}" style="width:auto"><button class="btn">عرض</button><button type="button" class="btn" onclick="window.print()">طباعة</button></form><div id="rb">جارٍ التحميل…</div>`;
  $('#rf', page).onsubmit = e => { e.preventDefault(); const f = formData(e.target); location.hash = '#/reports?' + qs(Object.assign({ r }, f)); };
  const rb = $('#rb', page);
  if (r === 'tb') { const rows = await db.rpc('trial_balance', { p_company: S.cid, p_as_of: to }); const sd = rows.reduce((a, x) => a + n0(x.debit), 0), sc = rows.reduce((a, x) => a + n0(x.credit), 0);
    rb.innerHTML = tbl([{ t: 'الرمز', h: x => `<span class="num">${esc(x.code)}</span>` }, { t: 'الحساب', k: 'name' }, { t: 'مدين', r: 1, h: x => n0(x.debit) ? money(x.debit) : '' }, { t: 'دائن', r: 1, h: x => n0(x.credit) ? money(x.credit) : '' }], rows, { empty: 'لا توجد حركات', foot: `<td colspan="2">الإجمالي ${Math.abs(sd - sc) < 0.01 ? '<span class="badge ok">متوازن</span>' : '<span class="badge bad">غير متوازن</span>'}</td><td class="r num">${money(sd)}</td><td class="r num">${money(sc)}</td>` }); }
  if (r === 'is') { const rows = await db.rpc('income_statement', { p_company: S.cid, p_from: from, p_to: to }); const sec = { revenue: 'الإيرادات', cogs: 'تكلفة المبيعات', expense: 'المصروفات', net_profit: '' };
    rb.innerHTML = tbl([{ t: 'القسم', h: x => esc(sec[x.section]) }, { t: 'الحساب', h: x => x.section === 'net_profit' ? '<b>' + esc(x.name) + '</b>' : esc(x.name) }, { t: 'المبلغ', r: 1, h: x => x.section === 'net_profit' ? `<b class="${n0(x.amount) < 0 ? 'bad' : 'ok'}">${money(x.amount)}</b>` : money(x.amount) }], rows, { empty: 'لا توجد حركات' }); }
  if (r === 'bs') { const rows = await db.rpc('balance_sheet', { p_company: S.cid, p_as_of: to }); const sec = { asset: 'الأصول', liab: 'الخصوم', equity: 'حقوق الملكية' }; const tot = k => rows.filter(x => x.section === k).reduce((a, x) => a + n0(x.amount), 0);
    rb.innerHTML = tbl([{ t: 'القسم', h: x => esc(sec[x.section]) }, { t: 'الحساب', h: x => esc((x.code ? x.code + ' — ' : '') + x.name) }, { t: 'المبلغ', r: 1, h: x => money(x.amount) }], rows, { empty: 'لا توجد أرصدة' }) + `<p>الأصول <b class="num">${money(tot('asset'))}</b> · الخصوم وحقوق الملكية <b class="num">${money(tot('liab') + tot('equity'))}</b> ${Math.abs(tot('asset') - tot('liab') - tot('equity')) < 0.01 ? '<span class="badge ok">متوازن</span>' : '<span class="badge bad">غير متوازن</span>'}</p>`; }
  if (r === 'vat') { const [v] = await db.rpc('vat_summary', { p_company: S.cid, p_from: from, p_to: to }); const row = (t, a) => `<tr><td>${t}</td><td class="r num">${money(a)}</td></tr>`;
    rb.innerHTML = `<div class="tw"><table><tbody>${row('المبيعات الخاضعة للنسبة الأساسية (صافي المرتجعات)', v.sales_taxable)}${row('المبيعات الصفرية', v.sales_zero)}${row('ضريبة المخرجات', v.output_vat)}${row('المشتريات الخاضعة للنسبة الأساسية', v.purchases_taxable)}${row('المشتريات الصفرية', v.purchases_zero)}${row('ضريبة المدخلات', v.input_vat)}</tbody><tfoot><tr><td>صافي الضريبة ${n0(v.net_vat) >= 0 ? 'المستحقة' : 'القابلة للاسترداد'}</td><td class="r num">${money(Math.abs(v.net_vat))}</td></tr></tfoot></table></div><p class="muted small">ملخص استرشادي لتعبئة الإقرار في بوابة هيئة الزكاة والضريبة والجمارك.</p>`; }
  if (r === 'ar' || r === 'ap') { const rows = await db.rpc('aging', { p_company: S.cid, p_kind: r === 'ar' ? 'sales' : 'purchase', p_as_of: to });
    rb.innerHTML = tbl([{ t: r === 'ar' ? 'العميل' : 'المورد', k: 'party' }, { t: 'غير مستحق', r: 1, h: x => money(x.not_due) }, { t: '1–30', r: 1, h: x => money(x.d1_30) }, { t: '31–60', r: 1, h: x => money(x.d31_60) }, { t: '61–90', r: 1, h: x => money(x.d61_90) }, { t: '+90', r: 1, h: x => money(x.d90_plus) }, { t: 'دفعات غير مخصصة', r: 1, h: x => money(x.unallocated) }, { t: 'الصافي', r: 1, h: x => '<b>' + money(x.net) + '</b>' }], rows, { empty: 'لا توجد أرصدة مفتوحة' }); }
  if (r === 'ledger') { const code = q.get('code') || '1120'; const rows = await db.rpc('account_ledger', { p_company: S.cid, p_code: code, p_from: from, p_to: to });
    rb.innerHTML = tbl([{ t: 'التاريخ', h: x => fdate(x.date) }, { t: 'القيد', h: x => `<span class="num">${esc(x.no || '')}</span>` }, { t: 'البيان', k: 'memo' }, { t: 'مدين', r: 1, h: x => n0(x.debit) ? money(x.debit) : '' }, { t: 'دائن', r: 1, h: x => n0(x.credit) ? money(x.credit) : '' }, { t: 'الرصيد', r: 1, h: x => money(x.balance) }], rows); }
};

applyLang();
boot();
</script>
