/* ===== team leave calendar: who is off when (HR: everyone, manager: own team) ===== */
VIEWS['#/leavecal'] = async (page, arg, q) => {
  if (!isHR() && !has('manager')) { page.innerHTML = '<div class="note">هذه الصفحة للموارد البشرية والمدراء.</div>'; return; }
  const m = /^\d{4}-\d{2}$/.test(q.get('m') || '') ? q.get('m') : today().slice(0, 7);
  const [y, mo] = m.split('-').map(Number), nd = new Date(y, mo, 0).getDate(), ms = m + '-01', me = m + '-' + String(nd).padStart(2, '0');
  const shiftM = (k) => { const d = new Date(y, mo - 1 + k, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
  const [em, reqs, hols, shifts, lt] = await Promise.all([employeesMap(true), db.get('requests', { company_id: 'eq.' + S.cid, kind: 'eq.leave', status: 'in.(approved,pending)', from_date: 'lte.' + me, to_date: 'gte.' + ms }),
    db.get('holidays', { company_id: 'eq.' + S.cid, day: 'gte.' + ms }).catch(() => []), db.get('shifts', { company_id: 'eq.' + S.cid, is_default: 'eq.true' }).catch(() => []), LEAVE_TYPES()]);
  const ltn = {}; lt.forEach(l => ltn[l.code] = l.name_ar);
  const team = Object.values(em).filter(e => (isHR() || e.manager_id === S.emp) && e.hire_date <= me && (!e.end_date || e.end_date >= ms));
  const wd = (shifts[0] || {}).work_days || [0, 1, 2, 3, 4];
  const hol = {}; hols.filter(h => h.day <= me).forEach(h => hol[h.day] = h.name);
  const days = Array.from({ length: nd }, (_, i) => { const d = m + '-' + String(i + 1).padStart(2, '0'); return { d, n: i + 1, dow: new Date(d + 'T12:00:00').getDay() }; });
  const cell = (e, d) => reqs.find(r => r.employee_id === e.id && r.from_date <= d && r.to_date >= d);
  const DN = x => new Date(x.d + 'T12:00:00').toLocaleDateString(LANG === 'en' ? 'en-GB' : 'ar-SA', { weekday: 'narrow' });
  const cnt = days.map(x => team.filter(e => cell(e, x.d)).length), lim = Math.max(2, Math.ceil(team.length / 3));
  const ab = d => { const r = cell(d.e, d.x.d); return r ? `<td class="lc ${r.status === 'approved' ? 'on' : 'pend'}" title="${esc((ltn[r.sub] || 'إجازة') + ' · ' + r.from_date + ' → ' + r.to_date + (r.status === 'pending' ? ' · بانتظار الاعتماد' : ''))}"></td>` : `<td class="lc${hol[d.x.d] ? ' hol' : !wd.includes(d.x.dow) ? ' off' : ''}"></td>`; };
  page.innerHTML = `<div class="head"><div><h1>تقويم الإجازات</h1><div class="muted">${isHR() ? 'كل الموظفين' : 'فريقك'} · الإجازات المعتمدة وتحت الاعتماد</div></div>
      <div class="row"><a class="btn sm" href="#/leavecal?m=${shiftM(-1)}">→ السابق</a><b class="num">${m}</b><a class="btn sm" href="#/leavecal?m=${shiftM(1)}">التالي ←</a></div></div>
    ${team.length ? `<div class="tw lcal"><table><thead><tr><th class="lname">الموظف</th>${days.map(x => `<th class="${hol[x.d] ? 'hol' : !wd.includes(x.dow) ? 'off' : ''}" title="${esc(hol[x.d] || '')}"><span class="num">${x.n}</span><br><span class="small muted" data-nt>${DN(x)}</span></th>`).join('')}</tr></thead>
      <tbody>${team.map(e => `<tr><td class="lname">${esc(e.full_name)}</td>${days.map(x => ab({ e, x })).join('')}</tr>`).join('')}</tbody>
      <tfoot><tr><td class="lname">الغائبون</td>${cnt.map(c => `<td class="${c >= lim ? 'bad' : ''}"><span class="num">${c || ''}</span></td>`).join('')}</tr></tfoot></table></div>
      <div class="row small" style="margin-top:10px;gap:14px"><span><i class="lk on"></i> إجازة معتمدة</span><span><i class="lk pend"></i> بانتظار الاعتماد</span><span><i class="lk hol"></i> عطلة رسمية</span><span><i class="lk off"></i> راحة أسبوعية</span><span class="bad">الرقم الأحمر: غياب ثلث الفريق أو أكثر</span></div>`
      : '<div class="note">لا يوجد موظفون في فريقك.</div>'}`;
};
// leave overlap inside the requester's team, shown to whoever decides the request
async function teamOverlap(r) {
  if (r.kind !== 'leave' || !r.from_date || !r._emp) return '';
  const os = await db.get('requests', { company_id: 'eq.' + S.cid, kind: 'eq.leave', status: 'in.(approved,pending)', from_date: 'lte.' + r.to_date, to_date: 'gte.' + r.from_date, employee_id: 'neq.' + r.employee_id }).catch(() => []);
  if (!os.length) return '<p class="small ok">لا أحد من الفريق في إجازة خلال هذه الفترة.</p>';
  const em = await db.get('employees', { id: 'in.(' + [...new Set(os.map(o => o.employee_id))].join(',') + ')', select: 'id,full_name,manager_id,department_id' }).catch(() => []);
  const mates = em.filter(x => (r._emp.manager_id && x.manager_id === r._emp.manager_id) || (r._emp.department_id && x.department_id === r._emp.department_id));
  if (!mates.length) return '<p class="small ok">لا أحد من الفريق في إجازة خلال هذه الفترة.</p>';
  return `<div class="note" style="margin:8px 0"><span>في إجازة خلال نفس الفترة من الفريق:</span> ${mates.map(x => { const o = os.find(z => z.employee_id === x.id); return `<b>${esc(x.full_name)}</b>` + ` <span class="num small">(${o.from_date} → ${o.to_date}${o.status === 'pending' ? '، بانتظار الاعتماد' : ''})</span>`; }).join('، ')}</div>`;
}

'use strict';
/* ===== violations and disciplinary penalties (Labor Law Arts. 66–73, model regulation tables) ===== */
const PEN_CAT = { time: 'مخالفات تتعلق بمواعيد العمل', org: 'مخالفات تتعلق بتنظيم العمل', conduct: 'مخالفات تتعلق بسلوك العامل' };
const PEN_ST = { open: ['قيد التحقيق', 'wait'], applied: ['صدر الجزاء', 'bad'], dropped: ['حُفظت', 'info'], overturned: ['أُلغي بالتظلم', 'ok'] };
const PEN_ORD = ['', 'الأولى', 'الثانية', 'الثالثة', 'الرابعة'];
const PEN_EXTRA = { late: 'بالإضافة إلى حسم أجر مدة التأخر', absence: 'بالإضافة إلى حسم أجر مدة الغياب', left: 'بالإضافة إلى حسم أجر مدة ترك العمل' };
const INV_MODE = { written: 'تحقيق كتابي', oral: 'استجواب شفهي (مخالفة بسيطة)', refused: 'امتنع العامل عن الإدلاء بأقواله' };
function penLabel(a) {
  if (a === 'W') return 'إنذار كتابي';
  if (/^p\d+$/.test(a)) return 'حسم ' + a.slice(1) + '% من أجر يوم';
  if (/^d\d+$/.test(a)) { const n = +a.slice(1); return 'حسم أجر ' + (n === 1 ? 'يوم' : n === 2 ? 'يومين' : n + ' أيام'); }
  return { defer: 'تأجيل الترقية أو الحرمان من العلاوة لمرة واحدة', defer80: 'تأجيل الترقية أو الحرمان من العلاوة لمرة واحدة، مع إنذار بالفصل وفق المادة 80',
    eos: 'الفصل من العمل مع المكافأة', a80: 'الفصل دون مكافأة أو إشعار أو تعويض وفق المادة 80', '-': '—' }[a] || a;
}
const penBadge = s => `<span class="badge ${PEN_ST[s][1]}">${esc(PEN_ST[s][0])}</span>`;
const VTYPES = async () => cache.vt || (cache.vt = await db.get('violation_types', { order: 'code' }));

const isDismiss = a => a === 'eos' || a === 'a80';

VIEWS['#/penalties'] = async (page, arg, q) => {
  if (!isHR() && !has('finance')) { page.innerHTML = '<div class="note">هذه الصفحة للموارد البشرية.</div>'; return; }
  if (arg) return penDetail(page, arg);
  const tab = ['cases', 'register', 'table'].includes(q.get('t')) ? q.get('t') : 'cases';
  const [vt, em, ps] = await Promise.all([VTYPES(), employeesMap(true), db.get('penalties', { company_id: 'eq.' + S.cid, order: 'created_at.desc' })]);
  const vm = {}; vt.forEach(v => vm[v.code] = v);
  const seg = `<div class="seg" style="margin-bottom:14px">${[['cases', 'المخالفات'], ['register', 'سجل الغرامات (م73)'], ['table', 'جدول المخالفات والجزاءات']].map(t => `<a href="#/penalties?t=${t[0]}" class="${t[0] === tab ? 'on' : ''}">${t[1]}</a>`).join('')}</div>`;
  const head = `<div class="head"><div><h1>المخالفات والجزاءات</h1><div class="muted">وفق جداول اللائحة النموذجية لتنظيم العمل والمواد 66–73 من نظام العمل</div></div>${isHR() ? '<button class="btn pri" id="pnew">+ تسجيل مخالفة</button>' : ''}</div>`;
  if (tab === 'cases') {
    const c = st => ps.filter(p => p.status === st).length, grv = ps.filter(p => p.griev_on && !p.griev_result).length;
    page.innerHTML = head + seg + `<div class="grid" style="margin-bottom:16px">
        <div class="card kpi"><div class="muted small">قيد التحقيق</div><div class="v num">${c('open')}</div></div>
        <div class="card kpi"><div class="muted small">تظلمات بانتظار البت</div><div class="v num ${grv ? 'bad' : ''}">${grv}</div></div>
        <div class="card kpi"><div class="muted small">جزاءات صادرة</div><div class="v num">${c('applied')}</div></div></div>
      ${tbl([{ t: 'الموظف', h: p => esc((em[p.employee_id] || {}).full_name || '') }, { t: 'المخالفة', h: p => `<span class="num muted small">${esc(p.code)}</span> <span class="small">${esc((vm[p.code] || {}).title || '')}</span>` },
        { t: 'التاريخ', h: p => fdate(p.occurred_on) }, { t: 'الجزاء', h: p => `<span class="small">المرة ${PEN_ORD[p.step]}: ${esc(penLabel(p.action))}</span>` }, { t: 'الغرامة', r: 1, h: p => n0(p.fine) ? money(p.fine) : '—' },
        { t: 'الحالة', h: p => penBadge(p.status) + (p.griev_on && !p.griev_result ? ' <span class="badge bad">تظلم</span>' : '') }], ps, { empty: 'لا توجد مخالفات مسجلة', onRow: true }).replace('class="tw"', 'class="tw wrapcells"')}`;
    bindRows(page, ps, p => location.hash = '#/penalties/' + p.id);
  } else if (tab === 'register') {
    const fs = ps.filter(p => p.status === 'applied' && n0(p.fine) > 0);
    const ded = fs.length ? await db.get('penalty_deductions', { penalty_id: 'in.(' + fs.map(p => p.id).join(',') + ')' }).catch(() => []) : [];
    const paid = id => ded.filter(d => d.penalty_id === id).reduce((a, d) => a + n0(d.amount), 0);
    page.innerHTML = head + seg + `<div class="row" style="justify-content:space-between;margin-bottom:10px"><p class="muted small" style="margin:0">المادة 73: تُقيَّد الغرامات في سجل خاص، ولا يُتصرف فيها إلا فيما يعود بالنفع على عمال المنشأة. تُسجَّل محاسبياً في حساب «غرامات العاملين» وليست إيراداً للمنشأة.</p><button class="btn sm" id="rgp">طباعة</button></div>
      <div id="rgb" class="wrapcells">${tbl([{ t: 'اسم العامل', h: p => esc((em[p.employee_id] || {}).full_name || '') }, { t: 'مقدار الأجر الشهري', r: 1, h: p => money(n0(p.daily_wage) * 30) }, { t: 'مقدار الغرامة', r: 1, h: p => money(p.fine) },
        { t: 'سبب توقيعها', h: p => `<span class="small">${esc((vm[p.code] || {}).title || p.code)}</span>` }, { t: 'تاريخ التوقيع', h: p => fdate(p.notified_on) }, { t: 'المحسوم', r: 1, h: p => money(paid(p.id)) }], fs,
        { empty: 'لا توجد غرامات', foot: `<td colspan="2">الإجمالي</td><td class="r num">${money(fs.reduce((a, p) => a + n0(p.fine), 0))}</td><td colspan="2"></td><td class="r num">${money(fs.reduce((a, p) => a + paid(p.id), 0))}</td>` })}</div>`;
    $('#rgp', page).onclick = () => printBlock($('#rgb', page), 'سجل الغرامات — المادة 73');
  } else {
    const admin = has('owner', 'admin');
    page.innerHTML = head + seg + `${admin ? `<div class="card"><div class="row"><b>أساس الأجر اليومي للغرامات</b><select id="pbase" style="width:auto">${opt('gross', 'الأجر الفعلي (الأساسي + البدلات) ÷ 30', S.company.penalty_base)}${opt('basic', 'الأجر الأساسي ÷ 30', S.company.penalty_base)}</select></div>
        <p class="muted small" style="margin:6px 0 0">النسب في الجدول من أجر يوم. والغرامة عن المخالفة الواحدة لا تزيد على أجر خمسة أيام، ولا يُحسم من الأجر للغرامات أكثر من أجر خمسة أيام في الشهر (م70).</p></div>` : ''}
      ${Object.entries(PEN_CAT).map(([k, t]) => `<h2 style="margin-top:16px">${esc(t)}</h2><div class="pentbl">${tbl([{ t: 'م', h: v => `<span class="num">${v.no}</span>` }, { t: 'المخالفة', h: v => esc(v.title) + (v.extra ? `<div class="small muted">${esc(PEN_EXTRA[v.extra])}</div>` : '') + (v.note ? `<div class="small muted">${esc(v.note)}</div>` : '') },
        ...[1, 2, 3, 4].map(i => ({ t: 'المرة ' + PEN_ORD[i], h: v => `<span class="small">${esc(penLabel(v.steps[i - 1]))}</span>` }))], vt.filter(v => v.cat === k))}</div>`).join('')}
      <p class="muted small">لا يُشدَّد الجزاء عند تكرار المخالفة إذا مضى 180 يوماً على إبلاغ العامل بالجزاء السابق (م68).</p>`;
    if ($('#pbase', page)) $('#pbase', page).onchange = async ev => { try { await db.upd('companies', { id: 'eq.' + S.cid }, { penalty_base: ev.target.value }); await loadContext(); toast('تم الحفظ'); } catch (e) { toast(e.message); } };
  }
  if ($('#pnew', page)) $('#pnew', page).onclick = () => penNew(vt, em);
};

function penNew(vt, em) {
  const act = Object.values(em).filter(e => !e.end_date || e.end_date >= today());
  const m = modal('تسجيل مخالفة', `<div class="fg">${field('الموظف', `<select name="emp"><option value="">— اختر —</option>${act.map(e => opt(e.id, e.full_name + ' (' + e.emp_no + ')')).join('')}</select>`, 'wide')}
    ${field('المخالفة', `<select name="code"><option value="">— اختر —</option>${Object.entries(PEN_CAT).map(([k, t]) => `<optgroup label="${esc(t)}">${vt.filter(v => v.cat === k).map(v => opt(v.code, v.no + '. ' + v.title)).join('')}</optgroup>`).join('')}</select>`, 'wide')}
    ${field('تاريخ المخالفة', `<input type="date" name="occ" value="${today()}">`)}${field('تاريخ اكتشافها', `<input type="date" name="disc" value="${today()}">`)}
    ${field('وصف الواقعة', '<textarea name="desc" rows="2"></textarea>', 'wide')}<div class="wide" id="pprev"></div></div>
    <p class="muted small">يُسجَّل اتهام العامل خلال 30 يوماً من اكتشاف المخالفة (م69). بعد التسجيل اطبع الإشعار وسلّمه للعامل، ثم سجّل التحقيق وسماع دفاعه قبل توقيع أي جزاء (م71).</p>`, {
    ok: 'تسجيل', onOk: async f => {
      if (!f.emp || !f.code) throw new Error('اختر الموظف والمخالفة');
      const id = await db.rpc('pen_open', { p_company: S.cid, p_emp: f.emp, p_code: f.code, p_occurred: f.occ, p_discovered: f.disc, p_desc: f.desc || '' });
      toast('سُجّلت المخالفة'); location.hash = '#/penalties/' + id; } });
  const prev = async () => {
    const f = $('#mform', m), box = $('#pprev', m); if (!f.emp.value || !f.code.value || !f.occ.value) { box.innerHTML = ''; return; }
    try { const [k] = await db.rpc('pen_preview', { p_emp: f.emp.value, p_code: f.code.value, p_on: f.occ.value }); const v = vt.find(x => x.code === f.code.value) || {};
      box.innerHTML = `<div class="note">المرة ${PEN_ORD[k.step]} لهذه المخالفة خلال 180 يوماً: <b>${esc(penLabel(k.action))}</b>${n0(k.fine) ? ` = <b class="num">${money(k.fine)}</b> ريال (أجر اليوم ${money(k.daily_wage)})` : ''}${v.extra ? '<br><span class="small">' + esc(PEN_EXTRA[v.extra]) + '</span>' : ''}${v.note ? '<br><span class="small">' + esc(v.note) + '</span>' : ''}</div>`; } catch (e) { box.innerHTML = ''; }
  };
  ['emp', 'code', 'occ'].forEach(n => $('#mform', m)[n].addEventListener('change', prev));
}

async function penDetail(page, id) {
  const [[p], vt, em] = await Promise.all([db.get('penalties', { id: 'eq.' + id }), VTYPES(), employeesMap(true)]);
  if (!p) throw new Error('المخالفة غير موجودة');
  const v = vt.find(x => x.code === p.code) || {}, e = em[p.employee_id] || {}, td = today(), hr = isHR();
  const ded = await db.get('penalty_deductions', { penalty_id: 'eq.' + id }).catch(() => []);
  const runs = ded.length ? await db.get('payroll_runs', { id: 'in.(' + ded.map(d => d.run_id).join(',') + ')' }).catch(() => []) : [];
  const gDead = p.notified_on ? await db.rpc('pen_grievance_deadline', { p_company: S.cid, p_from: p.notified_on }).catch(() => null) : null;
  const decDead = p.inv_on ? addDays(p.inv_on, 30) : null;
  page.classList.add('wrapcells');
  const r = (t, x) => `<tr><td class="muted">${esc(t)}</td><td>${x}</td></tr>`;
  const penTxt = `المرة ${PEN_ORD[p.step]}: ${penLabel(p.action)}${n0(p.fine) ? ' — ' + money(p.fine) + ' ريال' : ''}`;
  page.innerHTML = `<div class="head"><div><a href="#/penalties" class="small">← المخالفات والجزاءات</a><h1>${esc(e.full_name || '')} ${penBadge(p.status)}</h1><div class="muted"><span class="num">${esc(e.emp_no || '')}</span>${e.job_title ? ' · ' + esc(e.job_title) : ''}</div></div>
      <div class="row"><button class="btn sm" id="prn">طباعة الإشعار</button>${p.inv_on ? '<button class="btn sm" id="prm">طباعة محضر التحقيق</button>' : ''}${p.status === 'applied' || p.status === 'overturned' ? '<button class="btn sm" id="prd">طباعة القرار</button>' : ''}</div></div>
    <div class="card"><h2>الواقعة</h2><div class="tw"><table><tbody>
      ${r('المخالفة', `<span class="num muted small">${esc(p.code)}</span> ${esc(v.title || '')}`)}${r('تاريخ المخالفة', fdate(p.occurred_on))}${r('تاريخ اكتشافها', fdate(p.discovered_on))}
      ${r('الوصف', esc(p.description || '—'))}${r('الجزاء حسب الجدول', esc(penTxt) + (v.extra ? `<div class="small muted">${esc(PEN_EXTRA[v.extra])}</div>` : '') + (v.note ? `<div class="small muted">${esc(v.note)}</div>` : ''))}</tbody></table></div>
      ${p.emp_defense ? `<div class="note" style="margin-top:10px"><b>رد الموظف الكتابي:</b> ${esc(p.emp_defense)}</div>` : ''}</div>
    <div class="card" id="pinv"><h2>التحقيق (م71)</h2>${p.inv_on ? `<div class="tw"><table><tbody>${r('التاريخ', fdate(p.inv_on))}${r('الطريقة', esc(INV_MODE[p.inv_mode]))}${r('المحضر', esc(p.inv_text))}</tbody></table></div>`
      : p.status === 'open' && hr ? `<form id="invf" class="fg" novalidate>${field('طريقة التحقيق', `<select name="mode">${opt('written', INV_MODE.written)}${opt('oral', INV_MODE.oral)}${opt('refused', INV_MODE.refused)}</select>`)}${field('تاريخ التحقيق', `<input type="date" name="on" value="${td}">`)}
          ${field('المحضر: ما نُسب للعامل وأقواله ودفاعه', `<textarea name="txt" rows="4">${esc(p.emp_defense ? 'رد العامل: ' + p.emp_defense : '')}</textarea>`, 'wide')}<div class="wide"><div id="inverr"></div><button class="btn pri" id="invb">حفظ المحضر</button></div></form>
          <p class="muted small">الاستجواب الشفهي فقط للمخالفات البسيطة التي جزاؤها إنذار أو غرامة لا تزيد على أجر يوم، على أن يُثبت في المحضر.</p>` : '<p class="muted">لم يُسجَّل تحقيق.</p>'}</div>
    <div class="card" id="pdec"><h2>القرار (م69، م72)</h2>${p.status === 'open' ? (hr ? (p.inv_on ? `<p class="small">آخر موعد لتوقيع الجزاء: <b class="num">${decDead}</b> (30 يوماً من انتهاء التحقيق)${decDead < td ? ' <span class="badge bad">انقضت المهلة</span>' : ''}</p>
          <div class="row"><label class="row small" style="gap:6px">تاريخ إبلاغ العامل كتابةً <input type="date" id="pnot" value="${td}" style="width:auto"></label><button class="btn pri" id="papl">توقيع الجزاء</button><button class="btn" id="pdrop">حفظ المخالفة (لم تثبت)</button></div>`
          : '<p class="muted">سجّل التحقيق أولاً.</p><button class="btn" id="pdrop">حفظ المخالفة (لم تثبت)</button>') : '<p class="muted">قيد التحقيق.</p>')
      : `<div class="tw"><table><tbody>${r('القرار', p.status === 'dropped' ? 'حُفظت المخالفة' : esc(penTxt))}${r('تاريخ القرار', fdate(p.decided_on))}${p.notified_on ? r('تاريخ الإبلاغ', fdate(p.notified_on)) : ''}${p.decision_note ? r('ملاحظات', esc(p.decision_note)) : ''}
          ${gDead && p.status === 'applied' ? r('مهلة التظلم', `حتى <span class="num">${esc(gDead)}</span> (30 يوماً عدا العطل الرسمية)`) : ''}</tbody></table></div>
          ${p.status === 'applied' && isDismiss(p.action) ? `<div class="note" style="margin-top:10px">${p.action === 'a80' ? 'الفصل وفق المادة 80 دون مكافأة: تأكد من توافر شروط المادة وإنذار العامل كتابةً في حالات الغياب.' : 'الفصل مع المكافأة.'} يُسجَّل تاريخ نهاية الخدمة من بيانات الموظف وتُحسب المستحقات من «مكافأة نهاية الخدمة».</div>` : ''}`}</div>
    ${p.griev_on ? `<div class="card"><h2>التظلم (م72)</h2><div class="tw"><table><tbody>${r('تاريخ التظلم', fdate(p.griev_on))}${r('الأسباب', esc(p.griev_text))}
        ${p.griev_result ? r('النتيجة', p.griev_result === 'overturned' ? 'قُبل التظلم وأُلغي الجزاء' : 'رُفض التظلم') + r('تاريخ البت', fdate(p.griev_on_decided)) + r('القرار', esc(p.griev_note)) : r('آخر موعد للبت', `<span class="num">${addDays(p.griev_on, 15)}</span> (15 يوماً)`)}</tbody></table></div>
        ${!p.griev_result && hr ? `<div class="fg" style="margin-top:10px">${field('قرار التظلم', '<textarea id="gnote" rows="2"></textarea>', 'wide')}<div class="wide row"><button class="btn pri" id="gup">رفض التظلم</button><button class="btn" id="gov">قبول التظلم وإلغاء الجزاء</button></div></div>
          <p class="muted small">إذا رُفض التظلم أو لم يُبت فيه خلال 15 يوماً، فللعامل الاعتراض أمام المحاكم العمالية خلال 30 يوماً.</p>` : ''}</div>` : ''}
    ${ded.length ? `<div class="card"><h2>الحسم من الراتب</h2>${tbl([{ t: 'المسير', h: d => { const x = runs.find(z => z.id === d.run_id); return x ? x.month + '/' + x.year + ' ' + badge(x.status) : ''; } }, { t: 'المبلغ', r: 1, h: d => money(d.amount) }], ded)}</div>` : ''}`;
  const doc = (title, body) => { const d = document.createElement('div'); d.innerHTML = `<h2 style="text-align:center;margin:0 0 6mm">${esc(title)}</h2>${body}`; printBlock(d, title); };
  const who = `<p>إلى: <b>${esc(e.full_name || '')}</b> — الرقم الوظيفي <span class="num">${esc(e.emp_no || '')}</span>${e.job_title ? ' — ' + esc(e.job_title) : ''}</p>`;
  const sig = l => `<div class="row" style="justify-content:space-between;margin-top:14mm">${l.map(t => `<div style="min-width:60mm"><div>${esc(t)}:</div><div style="border-bottom:1px dotted #777;height:9mm"></div></div>`).join('')}</div>`;
  $('#prn', page).onclick = () => doc('إشعار بمخالفة واستدعاء للتحقيق', `${who}<p>نُسب إليك ارتكاب المخالفة الآتية: <b>${esc(v.title || '')}</b>، بتاريخ <span class="num">${esc(p.occurred_on)}</span>، وقد اكتُشفت بتاريخ <span class="num">${esc(p.discovered_on)}</span>.</p>
    ${p.description ? `<p>الوصف: ${esc(p.description)}</p>` : ''}<p>وعليه نأمل منك الرد كتابياً وحضور التحقيق لسماع أقوالك وتحقيق دفاعك، وفقاً للمادة 71 من نظام العمل.</p>${sig(['الموارد البشرية', 'استلام العامل والتاريخ'])}`);
  if ($('#prm', page)) $('#prm', page).onclick = () => doc('محضر تحقيق', `${who}<p>المخالفة المنسوبة: <b>${esc(v.title || '')}</b> بتاريخ <span class="num">${esc(p.occurred_on)}</span>.</p><p>تاريخ التحقيق: <span class="num">${esc(p.inv_on)}</span> — ${esc(INV_MODE[p.inv_mode])}</p>
    ${p.emp_defense ? `<p>رد العامل الكتابي: ${esc(p.emp_defense)}</p>` : ''}<p style="white-space:pre-wrap">${esc(p.inv_text || '')}</p>${sig(['المحقق', 'العامل'])}`);
  if ($('#prd', page)) $('#prd', page).onclick = () => doc('قرار توقيع جزاء تأديبي', `${who}<p>بعد إبلاغك كتابةً بالمخالفة المنسوبة إليك (${esc(v.title || '')}) بتاريخ <span class="num">${esc(p.occurred_on)}</span>، والتحقيق معك بتاريخ <span class="num">${esc(p.inv_on || '')}</span> وسماع دفاعك، وثبوت المخالفة، تقرر توقيع الجزاء الآتي وفق جدول المخالفات والجزاءات:</p>
    <p><b>${esc(penTxt)}</b>${v.extra ? '، ' + esc(PEN_EXTRA[v.extra]) : ''}.</p>${n0(p.fine) ? '<p>تُحسم الغرامة من أجرك بما لا يزيد على أجر خمسة أيام في الشهر (م70).</p>' : ''}

/* ===== letter templates, rendered on an A4 sheet (210 × 297 mm). The sheet is always in the language chosen for the
   letter (data-nt keeps the UI translator away), so this file is skipped by i18n/extract.py. ===== */
function hijriOf(d, en) {
  try { return new Intl.DateTimeFormat(en ? 'en-GB-u-ca-islamic-umalqura' : 'ar-SA-u-ca-islamic-umalqura-nu-latn', { day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(String(d).slice(0, 10) + 'T12:00:00')); } catch (e) { return ''; }
}
const gregOf = (d, en) => { const s = String(d || '').slice(0, 10); if (!s) return '—'; return en ? new Date(s + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) : s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) + 'م'; };
// service length between two dates, inclusive of both ends
function servicePeriod(a, b) {
  const s = new Date(String(a).slice(0, 10) + 'T12:00:00'), e = new Date(String(b).slice(0, 10) + 'T12:00:00'); e.setDate(e.getDate() + 1);
  let y = e.getFullYear() - s.getFullYear(), m = e.getMonth() - s.getMonth(), d = e.getDate() - s.getDate();
  if (d < 0) { m--; d += new Date(e.getFullYear(), e.getMonth(), 0).getDate(); }
  if (m < 0) { y--; m += 12; }
  return { y, m, d };
}
function periodTxt(p, en) {
  if (en) return [[p.y, 'year'], [p.m, 'month'], [p.d, 'day']].filter(x => x[0]).map(([n, w]) => n + ' ' + w + (n === 1 ? '' : 's')).join(', ') || '0 days';
  const u = (n, one, two, few, many) => n === 1 ? one : n === 2 ? two : n <= 10 ? n + ' ' + few : n + ' ' + many;
  return [p.y && u(p.y, 'سنة', 'سنتان', 'سنوات', 'سنة'), p.m && u(p.m, 'شهر', 'شهران', 'أشهر', 'شهراً'), p.d && u(p.d, 'يوم', 'يومان', 'أيام', 'يوماً')].filter(Boolean).join(' و') || '0';
}

/* company logo: resize in the browser (≤ 800×300) and keep it as a small raster data URL */
async function imgToLogo(file) {
  const url = URL.createObjectURL(file);
  try {
    const im = new Image();
    await new Promise((ok, no) => { im.onload = ok; im.onerror = () => no(new Error('تعذّر قراءة الصورة')); im.src = url; });
    let w = im.naturalWidth || 600, h = im.naturalHeight || 240; const k = Math.min(1, 800 / w, 300 / h); w = Math.max(1, Math.round(w * k)); h = Math.max(1, Math.round(h * k));
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h; const g = cv.getContext('2d'); g.drawImage(im, 0, 0, w, h);
    let d = cv.toDataURL('image/png');
    if (d.length > 190000) { const x = cv.toDataURL('image/webp', 0.9); if (x.startsWith('data:image/webp')) d = x; }
    if (d.length > 190000) { g.globalCompositeOperation = 'destination-over'; g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); d = cv.toDataURL('image/jpeg', 0.85); }
    if (d.length > 190000) throw new Error('الصورة كبيرة جداً');
    return d;
  } finally { URL.revokeObjectURL(url); }
}

// small inline SVG bar chart (no library): bars = [{ label, values: [..] }], series = [{ name, color }]
function barChart(bars, series, { h = 160, fmt = v => String(v) } = {}) {
  const max = Math.max(1, ...bars.flatMap(b => b.values.map(n0)));
  const W = 640, pad = 22, gw = (W - pad) / Math.max(1, bars.length), bw = Math.max(4, (gw - 8) / series.length);
  const rects = bars.map((b, i) => b.values.map((v, k) => { const bh = Math.round((n0(v) / max) * (h - 34)); const x = pad + i * gw + 4 + k * bw, y = h - 18 - bh;
    return `<rect x="${x.toFixed(1)}" y="${y}" width="${(bw - 2).toFixed(1)}" height="${bh}" rx="2" fill="${series[k].color}"><title>${esc(b.label)} — ${esc(tr(series[k].name))}: ${esc(fmt(v))}</title></rect>`; }).join('')
    + `<text x="${(pad + i * gw + gw / 2).toFixed(1)}" y="${h - 4}" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(b.label)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${h}" class="chart" role="img" style="width:100%;height:auto;direction:ltr">${rects}</svg>
    <div class="row small" style="gap:12px">${series.map(s => `<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${s.color}"></span> ${esc(tr(s.name))}</span>`).join('')}</div>`;
}
const hbars = (rows, fmt = v => String(v)) => { const max = Math.max(1, ...rows.map(r => n0(r.v)));
  return rows.map(r => `<div class="row small" style="gap:8px;margin:4px 0;align-items:center"><span style="min-width:120px">${esc(r.label)}</span>
    <span style="flex:1;background:var(--soft);border-radius:4px;height:12px;position:relative"><span style="position:absolute;inset:0;inset-inline-end:auto;width:${(n0(r.v) / max * 100).toFixed(1)}%;background:var(--accent);border-radius:4px"></span></span>
    <b class="num" style="min-width:40px;text-align:end">${esc(fmt(r.v))}</b></div>`).join(''); };

  if (k === 'lastm') { const ly = m === 1 ? y - 1 : y, lm = m === 1 ? 12 : m - 1; return [`${ly}-${p2(lm)}-01`, anEnd(ly, lm)]; }
  if (k === 'q') return [`${y}-${p2(q)}-01`, anEnd(y, q + 2)];

      rows.forEach((r, i) => { const yy = y + 56 + i * 30, w = Math.max(1, n0(r.v) / max * bw);

const waitTxt = ts => { if (!ts) return ''; const h = Math.max(0, (Date.now() - new Date(ts)) / 36e5);

const slaLate = r => { const d = S.company && S.company.request_sla_days; return !!d && r.status === 'pending' && (Date.now() - new Date(r.step_at)) / 864e5 > d; };
const TT_ST = { approved: 'بانتظار الصرف', issued: 'صُرفت', cancelled: 'ملغاة' };
const ttSt = t => t.status === 'cancelled' ? 'ملغاة' : t.mode === 'cash' ? (t.status === 'issued' ? 'صُرف البدل' : 'بانتظار صرف البدل من المالية') : t.status === 'issued' ? 'سُلّمت التذكرة' : 'بانتظار إرفاق التذكرة من الموارد البشرية';
const ttCls = t => t.status === 'issued' ? 'ok' : t.status === 'cancelled' ? '' : 'wait';
const tfBtns = fl => (fl || []).map(f => `<button type="button" class="btn sm" data-tfile="${f.id}">${f.mime === 'application/pdf' ? 'PDF' : esc(tr('صورة'))} — ${esc(f.name)}</button>`).join(' ');
async function openTravelFile(id) {
  const w = window.open('', '_blank');
  try { const [a] = await db.get('travel_files', { id: 'eq.' + id, select: 'file_name,mime,data' }); if (!a) throw new Error(tr('المرفق غير موجود'));
    const bin = atob(a.data), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([u], { type: a.mime })); if (w) w.location = url; else location.href = url;
  } catch (er) { if (w) w.close(); toast(er.message); }
}
const bindTravelFiles = root => $$('[data-tfile]', root).forEach(b => b.onclick = () => openTravelFile(b.dataset.tfile));
const VZ_ST = { requested: 'بانتظار الإصدار', issued: 'صدرت', returned: 'عاد', not_returned: 'لم يعد', cancelled: 'ملغاة' };
const VZ_T = { single: 'خروج وعودة مفردة', multiple: 'خروج وعودة متعددة' };
const TM = { ticket: 'تذكرة تحجزها المنشأة', cash: 'بدل نقدي' };
const fdt = ts => ts ? `<span class="num">${esc(String(ts).slice(0, 16).replace('T', ' '))}</span>` : '';

function journeyHtml(r, tl, acts) {
  if (!tl) return `<p class="small muted">${esc(tr('مسار الاعتماد'))}: ${r.route.map(s => esc(tr(STEP[s]))).join(' ← ')}</p>`;
  const ic = { done: ['✓', 'ok'], current: ['◀', 'info'], rejected: ['✗', 'bad'], cancelled: ['—', 'muted'], skipped: ['○', 'muted'], waiting: ['○', 'muted'] };
  const nm = s => (LANG === 'en' && s.by_en) || s.by;
  const rows = [`<li class="jr"><span class="jd ok">●</span><div><b>${esc(tr('أُرسل الطلب'))}</b> ${fdt(tl.submitted_at)}</div></li>`]
    .concat(tl.steps.map(s => { const [i, c] = ic[s.state] || ic.waiting;
      return `<li class="jr ${s.state}"><span class="jd ${c}">${i}</span><div><b>${esc(tr(STEP[s.step] || s.step))}</b>
        ${s.state === 'done' ? ` — ${esc(tr('اعتمده'))} ${esc(nm(s) || '')} ${fdt(s.at)}` : s.state === 'rejected' ? ` — <span class="bad">${esc(tr('رفضه'))} ${esc(nm(s) || '')}</span> ${fdt(s.at)}`
        : s.state === 'current' ? ` — <span class="${s.overdue ? 'bad' : 'muted'}">${esc(tr('بانتظاره'))} ${esc(waitTxt(s.since))}${s.overdue ? ' · ' + esc(tr('تجاوز المهلة')) + ' (' + tl.sla_days + ' ' + esc(tr('يوم')) + ')' : ''}</span>`
        : s.state === 'waiting' ? ` <span class="muted small">${esc(tr('لم يصل بعد'))}</span>` : ''}
        ${s.note ? `<div class="small">${esc(s.note)}</div>` : ''}</div></li>`; }))
    .concat(r.status === 'approved' && tl.decided_at ? [`<li class="jr"><span class="jd ok">★</span><div><b>${esc(tr('اعتُمد الطلب نهائياً'))}</b> ${fdt(tl.decided_at)}</div></li>`] : [])
    .concat(r.status === 'cancelled' ? [`<li class="jr"><span class="jd muted">—</span><div><b>${esc(tr('ألغاه الموظف'))}</b> ${fdt(tl.decided_at)}</div></li>`] : [])
    .concat((acts || []).filter(a => a.action === 'attached').map(a => `<li class="jr"><span class="jd muted">+</span><div>${esc(tr('أُرفق مستند'))} ${fdt(a.at)}</div></li>`));
  return `<div class="card" style="margin:10px 0;padding:10px 12px"><b class="small">${esc(tr('مسار الطلب'))}</b><ul class="journey">${rows.join('')}</ul></div>`;
}
function travelBox(r, tl) {
  const p = r.payload || {}, t = tl && tl.ticket, v = tl && tl.visa;
  if (!t && !v && !p.ticket && !p.visa) return '';
  const tk = t ? `${esc(tr(TM[t.mode]))} · ${esc(tr('المسافرون'))} <span class="num">${t.persons}</span> · ${badgeT(ttSt(t), ttCls(t))}${t.mode === 'cash' && t.amount != null ? ' · <span class="num">' + money(t.amount) + '</span>' : ''}${t.ref ? ' · ' + esc(tr('رقم الحجز')) + ' <span class="num">' + esc(t.ref) + '</span>' : ''}${(t.files || []).length ? '<div class="row" style="margin-top:6px">' + tfBtns(t.files) + '</div>' : ''}`
    : p.ticket ? `${esc(tr(TM[p.ticket.mode]))} · ${esc(tr('المسافرون'))} <span class="num">${p.ticket.persons}</span>` : '';
  const vz = v ? `${esc(tr(VZ_T[v.visa_type]))} · ${badgeT(v.status === 'requested' ? 'بانتظار إرفاق التأشيرة من الموارد البشرية' : VZ_ST[v.status], v.status === 'returned' ? 'ok' : v.status === 'not_returned' ? 'bad' : v.status === 'cancelled' ? '' : v.status === 'issued' ? 'ok' : 'wait')}${v.visa_no ? ' · ' + esc(tr('رقم التأشيرة')) + ' <span class="num">' + esc(v.visa_no) + '</span>' : ''}${v.expires_on ? ' · ' + esc(tr('آخر موعد للعودة')) + ' ' + fdate(v.expires_on) : ''}${v.returned_on ? ' · ' + esc(tr('عاد في')) + ' ' + fdate(v.returned_on) : ''}${(v.files || []).length ? '<div class="row" style="margin-top:6px">' + tfBtns(v.files) + '</div>' : ''}`
    : p.visa ? esc(tr(VZ_T[p.visa.type])) : '';
  return `<div class="card" style="margin:10px 0;padding:10px 12px"><b class="small">${esc(tr('السفر'))}</b>${tk ? `<div class="small" style="margin-top:4px">${esc(tr('التذكرة'))}: ${tk}</div>` : ''}${vz ? `<div class="small" style="margin-top:4px">${esc(tr('التأشيرة'))}: ${vz}</div>` : ''}</div>`;
}
const badgeT = (t, c) => `<span class="badge ${c || ''}">${esc(tr(t))}</span>`;

async function paymentForm({ dir, party, doc, amount }) {
  const D = dir === 'in' ? DOCS.sales : DOCS.purchases;
  const [parties, cash, open] = await Promise.all([db.get('parties', Object.assign(C(), { kind: 'eq.' + D.party, order: 'name' })), cashAccounts(), db.get(D.table, Object.assign(C(), { status: 'eq.posted', order: 'date', select: 'id,no,party_id,total,date' }))]);
  const paid = await paidMap(D, open.map(o => o.id));
  const openDocs = open.filter(o => n0(o.total) - n0(paid[o.id]) > 0.001);
  if (!parties.length) return toast(dir === 'in' ? 'أضف عميلاً أولاً' : 'أضف مورداً أولاً');
  const d = modal(dir === 'in' ? 'سند قبض' : 'سند صرف', `<div class="fg">${field(dir === 'in' ? 'العميل' : 'المورد', `<select name="party" id="pp">${parties.map(p => opt(p.id, p.name, party)).join('')}</select>`)}
     ${field('مقابل فاتورة', `<select name="doc" id="pdoc"></select>`)}${field('المبلغ', inp('amount', amount || '', 'type="number" step="0.01" min="0.01" id="pam"'))}${field(dir === 'in' ? 'إلى حساب' : 'من حساب', `<select name="acc">${cash.map(a => opt(a.code, a.name, '1120')).join('')}</select>`)}
     ${field('التاريخ', `<input type="date" name="date" value="${today()}" max="${today()}">`)}${field('ملاحظات', inp('note'))}</div>`, {
    ok: 'حفظ السند', onOk: async f => { if (!(+f.amount > 0)) throw new Error('أدخل مبلغاً أكبر من صفر');
      await db.rpc('record_payment', { p_company: S.cid, p_doc: { direction: dir, party: f.party, amount: +f.amount, account: f.acc, date: f.date, note: blank(f.note), [D.payKey]: f.doc || '' } }); toast('حُفظ السند'); route(); }
  });
  const fill = () => { const p = $('#pp', d).value; $('#pdoc', d).innerHTML = '<option value="">— دفعة على الحساب —</option>' + openDocs.filter(o => o.party_id === p).map(o => opt(o.id, o.no + ' — متبقي ' + money(n0(o.total) - n0(paid[o.id])), doc)).join(''); };
  $('#pp', d).onchange = () => { doc = null; fill(); }; fill();
  $('#pdoc', d).onchange = e => { const o = openDocs.find(x => x.id === e.target.value); if (o) $('#pam', d).value = r2(n0(o.total) - n0(paid[o.id])); };
}

    const d = modal('قيد يدوي', `<div class="fg">${field('التاريخ', `<input type="date" name="date" value="${today()}">`)}${field('البيان', inp('memo'))}</div><div style="height:10px"></div><div class="tw"><table class="lines"><thead><tr><th>الحساب</th><th>مدين</th><th>دائن</th></tr></thead><tbody id="jl">${row()}${row()}</tbody><tfoot><tr><td>الفرق</td><td colspan="2" class="num" id="jd">0.00</td></tr></tfoot></table></div><button type="button" class="btn sm" id="ja" style="margin-top:8px">+ سطر</button>`, {
      wide: true, ok: 'ترحيل', onOk: async f => {

  if (r === 'ar' || r === 'ap') { const rows = await db.rpc('aging', { p_company: S.cid, p_kind: r === 'ar' ? 'sales' : 'purchase', p_as_of: to });
    rb.innerHTML = tbl([{ t: r === 'ar' ? 'العميل' : 'المورد', k: 'party' }, { t: 'غير مستحق', r: 1, h: x => money(x.not_due) }, { t: '1–30', r: 1, h: x => money(x.d1_30) }, { t: '31–60', r: 1, h: x => money(x.d31_60) }, { t: '61–90', r: 1, h: x => money(x.d61_90) }, { t: '+90', r: 1, h: x => money(x.d90_plus) }, { t: 'دفعات غير مخصصة', r: 1, h: x => money(x.unallocated) }, { t: 'الصافي', r: 1, h: x => '<b>' + money(x.net) + '</b>' }], rows, { empty: 'لا توجد أرصدة مفتوحة' }); }
  if (r === 'ledger') { const code = q.get('code') || '1120'; const rows = await db.rpc('account_ledger', { p_company: S.cid, p_code: code, p_from: from, p_to: to });
    rb.innerHTML = tbl([{ t: 'التاريخ', h: x => fdate(x.date) }, { t: 'القيد', h: x => `<span class="num">${esc(x.no || '')}</span>` }, { t: 'البيان', k: 'memo' }, { t: 'مدين', r: 1, h: x => n0(x.debit) ? money(x.debit) : '' }, { t: 'دائن', r: 1, h: x => n0(x.credit) ? money(x.credit) : '' }, { t: 'الرصيد', r: 1, h: x => money(x.balance) }], rows); }
};

'use strict';
/* ===== sales cycle: quotations → sales orders → delivery notes → tax invoices ===== */
const SK = {
  quote: { h: '#/quotes', t: 'عروض الأسعار', one: 'عرض سعر', newT: 'عرض سعر جديد' },
  order: { h: '#/orders', t: 'أوامر البيع', one: 'أمر بيع', newT: 'أمر بيع جديد' },
};
const soExpired = o => o.kind === 'quote' && o.status === 'open' && o.valid_until < today();
const soBadge = o => {
  if (soExpired(o)) return '<span class="badge bad">منتهي</span>';
  const m = { open: [o.kind === 'quote' ? 'مفتوح' : 'قيد التنفيذ', 'wait'], accepted: ['مقبول', 'ok'], rejected: ['مرفوض', 'bad'], converted: ['حُوّل إلى أمر بيع', 'ok'],
    closed: [o.reason ? 'مغلق' : 'مكتمل', o.reason ? '' : 'ok'], cancelled: ['ملغى', ''] }[o.status] || [o.status, ''];
  return `<span class="badge ${m[1]}">${esc(m[0])}</span>`;
};
const soNet = (price, disc) => r2(n0(price) * (1 - n0(disc) / 100));
const qtyTxt = v => String(+n0(v).toFixed(3));
async function soLookups() {
  const [parties, items] = await Promise.all([can('sales') ? db.get('parties', Object.assign(C(), { kind: 'eq.customer', order: 'name' })) : [], db.get('items', Object.assign(C(), { order: 'code' }))]);
  const pm = {}, im = {}; parties.forEach(p => pm[p.id] = p); items.forEach(i => im[i.id] = i); return { parties, items, pm, im };
}

/* ----- list ----- */
function soList(kind) {
  return async (page, arg) => {
    const K = SK[kind];
    if (kind === 'quote' && !can('sales')) { page.innerHTML = '<div class="err">غير مصرح</div>'; return; }
    if (arg === 'new') return soForm(page, kind);
    if (arg && arg.endsWith('/edit')) return soForm(page, kind, arg.split('/')[0]);
    if (arg) return soView(page, kind, arg);
    const [docs, L] = await Promise.all([db.get('sales_orders', Object.assign(C(), { kind: 'eq.' + kind, order: 'date.desc,no.desc', limit: 300 })), soLookups()]);
    let prog = {};
    if (kind === 'order' && docs.length) (await db.get('sales_order_lines', { order_id: 'in.(' + docs.map(d => d.id).join(',') + ')', select: 'order_id,qty,delivered,invoiced' }))
      .forEach(l => { const p = prog[l.order_id] = prog[l.order_id] || { q: 0, d: 0, i: 0 }; p.q += n0(l.qty); p.d += n0(l.delivered); p.i += n0(l.invoiced); });
    const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '—';
    page.innerHTML = `<div class="head"><div><h1>${K.t}</h1><div class="muted small">${kind === 'quote' ? 'العرض يُرسل للعميل، وعند قبوله يتحول إلى أمر بيع بضغطة' : 'من الأمر تُصدر إشعارات التسليم ثم الفاتورة الضريبية، كاملة أو على دفعات'}</div></div>${can('sales') ? `<a class="btn pri" href="${K.h}/new">${K.newT}</a>` : ''}</div>
      ${tbl([{ t: 'الرقم', h: d => `<span class="num">${esc(d.no)}</span>` }, { t: 'التاريخ', h: d => fdate(d.date) }, { t: 'العميل', h: d => esc((L.pm[d.party_id] || {}).name || '—') },
        ...(kind === 'quote' ? [{ t: 'صالح حتى', h: d => fdate(d.valid_until) }] : [{ t: 'التسليم', h: d => pct((prog[d.id] || {}).d, (prog[d.id] || {}).q) }, { t: 'الفوترة', h: d => pct((prog[d.id] || {}).i, (prog[d.id] || {}).q) }]),
        { t: 'الإجمالي', r: 1, h: d => money(d.total) }, { t: 'الحالة', h: soBadge }], docs, { empty: kind === 'quote' ? 'لا توجد عروض أسعار' : 'لا توجد أوامر بيع', onRow: true })}`;
    bindRows(page, docs, d => location.hash = `${K.h}/${d.id}`);
  };
}
VIEWS['#/quotes'] = soList('quote'); VIEWS['#/orders'] = soList('order');

/* ----- create / edit ----- */
async function soForm(page, kind, id) {
  const K = SK[kind];
  if (!can('sales')) { page.innerHTML = '<div class="err">غير مصرح</div>'; return; }
  const L = await soLookups();
  if (!L.parties.length) { page.innerHTML = '<div class="note">أضف عميلاً أولاً. <a href="#/parties/customer">العملاء</a></div>'; return; }
  let doc = null, lines = [{}];
  if (id) {
    [[doc]] = await Promise.all([db.get('sales_orders', { id: 'eq.' + id })]);
    if (!doc) throw new Error('المستند غير موجود');
    lines = (await db.get('sales_order_lines', { order_id: 'eq.' + id, order: 'id' })).map(l => ({ item: l.item_id, qty: +l.qty, price: +l.unit_price, disc: +l.disc_pct, vat: +l.vat_rate, desc: l.description || '' }));
  }
  const back = id ? `${K.h}/${id}` : K.h;
  page.innerHTML = `<div class="head"><div><a href="${back}" class="small">← ${K.t}</a><h1>${id ? 'تعديل ' + K.one + ' <span class="num">' + esc(doc.no) + '</span>' : K.newT}</h1></div></div><form id="sf" class="card" novalidate>
    <div class="fg">${field('العميل', `<select name="party">${L.parties.map(p => opt(p.id, p.name, doc && doc.party_id)).join('')}</select>`)}${field('التاريخ', `<input type="date" name="date" value="${doc ? doc.date : today()}" max="${today()}">`)}
      ${kind === 'quote' ? field('صالح حتى', `<input type="date" name="valid_until" value="${doc ? doc.valid_until : new Date(Date.now() + 14 * 864e5).toISOString().slice(0, 10)}">`) : ''}
      ${field('ملاحظات', inp('note', doc && doc.note), 'wide')}${field('الشروط والأحكام (تظهر في المطبوع)', `<textarea name="terms" rows="2">${esc(doc && doc.terms || '')}</textarea>`, 'wide')}</div>
    <div style="height:14px"></div><div class="tw"><table class="lines"><thead><tr><th>الصنف</th><th>الوصف</th><th>الكمية</th><th>السعر</th><th>الخصم %</th><th>الضريبة</th><th class="r">المبلغ</th><th></th></tr></thead><tbody id="lb"></tbody>
    <tfoot><tr><td colspan="6">الإجمالي قبل الخصم</td><td class="r num" id="tg">0.00</td><td></td></tr><tr><td colspan="6">الخصم</td><td class="r num" id="td">0.00</td><td></td></tr><tr><td colspan="6">الإجمالي قبل الضريبة</td><td class="r num" id="ts">0.00</td><td></td></tr><tr><td colspan="6">ضريبة القيمة المضافة</td><td class="r num" id="tv">0.00</td><td></td></tr><tr><td colspan="6">الإجمالي</td><td class="r num" id="tt">0.00</td><td></td></tr></tfoot></table></div>
    <div class="row" style="margin-top:10px"><button type="button" class="btn sm" id="al">+ بند</button></div><div id="serr"></div>
    <div class="row" style="margin-top:14px"><button class="btn pri" id="ss">حفظ</button><a class="btn" href="${back}">إلغاء</a></div></form>`;
  const itemOpts = L.items.map(i => opt(i.id, i.code + ' — ' + i.name)).join('');
  const draw = () => {
    $('#lb', page).innerHTML = lines.map((l, i) => `<tr data-i="${i}"><td style="min-width:200px"><select data-f="item"><option value="">—</option>${itemOpts}</select></td><td><input data-f="desc" value="${esc(l.desc || '')}" style="min-width:140px"></td>
      <td><input data-f="qty" type="number" step="0.001" min="0" value="${esc(l.qty == null ? 1 : l.qty)}" style="width:80px"></td><td><input data-f="price" type="number" step="0.01" min="0" value="${esc(l.price == null ? '' : l.price)}" style="width:110px"></td>
      <td><input data-f="disc" type="number" step="0.01" min="0" max="100" value="${esc(l.disc || 0)}" style="width:75px"></td><td><select data-f="vat" style="width:80px">${opt(15, '15%', l.vat == null ? 15 : l.vat)}${opt(0, '0%', l.vat)}</select></td>
      <td class="r num" data-amt></td><td><button type="button" class="btn sm" data-rm aria-label="حذف البند">×</button></td></tr>`).join('');
    $$('tr', $('#lb', page)).forEach(tr => { $('[data-f=item]', tr).value = lines[+tr.dataset.i].item || ''; });
    calc();
  };
  const calc = () => { let g = 0, s = 0, v = 0; $$('tr', $('#lb', page)).forEach(tr => { const l = lines[+tr.dataset.i], q = n0(l.qty == null ? 1 : l.qty), a = r2(q * soNet(l.price, l.disc)), t = r2(a * n0(l.vat == null ? 15 : l.vat) / 100);
    g += r2(q * n0(l.price)); s += a; v += t; $('[data-amt]', tr).textContent = money(a); });
    $('#tg', page).textContent = money(g); $('#td', page).textContent = money(g - s); $('#ts', page).textContent = money(s); $('#tv', page).textContent = money(v); $('#tt', page).textContent = money(s + v); };
  $('#lb', page).addEventListener('input', e => { const tr = e.target.closest('tr'); if (!tr) return; const l = lines[+tr.dataset.i], f = e.target.dataset.f; l[f] = e.target.value;
    if (f === 'item') { const it = L.im[l.item]; if (it && !l.price) { l.price = it.sale_price; $('[data-f=price]', tr).value = it.sale_price; } } calc(); });
  $('#lb', page).addEventListener('click', e => { if (e.target.matches('[data-rm]')) { lines.splice(+e.target.closest('tr').dataset.i, 1); if (!lines.length) lines.push({}); draw(); } });
  $('#al', page).onclick = () => { lines.push({}); draw(); };
  draw();
  $('#sf', page).onsubmit = async e => {
    e.preventDefault(); const f = formData(e.target);
    const ls = lines.filter(l => l.item).map(l => ({ item: l.item, qty: +(l.qty == null ? 1 : l.qty), price: +l.price, disc: +(l.disc || 0), vat: +(l.vat == null ? 15 : l.vat), desc: blank((l.desc || '').trim()) }));
    if (!ls.length) return showErr($('#serr', page), 'أضف بنداً واحداً على الأقل');
    if (ls.some(l => !(l.qty > 0) || !(l.price >= 0) || isNaN(l.price))) return showErr($('#serr', page), 'تحقق من الكميات والأسعار');
    if (ls.some(l => l.disc < 0 || l.disc > 100)) return showErr($('#serr', page), 'نسبة الخصم بين 0 و 100');
    const d = { kind, party: f.party, date: f.date, note: blank(f.note), terms: blank(f.terms), lines: ls }; if (id) d.id = id; if (kind === 'quote') d.valid_until = f.valid_until;
    try { await busy($('#ss', page), async () => { const nid = await db.rpc('sales_doc_save', { p_company: S.cid, p_doc: d }); toast('تم الحفظ'); location.hash = `${K.h}/${nid}`; }); } catch (er) { showErr($('#serr', page), er); }
  };
}

/* ----- detail ----- */
async function soView(page, kind, id) {
  const K = SK[kind];
  const [[doc], lines, L] = await Promise.all([db.get('sales_orders', { id: 'eq.' + id }), db.get('sales_order_lines', { order_id: 'eq.' + id, order: 'id' }), soLookups()]);
  if (!doc || doc.kind !== kind) throw new Error('المستند غير موجود');
  const party = L.pm[doc.party_id];
  const [linked, dns, invs] = await Promise.all([
    kind === 'quote' ? db.get('sales_orders', { quote_id: 'eq.' + id, select: 'id,no' }) : doc.quote_id && can('sales') ? db.get('sales_orders', { id: 'eq.' + doc.quote_id, select: 'id,no' }) : [],
    kind === 'order' ? db.get('delivery_notes', { order_id: 'eq.' + id, order: 'date,no' }) : [],
    kind === 'order' && can('sales') ? db.get('sales_invoices', { order_id: 'eq.' + id, order: 'date,no' }) : []]);
  const open = doc.status === 'open', touched = lines.some(l => n0(l.delivered) || n0(l.invoiced));
  const leftDel = lines.some(l => n0(l.qty) > n0(l.delivered)), leftInv = lines.some(l => n0(l.qty) > n0(l.invoiced));
  const btns = [];
  if (kind === 'quote' && can('sales')) {
    if (open) btns.push('<a class="btn" id="qed">تعديل</a>', '<button class="btn" id="qac">قبول العميل</button>', '<button class="btn" id="qrj">رفض</button>');
    if ((open || doc.status === 'accepted') && !soExpired(doc)) btns.push('<button class="btn pri" id="qcv">تحويل إلى أمر بيع</button>');
  }
  if (kind === 'order' && leftDel && (open || (doc.status === 'closed' && !doc.reason)) && (can('sales') || can('stock'))) btns.push('<button class="btn" id="odl">إشعار تسليم</button>');
  if (kind === 'order' && open) {
    if (leftInv && can('sales')) btns.push('<button class="btn pri" id="oin">إصدار فاتورة</button>');
    if (can('sales') && !touched) btns.push('<a class="btn" id="oed">تعديل</a>');
    if (can('sales')) btns.push('<button class="btn danger" id="ocn">' + (touched ? 'إغلاق الباقي' : 'إلغاء الأمر') + '</button>');
  }
  btns.push('<button class="btn" id="sprint">طباعة</button>');
  const nm = l => esc((L.im[l.item_id] || {}).name || '') + (l.description ? `<div class="small muted">${esc(l.description)}</div>` : '');
  page.innerHTML = `<div class="head"><div><a href="${K.h}" class="small">← ${K.t}</a><h1>${K.one} <span class="num">${esc(doc.no)}</span> ${soBadge(doc)}</h1>
      <div class="muted">${esc(party ? party.name : '')} · ${fdate(doc.date)}${kind === 'quote' ? ' · صالح حتى ' + fdate(doc.valid_until) : ''}${linked.length ? ` · ${kind === 'quote' ? 'أمر البيع' : 'من عرض السعر'} <a href="${kind === 'quote' ? '#/orders/' : '#/quotes/'}${linked[0].id}" class="num">${esc(linked[0].no)}</a>` : ''}</div></div>
      <div class="row">${btns.join('')}</div></div>
    <div class="card">${tbl([{ t: 'البند', h: nm }, { t: 'الكمية', r: 1, h: l => qtyTxt(l.qty) }, ...(kind === 'order' ? [{ t: 'المُسلَّم', r: 1, h: l => qtyTxt(l.delivered) }, { t: 'المُفوتر', r: 1, h: l => qtyTxt(l.invoiced) }] : []),
      { t: 'السعر', r: 1, h: l => money(l.unit_price) }, { t: 'الخصم', r: 1, h: l => n0(l.disc_pct) ? +l.disc_pct + '%' : '—' }, { t: 'الضريبة', r: 1, h: l => +l.vat_rate + '%' }, { t: 'المبلغ', r: 1, h: l => money(l.amount) }], lines,
      { foot: `<td colspan="${kind === 'order' ? 7 : 5}">${n0(doc.discount) ? 'الخصم ' + money(doc.discount) + ' · ' : ''}الإجمالي قبل الضريبة / الضريبة / الإجمالي</td><td class="r num">${money(doc.subtotal)} / ${money(doc.vat)} / <b>${money(doc.total)}</b></td>` })}
      ${doc.terms ? `<p class="small"><b>الشروط:</b> ${esc(doc.terms)}</p>` : ''}${doc.note ? `<p class="muted small">${esc(doc.note)}</p>` : ''}${doc.reason ? `<p class="small">السبب: ${esc(doc.reason)}</p>` : ''}</div>
    ${dns.length ? '<h2>إشعارات التسليم</h2>' + tbl([{ t: 'الرقم', h: n => `<span class="num">${esc(n.no)}</span>` }, { t: 'التاريخ', h: n => fdate(n.date) }, { t: 'المستلم', h: n => esc(n.received_by || '—') }, { t: 'الحالة', h: n => badge(n.status) }], dns, { onRow: true }) : ''}
    ${invs.length ? '<div style="height:12px"></div><h2>الفواتير</h2>' + tbl([{ t: 'الرقم', h: v => `<span class="num">${esc(v.no)}</span>` }, { t: 'التاريخ', h: v => fdate(v.date) }, { t: 'الإجمالي', r: 1, h: v => money(v.total) }, { t: 'الحالة', h: v => badge(v.status) }], invs, { onRow: true }) : ''}`;
  // the two lists share bindRows' data-row index, so bind each table separately

  const L = (ar, en) => `<div>${ar}</div><div class="iv-en" dir="ltr">${en}</div>`;

  const itm = l => { const it = im[l.item_id] || {}; return two(it.name || '', it.name_en || enOf(it.name || '')) + (l.description ? `<div class="small">${esc(l.description)}</div>` : ''); };

      <div class="ph-ids">${c.vat_no ? 'الرقم الضريبي VAT No. <span class="num">' + esc(c.vat_no) + '</span>' : ''}${c.cr_no ? ' · س.ت C.R. <span class="num">' + esc(c.cr_no) + '</span>' : ''}</div>${c.address ? `<div class="ph-ids">${esc(c.address)}</div>` : ''}</div></div>
      <div class="iv-title">${L(title[0], title[1])}</div></div>`;
  const meta = `<table class="iv-meta"><tbody>

      ${doc.status === 'void' || doc.status === 'cancelled' ? `<tr><td colspan="4"><b>${L('ملغى', 'VOID')}</b></td></tr>` : ''}</tbody></table>`;
  let body;
  if (dn) body = `<table class="iv-lines"><thead><tr><th>${L('الصنف', 'Item')}</th><th>${L('الوحدة', 'Unit')}</th><th class="r">${L('الكمية المسلّمة', 'Qty delivered')}</th></tr></thead>
      <tbody>${lines.map(l => `<tr><td>${itm(l)}</td><td>${esc((im[l.item_id] || {}).unit || '')}</td><td class="num r">${qtyTxt(l.qty)}</td></tr>`).join('')}</tbody></table>
    <table class="iv-meta"><tbody><tr><td>${L('اسم المستلم', 'Received by')}</td><td>${esc(doc.received_by || '')}</td><td>${L('التوقيع', 'Signature')}</td><td style="height:16mm"></td></tr>

const poBadge = o => { const m = { open: ['قيد التنفيذ', 'wait'], closed: [o.reason ? 'مغلق' : 'مكتمل', o.reason ? '' : 'ok'], cancelled: ['ملغى', ''] }[o.status] || [o.status, ''];
  return `<span class="badge ${m[1]}">${esc(m[0])}</span>`; };
async function poLookups() {
  const [parties, items, acc] = await Promise.all([can('purch') ? db.get('parties', Object.assign(C(), { kind: 'eq.supplier', order: 'name' })) : [], db.get('items', Object.assign(C(), { order: 'code' })), can('purch') ? accounts() : []]);
  const pm = {}, im = {}, am = {}; parties.forEach(p => pm[p.id] = p); items.forEach(i => im[i.id] = i); acc.forEach(a => am[a.code] = a);
  const expAcc = acc.filter(a => !a.is_header && (a.type === 'exp' || a.type === 'asset') && !['1110', '1120', '1200', '1300', '1400'].includes(a.code) && a.parent_code !== '1100');
  return { parties, items, pm, im, am, expAcc };
}

  const draw = () => {
    $('#lb', page).innerHTML = lines.map((l, i) => `<tr data-i="${i}"><td style="min-width:210px"><select data-f="what"><option value="">—</option>${opts}</select></td><td><input data-f="desc" value="${esc(l.desc || '')}" style="min-width:140px"></td>
      <td><input data-f="qty" type="number" step="0.001" min="0" value="${esc(l.qty == null ? 1 : l.qty)}" style="width:80px"></td><td><input data-f="price" type="number" step="0.01" min="0" value="${esc(l.price == null ? '' : l.price)}" style="width:110px"></td>
      <td><select data-f="vat" style="width:80px">${opt(15, '15%', l.vat == null ? 15 : l.vat)}${opt(0, '0%', l.vat)}</select></td><td class="r num" data-amt></td><td><button type="button" class="btn sm" data-rm aria-label="حذف البند">×</button></td></tr>`).join('');
    $$('tr', $('#lb', page)).forEach(tr => { $('[data-f=what]', tr).value = lines[+tr.dataset.i].what || ''; });
    calc();
  };
  const calc = () => { let s = 0, v = 0; $$('tr', $('#lb', page)).forEach(tr => { const l = lines[+tr.dataset.i], a = r2(n0(l.qty == null ? 1 : l.qty) * n0(l.price)), t = r2(a * n0(l.vat == null ? 15 : l.vat) / 100); s += a; v += t; $('[data-amt]', tr).textContent = money(a); });
    $('#ts', page).textContent = money(s); $('#tv', page).textContent = money(v); $('#tt', page).textContent = money(s + v); };
  $('#lb', page).addEventListener('input', e => { const tr = e.target.closest('tr'); if (!tr) return; lines[+tr.dataset.i][e.target.dataset.f] = e.target.value; calc(); });
  $('#lb', page).addEventListener('click', e => { if (e.target.matches('[data-rm]')) { lines.splice(+e.target.closest('tr').dataset.i, 1); if (!lines.length) lines.push({}); draw(); } });
  $('#al', page).onclick = () => { lines.push({}); draw(); };
  draw();
  $('#pf', page).onsubmit = async e => {
    e.preventDefault(); const f = formData(e.target);
    if (lines.some(l => !l.what && (l.desc || '').trim())) return showErr($('#perr', page), 'اختر لكل بند الصنف أو حساب المصروف');
    const ls = lines.filter(l => l.what).map(l => { const o = { qty: +(l.qty == null ? 1 : l.qty), price: +l.price, vat: +(l.vat == null ? 15 : l.vat), desc: blank((l.desc || '').trim()) }; if (l.what.startsWith('i:')) o.item = l.what.slice(2); else o.account = l.what.slice(2); return o; });
    if (!ls.length) return showErr($('#perr', page), 'أضف بنداً واحداً على الأقل');
    if (ls.some(l => !(l.qty > 0) || !(l.price >= 0) || isNaN(l.price))) return showErr($('#perr', page), 'تحقق من الكميات والأسعار');
    const d = { party: f.party, date: f.date, expected: blank(f.expected), note: blank(f.note), terms: blank(f.terms), lines: ls }; if (id) d.id = id; if (reqId) d.request = reqId;
    try { await busy($('#ps', page), async () => { const nid = await db.rpc('po_save', { p_company: S.cid, p_doc: d }); toast('تم الحفظ'); location.hash = '#/porders/' + nid; }); } catch (er) { showErr($('#perr', page), er); }
  };
}

async function poView(page, id) {
  const [[doc], lines, L] = await Promise.all([db.get('purchase_orders', { id: 'eq.' + id }), db.get('purchase_order_lines', { order_id: 'eq.' + id, order: 'id' }), poLookups()]);
  if (!doc) throw new Error('الأمر غير موجود');
  const party = L.pm[doc.party_id];
  const [grns, bills] = await Promise.all([db.get('goods_receipts', { order_id: 'eq.' + id, order: 'date,no' }), can('purch') ? db.get('purchase_bills', { order_id: 'eq.' + id, order: 'date,no' }) : []]);
  const open = doc.status === 'open', touched = lines.some(l => n0(l.received) || n0(l.billed));
  const leftRec = lines.some(l => l.item_id && n0(l.qty) > n0(l.received)), billable = lines.some(l => poBillCap(L, l) > 0);
  const btns = [];
  if (open && leftRec && (can('purch') || can('stock'))) btns.push('<button class="btn" id="prc">استلام بضاعة</button>');
  if (open && can('purch')) {
    if (billable) btns.push('<button class="btn pri" id="pbl">فاتورة المورد</button>');
    if (!touched) btns.push('<a class="btn" id="ped">تعديل</a>');
    btns.push('<button class="btn danger" id="pcn">' + (touched ? 'إغلاق الباقي' : 'إلغاء الأمر') + '</button>');
  }
  btns.push('<button class="btn" id="pprint">طباعة</button>');
  page.innerHTML = `<div class="head"><div><a href="#/porders" class="small">← أوامر الشراء</a><h1>أمر شراء <span class="num">${esc(doc.no)}</span> ${poBadge(doc)}</h1>
      <div class="muted">${esc(party ? party.name : '')} · ${fdate(doc.date)}${doc.expected_date ? ' · التوريد المتوقع ' + fdate(doc.expected_date) : ''}${doc.request_id && can('purch') ? ' · <a href="#/purchreq">من طلب شراء معتمد</a>' : ''}</div></div>
      <div class="row">${btns.join('')}</div></div>
    <div class="card">${tbl([{ t: 'البند', h: l => esc(poLineName(L, l)) + (l.description ? `<div class="small muted">${esc(l.description)}</div>` : '') }, { t: 'الكمية', r: 1, h: l => qtyTxt(l.qty) },
      { t: 'المُستلم', r: 1, h: l => l.item_id ? qtyTxt(l.received) : '—' }, { t: 'المُفوتر', r: 1, h: l => qtyTxt(l.billed) },
      { t: 'السعر', r: 1, h: l => money(l.unit_price) }, { t: 'الضريبة', r: 1, h: l => +l.vat_rate + '%' }, { t: 'المبلغ', r: 1, h: l => money(l.amount) }], lines,
      { foot: `<td colspan="6">الإجمالي قبل الضريبة / الضريبة / الإجمالي</td><td class="r num">${money(doc.subtotal)} / ${money(doc.vat)} / <b>${money(doc.total)}</b></td>` })}
      ${doc.terms ? `<p class="small"><b>الشروط:</b> ${esc(doc.terms)}</p>` : ''}${doc.note ? `<p class="muted small">${esc(doc.note)}</p>` : ''}${doc.reason ? `<p class="small">السبب: ${esc(doc.reason)}</p>` : ''}</div>
    ${grns.length ? '<h2>استلام البضاعة</h2><div id="tgr">' + tbl([{ t: 'الرقم', h: n => `<span class="num">${esc(n.no)}</span>` }, { t: 'التاريخ', h: n => fdate(n.date) }, { t: 'إشعار المورد', h: n => `<span class="num">${esc(n.supplier_doc || '—')}</span>` }, { t: 'الحالة', h: n => badge(n.status) }], grns, { onRow: true }) + '</div>' : ''}
    ${bills.length ? '<div style="height:12px"></div><h2>فواتير المورد</h2><div id="tbl">' + tbl([{ t: 'الرقم', h: v => `<span class="num">${esc(v.no)}</span>` }, { t: 'رقم المورد', h: v => `<span class="num">${esc(v.supplier_ref || '—')}</span>` }, { t: 'التاريخ', h: v => fdate(v.date) }, { t: 'الإجمالي', r: 1, h: v => money(v.total) }, { t: 'الحالة', h: v => badge(v.status) }], bills, { onRow: true }) + '</div>' : ''}`;
  if (grns.length) bindRows($('#tgr', page), grns, n => location.hash = '#/receipts/' + n.id);
  if (bills.length) bindRows($('#tbl', page), bills, v => location.hash = '#/purchases/' + v.id);
  const on = (s, fn) => { const b = $(s, page); if (b) b.onclick = fn; };
  on('#pprint', () => { const w = document.createElement('div'); w.innerHTML = poSheet({ kind: 'po', doc, lines, party, L }); printWith(w.firstElementChild, '@page{size:A4 portrait;margin:12mm}'); });
  on('#ped', () => location.hash = '#/porders/' + id + '/edit');
  on('#pcn', () => modal(touched ? 'إغلاق باقي الأمر' : 'إلغاء الأمر', field('السبب', '<textarea name="r" rows="2" required></textarea>') + (touched ? '<p class="muted small">يبقى ما استُلم وفُوتر كما هو، ويُغلق الباقي.</p>' : ''), {
    ok: touched ? 'إغلاق' : 'إلغاء الأمر', onOk: async f => { await db.rpc('po_cancel', { p_id: id, p_reason: f.r }); toast('تم'); route(); } }));
  const qtyRows = (key, max, hint) => `<div class="tw"><table class="lines"><thead><tr><th>البند</th><th>${esc(tr(hint))}</th><th>الكمية</th></tr></thead><tbody>${lines.filter(l => max(l) > 0).map(l => `<tr><td>${esc(poLineName(L, l))}</td><td class="num">${qtyTxt(max(l))}</td><td><input name="${key}_${l.id}" type="number" min="0" step="0.001" max="${max(l)}" value="${max(l)}" style="width:110px"></td></tr>`).join('')}</tbody></table></div><div style="height:10px"></div>`;
  const pick = (f, key) => lines.map(l => ({ line: l.id, qty: +(f[key + '_' + l.id] || 0) })).filter(x => x.qty > 0);
  on('#prc', () => modal('استلام بضاعة', qtyRows('r', l => l.item_id ? r2(n0(l.qty) - n0(l.received)) : 0, 'المتبقي') + `<div class="fg">${field('تاريخ الاستلام', `<input type="date" name="date" value="${today()}" max="${today()}">`)}${field('رقم إشعار تسليم المورد', inp('supplier_doc', '', 'dir="ltr"'))}${field('ملاحظات', inp('note'), 'wide')}</div><p class="muted small">تدخل الأصناف المخزنية المخزون بسعر الأمر فوراً، فتُباع قبل وصول فاتورة المورد.</p>`, {
    wide: true, ok: 'تسجيل الاستلام', onOk: async f => { const ls = pick(f, 'r'); if (!ls.length) throw new Error('أدخل كمية مستلمة لبند واحد على الأقل');
      const gid = await db.rpc('grn_post', { p_order: id, p_doc: { date: f.date, supplier_doc: blank(f.supplier_doc), note: blank(f.note), lines: ls } }); toast('سُجّل الاستلام'); location.hash = '#/receipts/' + gid; } }));
  on('#pbl', () => modal('فاتورة المورد من الأمر', qtyRows('b', l => poBillCap(L, l), 'القابل للفوترة') + `<div class="fg">${field('رقم فاتورة المورد', inp('ref', '', 'dir="ltr" required'))}${field('تاريخ الفاتورة', `<input type="date" name="date" value="${today()}" max="${today()}">`)}${field('تاريخ الاستحقاق', `<input type="date" name="due" value="${today()}">`)}</div>
      <p class="muted small">مطابقة ثلاثية: الأصناف المخزنية تُفوتر بقدر ما استُلم فقط، وبسعر الأمر.</p>`, {
    wide: true, ok: 'ترحيل الفاتورة', onOk: async f => { const ls = pick(f, 'b'); if (!ls.length) throw new Error('أدخل كمية لبند واحد على الأقل'); if (!(f.ref || '').trim()) throw new Error('اكتب رقم فاتورة المورد');
      const bid = await db.rpc('po_bill', { p_order: id, p_doc: { ref: f.ref.trim(), date: f.date, due: f.due || f.date, lines: ls } }); toast('رُحّلت الفاتورة'); location.hash = '#/purchases/' + bid; } }));
}

/* ----- goods receipts ----- */
VIEWS['#/receipts'] = async (page, arg) => {
  if (arg) return grnView(page, arg);
  const [rows, orders, L] = await Promise.all([db.get('goods_receipts', Object.assign(C(), { order: 'date.desc,no.desc', limit: 300 })), db.get('purchase_orders', Object.assign(C(), { select: 'id,no' })), poLookups()]);
  const om = {}; orders.forEach(o => om[o.id] = o.no);
  page.innerHTML = `<div class="head"><div><h1>استلام البضاعة</h1><div class="muted small">يُسجَّل من أمر الشراء عند وصول البضاعة</div></div><a class="btn" href="#/porders">أوامر الشراء</a></div>
    ${tbl([{ t: 'الرقم', h: n => `<span class="num">${esc(n.no)}</span>` }, { t: 'التاريخ', h: n => fdate(n.date) }, { t: 'أمر الشراء', h: n => `<span class="num">${esc(om[n.order_id] || '')}</span>` }, { t: 'المورد', h: n => esc((L.pm[n.party_id] || {}).name || '—') }, { t: 'إشعار المورد', h: n => `<span class="num">${esc(n.supplier_doc || '—')}</span>` }, { t: 'الحالة', h: n => badge(n.status) }],
      rows, { empty: 'لا يوجد استلام بضاعة', onRow: true })}`;
  bindRows(page, rows, n => location.hash = '#/receipts/' + n.id);
};
async function grnView(page, id) {
  const [[g], lines, L] = await Promise.all([db.get('goods_receipts', { id: 'eq.' + id }), db.get('goods_receipt_lines', { receipt_id: 'eq.' + id, order: 'id' }), poLookups()]);
  if (!g) throw new Error('الاستلام غير موجود');
  const [o] = await db.get('purchase_orders', { id: 'eq.' + g.order_id, select: 'id,no' });
  const party = L.pm[g.party_id];
  page.innerHTML = `<div class="head"><div><a href="#/receipts" class="small">← استلام البضاعة</a><h1>استلام بضاعة <span class="num">${esc(g.no)}</span> ${badge(g.status)}</h1>
      <div class="muted">${esc(party ? party.name : '')} · ${fdate(g.date)} · أمر الشراء <a href="#/porders/${g.order_id}" class="num">${esc(o ? o.no : '')}</a>${g.supplier_doc ? ' · إشعار المورد <span class="num">' + esc(g.supplier_doc) + '</span>' : ''}</div></div>
      <div class="row">${g.status === 'posted' && (can('purch') || can('stock')) ? '<button class="btn danger" id="gvd">إلغاء الاستلام</button>' : ''}<button class="btn" id="gprint">طباعة</button></div></div>
    <div class="card">${tbl([{ t: 'الصنف', h: l => esc(((L.im[l.item_id] || {}).code || '') + ' — ' + ((L.im[l.item_id] || {}).name || '')) }, { t: 'الوحدة', h: l => esc((L.im[l.item_id] || {}).unit || '—') }, { t: 'الكمية المستلمة', r: 1, h: l => qtyTxt(l.qty) }], lines)}
      ${g.note ? `<p class="muted small">${esc(g.note)}</p>` : ''}${g.void_reason ? `<p class="small">سبب الإلغاء: ${esc(g.void_reason)}</p>` : ''}</div>`;
  $('#gprint', page).onclick = () => { const w = document.createElement('div'); w.innerHTML = poSheet({ kind: 'grn', doc: g, lines, party, L, order: o }); printWith(w.firstElementChild, '@page{size:A4 portrait;margin:12mm}'); };
  if ($('#gvd', page)) $('#gvd', page).onclick = () => modal('إلغاء الاستلام', field('السبب', '<textarea name="r" rows="2" required></textarea>') + '<p class="muted small">تخرج الكميات من المخزون ويُعكس القيد وتعود للمتبقي في أمر الشراء. لا يُلغى استلام فُوتر أو صُرف منه.</p>', {
    ok: 'إلغاء الاستلام', onOk: async f => { await db.rpc('grn_void', { p_id: id, p_reason: f.r }); toast('أُلغي الاستلام'); route(); } });
}

/* ----- bilingual printouts: purchase order, goods received note ----- */
function poSheet({ kind, doc, lines, party, L, order }) {
  const c = S.company || {}, grn = kind === 'grn';
  const enOf = s => { const t = trTo(s); return t !== s ? t : ''; };
  const two = (ar, en) => `<div>${esc(ar)}</div>${en && en !== ar ? `<div class="iv-en" dir="ltr">${esc(en)}</div>` : ''}`;
  const B = (ar, en) => `<div>${ar}</div><div class="iv-en" dir="ltr">${en}</div>`;
  const title = grn ? ['سند استلام بضاعة', 'Goods Received Note'] : ['أمر شراء', 'Purchase Order'];
  const itm = l => { if (l.item_id) { const it = L.im[l.item_id] || {}; return two(it.name || '', it.name_en || enOf(it.name || '')) + (l.description ? `<div class="small">${esc(l.description)}</div>` : ''); }
    const a = L.am[l.account_code] || {}; return two(a.name || l.account_code, a.name_en || enOf(a.name || '')) + (l.description ? `<div class="small">${esc(l.description)}</div>` : ''); };
  const row = (ar, en, v) => `<tr><td>${B(esc(ar), esc(en))}</td><td class="num r">${v}</td></tr>`;
  const head = `<div class="iv-head"><div class="ph-brand">${c.logo ? `<img class="ph-logo" src="${esc(c.logo)}" alt="">` : ''}<div><div class="ph-co">${esc(c.name || '')}</div>${c.name_en ? `<div class="iv-en" dir="ltr"><b>${esc(c.name_en)}</b></div>` : ''}
      <div class="ph-ids">${c.vat_no ? 'الرقم الضريبي VAT No. <span class="num">' + esc(c.vat_no) + '</span>' : ''}${c.cr_no ? ' · س.ت C.R. <span class="num">' + esc(c.cr_no) + '</span>' : ''}</div>${c.address ? `<div class="ph-ids">${esc(c.address)}</div>` : ''}</div></div>
      <div class="iv-title">${B(title[0], title[1])}</div></div>`;
  const meta = `<table class="iv-meta"><tbody>
      <tr><td>${B('الرقم', 'No.')}</td><td class="num">${esc(doc.no)}</td><td>${B('التاريخ', 'Date')}</td><td class="num">${esc(fdate(doc.date))}</td></tr>
      <tr><td>${B('المورد', 'Supplier')}</td><td>${two(party ? party.name : '', party ? (party.name_en || enOf(party.name)) : '')}</td>${grn ? `<td>${B('أمر الشراء', 'Purchase order')}</td><td class="num">${esc(order ? order.no : '')}</td>` : `<td>${B('التوريد المتوقع', 'Expected delivery')}</td><td class="num">${esc(fdate(doc.expected_date))}</td>`}</tr>
      ${party && party.vat_no ? `<tr><td>${B('الرقم الضريبي للمورد', "Supplier's VAT No.")}</td><td class="num" colspan="3">${esc(party.vat_no)}</td></tr>` : ''}
      ${grn && doc.supplier_doc ? `<tr><td>${B('إشعار تسليم المورد', "Supplier's delivery note")}</td><td class="num" colspan="3">${esc(doc.supplier_doc)}</td></tr>` : ''}
      ${doc.status === 'void' || doc.status === 'cancelled' ? `<tr><td colspan="4"><b>${B('ملغى', 'VOID')}</b></td></tr>` : ''}</tbody></table>`;
  const body = grn ? `<table class="iv-lines"><thead><tr><th>${B('الصنف', 'Item')}</th><th>${B('الوحدة', 'Unit')}</th><th class="r">${B('الكمية المستلمة', 'Qty received')}</th></tr></thead>
      <tbody>${lines.map(l => `<tr><td>${itm(l)}</td><td>${esc((L.im[l.item_id] || {}).unit || '')}</td><td class="num r">${qtyTxt(l.qty)}</td></tr>`).join('')}</tbody></table>
    <table class="iv-meta"><tbody><tr><td>${B('استلمها', 'Received by')}</td><td></td><td>${B('التوقيع', 'Signature')}</td><td style="height:16mm"></td></tr>
      <tr><td>${B('سلّمها (المورد)', 'Delivered by (supplier)')}</td><td></td><td>${B('التاريخ', 'Date')}</td><td></td></tr></tbody></table>`
    : `<table class="iv-lines"><thead><tr><th>${B('البند', 'Item')}</th><th class="r">${B('الكمية', 'Qty')}</th><th class="r">${B('سعر الوحدة', 'Unit price')}</th><th class="r">${B('المبلغ قبل الضريبة', 'Taxable amount')}</th><th class="r">${B('نسبة الضريبة', 'VAT rate')}</th><th class="r">${B('الإجمالي شامل الضريبة', 'Total incl. VAT')}</th></tr></thead>
      <tbody>${lines.map(l => `<tr><td>${itm(l)}</td><td class="num r">${qtyTxt(l.qty)}</td><td class="num r">${money(l.unit_price)}</td><td class="num r">${money(l.amount)}</td><td class="num r">${n0(l.vat_rate)}%</td><td class="num r">${money(n0(l.amount) + n0(l.vat))}</td></tr>`).join('')}</tbody></table>
    <table class="iv-tot"><tbody>${row('الإجمالي قبل الضريبة', 'Total excl. VAT', money(doc.subtotal))}${row('ضريبة القيمة المضافة', 'VAT', money(doc.vat))}
      <tr class="iv-grand"><td>${B('الإجمالي', 'Total')}</td><td class="num r">${money(doc.total)} <span class="small">SAR</span></td></tr></tbody></table>
    ${doc.terms ? `<p class="small"><b>${B('الشروط', 'Terms')}</b>${esc(doc.terms)}</p>` : ''}
    <table class="iv-meta"><tbody><tr><td>${B('اعتمده', 'Approved by')}</td><td></td><td>${B('التوقيع', 'Signature')}</td><td style="height:14mm"></td></tr></tbody></table>`;
  return `<div class="iv" dir="rtl" data-nt>${head}${meta}${body}${doc.note ? `<p class="small">${esc(doc.note)}</p>` : ''}
    <div class="iv-foot">${B('صدر من نظام وعد · تاريخ الطباعة <span class="num">' + esc(today()) + '</span>', 'Issued by Waad · printed <span class="num">' + esc(today()) + '</span>')}</div></div>`;
}

applyLang();
boot();
</script>
</body>
