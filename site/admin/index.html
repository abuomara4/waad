:root{--acc-txt:#1B6CC9;--bg:#f5f7fb;--surface:#fff;--side:#fff;--gold:#8a641f;--ink:#0f172a;--muted:#56657a;--line:#e2e8f0;--line2:#cbd5e1;--line3:#f1f5f9;--accent:#1B6CC9;--accent-ink:#fff;--soft:#eff4ff;--soft2:#f1f5f9;--ok:#0f766e;--okbg:rgba(13,148,136,.10);--bad:#b91c1c;--badbg:rgba(239,68,68,.10);--wait:#b45309;--waitbg:rgba(245,158,11,.12);--prim:#142039;--prim-h:#1e293b;--prim-ink:#fff;--sh1:0 1px 3px 0 rgba(15,23,42,.04),0 1px 2px -1px rgba(15,23,42,.04);--sh2:0 10px 15px -3px rgba(15,23,42,.06),0 4px 6px -4px rgba(15,23,42,.04);color-scheme:light}
@media(prefers-color-scheme:dark){:root[data-theme="auto-dark"]{--bg:#131b29;--surface:#1c2636;--side:#182131;--ink:#e8edf4;--muted:#8d9bb0;--line:#29364a;--line2:#34435a;--line3:#222d3f;--accent:#4c8df6;--acc-txt:#9cc2ff;--accent-ink:#0b1220;--soft:rgba(76,141,246,.15);--soft2:#172030;--ok:#3fc392;--okbg:rgba(63,195,146,.15);--bad:#f87171;--badbg:rgba(239,68,68,.16);--wait:#e0b45e;--waitbg:rgba(224,180,94,.15);--prim:#2f6fe8;--prim-h:#2563eb;--prim-ink:#fff;--gold:#C9B27B;--sh1:0 1px 2px 0 rgba(0,0,0,.35);--sh2:0 12px 28px -6px rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#131b29;--surface:#1c2636;--side:#182131;--ink:#e8edf4;--muted:#8d9bb0;--line:#29364a;--line2:#34435a;--line3:#222d3f;--accent:#4c8df6;--acc-txt:#9cc2ff;--accent-ink:#0b1220;--soft:rgba(76,141,246,.15);--soft2:#172030;--ok:#3fc392;--okbg:rgba(63,195,146,.15);--bad:#f87171;--badbg:rgba(239,68,68,.16);--wait:#e0b45e;--waitbg:rgba(224,180,94,.15);--prim:#2f6fe8;--prim-h:#2563eb;--prim-ink:#fff;--gold:#C9B27B;--sh1:0 1px 2px 0 rgba(0,0,0,.35);--sh2:0 12px 28px -6px rgba(0,0,0,.55);color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:WaadSAR,"Inter","IBM Plex Sans Arabic",system-ui,Tahoma,Arial,sans-serif;line-height:1.7;font-size:15px}
[hidden]{display:none!important}
a{color:var(--accent);text-decoration:none}
h1{font-size:22px;margin:0 0 4px;font-weight:700}
h2{font-size:17px;margin:0 0 12px;font-weight:600}
.muted{color:var(--muted)}.small{font-size:13px}.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.ok{color:var(--ok)}.bad{color:var(--bad)}
/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.abox{width:100%;max-width:420px}
.brand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:18px}
.mark{width:40px;height:40px;border-radius:10px;background:var(--prim);color:var(--prim-ink);display:grid;place-items:center;font-weight:700;font-size:22px}
.brand b{font-size:22px}
.wlogo{display:block;height:44px;width:auto}.wl-l{display:none}
:root[data-theme="light"] .wl-d{display:none}:root[data-theme="light"] .wl-l{display:block}
@media(prefers-color-scheme:light){:root:not([data-theme]) .wl-d{display:none}:root:not([data-theme]) .wl-l{display:block}}
.auth .brand{margin-bottom:26px}.auth .wlogo{height:88px}
.afoot{text-align:center;margin-top:18px;opacity:.75}
.tabs{display:flex;gap:4px;background:var(--soft2);padding:4px;border-radius:10px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font:inherit;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh1);font-weight:600}
/* shell */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--side);border-inline-end:1px solid var(--line);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.side .brand{justify-content:flex-start;margin:0 6px 16px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;font:inherit;font-size:12px;color:var(--muted);margin:12px 0 2px;padding:4px 10px;font-weight:600;cursor:pointer;border-radius:6px}.nav .grp:hover{color:var(--ink)}.nav .grp .chev{transition:transform .15s;font-size:11px}.nav .grp[aria-expanded=false] .chev{transform:rotate(90deg)}[dir=rtl] .nav .grp[aria-expanded=false] .chev{transform:rotate(-90deg)}.nitems{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink);min-height:38px;position:relative}.nav a .nt{flex:1;min-width:0}.nav .ni{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.75}.nav a.on .ni{opacity:1}
.nav a:hover{background:var(--soft2)}
.nav a.on{background:var(--soft);color:var(--accent);font-weight:600}.nav a.on::after{content:"";position:absolute;inset-block:7px;inset-inline-end:0;width:3px;border-radius:3px;background:var(--accent)}
.pill{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;line-height:18px}
.main{min-width:0}
.top{display:flex;align-items:center;gap:10px;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5}
.top .sp{flex:1}
.top .cname{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#cs{max-width:220px}
.btn.menu{display:none}
.page{padding:24px;max-width:1400px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}.head>div:first-child{min-width:0;flex:1 1 280px}.head .muted{overflow-wrap:anywhere}
/* cards & tables */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:var(--sh1);margin-bottom:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.card.kpi{color:var(--ink);display:block}.card.kpi:hover{border-color:var(--line2)}
.kpi .v{font-size:24px;font-weight:700}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--line3);white-space:nowrap}
th{background:var(--soft2);color:var(--muted);font-weight:600;font-size:13px}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:var(--soft2)}
td.r,th.r{text-align:end}
tfoot td{font-weight:700;background:var(--soft2)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.badge{display:inline-block;border-radius:99px;padding:0 10px;font-size:12px;line-height:22px;background:var(--soft2);color:var(--muted)}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.bad{background:var(--badbg);color:var(--bad)}.badge.wait{background:var(--waitbg);color:var(--wait)}.badge.info{background:var(--soft);color:var(--acc-txt)}
/* forms */
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;min-height:40px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
/* dropdown options readable in dark mode (native menus ignore the select's colors on some platforms) */
select option,select optgroup{background:var(--surface);color:var(--ink)}
/* password field with show/hide eye */
.pwrap{position:relative}
.pwrap input{padding-right:42px}   /* the field is dir=ltr in both languages, so the eye sits on the physical right, past the typed text */
.peye{position:absolute;right:4px;left:auto;top:4px;width:auto;min-height:32px;height:calc(100% - 8px);padding:0 8px;background:none;border:0;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center}
.peye:hover{color:var(--ink)}
.peye svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.peye .pe-slash{display:none}
.peye.on .pe-slash{display:inline}
input[type=checkbox]{width:auto;min-height:0}
.fg{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.fg .wide{grid-column:1/-1}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 14px;cursor:pointer;min-height:38px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--soft2)}
.btn.pri{background:var(--prim);border-color:var(--prim);color:var(--prim-ink)}.btn.pri:hover{background:var(--prim-h)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:30px;padding:3px 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.full{width:100%;justify-content:center}
.err{background:var(--badbg);color:var(--bad);border-radius:8px;padding:8px 12px;margin:10px 0;font-size:14px}
.note{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:14px;margin:10px 0}
.note.warn{background:rgba(217,119,6,.10);border-inline-start:3px solid var(--warn,#d97706)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:18px;letter-spacing:3px;background:var(--soft2);border-radius:6px;padding:2px 8px;direction:ltr;display:inline-block}
dialog{border:0;border-radius:14px;padding:0;width:min(620px,calc(100vw - 32px));background:var(--surface);color:var(--ink);box-shadow:var(--sh2)}
dialog::backdrop{background:rgba(15,23,42,.45)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.db{padding:18px;max-height:70vh;overflow:auto;overscroll-behavior:contain}
.df{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}
.x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted)}
#toast{position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(50%);background:var(--prim);color:var(--prim-ink);padding:10px 18px;border-radius:10px;box-shadow:var(--sh2);z-index:50;font-size:14px}
[dir=ltr] #toast{transform:translateX(-50%)}
.lines td{padding:4px}.lines input,.lines select{min-height:34px;padding:4px 8px}
.seg{display:inline-flex;gap:2px;background:var(--soft2);padding:3px;border-radius:9px;flex-wrap:wrap}
.seg a{padding:5px 12px;border-radius:7px;color:var(--muted);font-size:14px}
.seg a.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh1);font-weight:600}
.timeline{list-style:none;padding:0;margin:0}.timeline li{padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
@media(max-width:860px){
 .shell{grid-template-columns:1fr}
 .side{position:fixed;inset-block:0;inset-inline-start:0;width:270px;z-index:20;transform:translateX(110%);transition:transform .2s;box-shadow:var(--sh2)}
 [dir=ltr] .side{transform:translateX(-110%)}
 .side.open{transform:none}
 .btn.menu{display:inline-flex}
 .page{padding:16px}
 .top{padding:10px 16px;flex-wrap:wrap;gap:6px}
 .top .cname .badge{display:none}
 #cs{max-width:150px}
 .fg{grid-template-columns:1fr}
}
@media print{.side,.top,.btn{display:none!important}.shell{display:block}.card{box-shadow:none}}

.linkbtn{border:0;background:none;padding:0;font:inherit;color:var(--accent);cursor:pointer}
/* attendance */
.clock{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.btn.big{font-size:18px;padding:14px 28px;border-radius:12px;min-width:200px}
@media(max-width:640px){.btn.big{width:100%}}
.btn.wa{background:#25d366;border-color:#25d366;color:#fff}.btn.wa:hover{background:#1ebe5b;border-color:#1ebe5b}

/* A4 letter sheet: 210 × 297 mm, always paper-white whatever the theme */
.a4wrap{overflow:hidden;padding:4px 0 20px}
.a4{width:210mm;height:297mm;box-sizing:border-box;padding:16mm 20mm 12mm;margin:0 auto;background:#fff;color:#111;display:flex;flex-direction:column;font-family:WaadSAR,'IBM Plex Sans Arabic',system-ui,sans-serif;font-size:12.5pt;line-height:1.9;box-shadow:0 2px 14px rgba(0,0,0,.18);overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.a4[dir=ltr]{font-family:WaadSAR,'IBM Plex Sans Arabic',Georgia,serif}
.lt-head{display:flex;justify-content:space-between;gap:12mm;align-items:flex-start;border-bottom:1.2pt solid #1f3b57;padding-bottom:5mm}
.lt-brand{display:flex;align-items:center;gap:5mm;min-width:0}
.lt-logo{max-height:22mm;max-width:55mm;object-fit:contain;display:block}
.logo-prev{min-width:120px;min-height:56px;padding:6px;border:1px dashed var(--line,#ccc);border-radius:8px;display:flex;align-items:center;justify-content:center;background:#fff}
.logo-prev img{max-height:60px;max-width:220px;object-fit:contain}
.logo-prev .muted{color:#56657a}
.lt-co{font-size:17pt;font-weight:700;color:#1f3b57;line-height:1.4}
.lt-ids,.lt-meta{font-size:9.5pt;color:#444;line-height:1.7}
.lt-meta,.lt-ids{white-space:nowrap}
.lt-main{flex:1;padding-top:9mm}
.lt-title{text-align:center;font-size:18pt;margin:0 0 8mm;color:#111;text-decoration:underline;text-underline-offset:3mm;text-decoration-thickness:.8pt}
.lt-to{font-weight:700;margin:0 0 5mm!important}
.a4 p{margin:0 0 4mm;text-align:justify;color:#111}
.lt-tbl{width:72%;margin:2mm auto 6mm;border-collapse:collapse;font-size:11.5pt;color:#111}
.lt-tbl th,.lt-tbl td{border:.6pt solid #999;padding:1.4mm 4mm;text-align:start;background:#fff}
.lt-tbl thead th{background:#eef2f6;font-weight:600}
.lt-tbl tfoot td{font-weight:700;background:#f6f8fa}
.lt-tbl .amt{text-align:end;width:42%}
.lt-close{margin-top:6mm!important}
.lt-sign{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12mm}
.lt-by{font-weight:700;margin-bottom:3mm}
.lt-line{min-width:64mm;border-bottom:.6pt dotted #777;margin-bottom:5mm;padding-bottom:1mm}

.req{color:var(--bad);font-weight:700}
.whlist{display:flex;flex-direction:column;gap:2px;text-align:start;direction:rtl;unicode-bidi:isolate}.whq{white-space:nowrap}
.empty-cta{text-align:center;padding:32px 16px}.empty-cta p{color:var(--muted);margin:0 0 14px}
.tw .empty{text-align:center}
.um .brole{margin-inline-start:6px;font-weight:400}@media(max-width:600px){.um .brole{display:none}}
/* every control uses the page font: a button with Arabic text otherwise falls back to the device font, which on some systems has no Arabic glyphs (□□□ on the point-of-sale cards) */
button,input,select,textarea,optgroup{font-family:inherit}
/* numeric columns: the cell is left-to-right (numbers), its header is not — align both to the same physical side */
[dir=rtl] td.r,[dir=rtl] th.r{text-align:left}[dir=ltr] td.r,[dir=ltr] th.r{text-align:right}
.kcard.drag{opacity:.5}.kcol.over{outline:2px dashed var(--accent);outline-offset:-2px;border-radius:10px}.kcard[draggable=true]{cursor:grab}
#loadbar{position:fixed;top:0;inset-inline:0;height:3px;z-index:9999;background:linear-gradient(90deg,transparent,#C9B27B,transparent);background-size:40% 100%;background-repeat:no-repeat;animation:lb 1s linear infinite}@keyframes lb{from{background-position:-40% 0}to{background-position:140% 0}}@media(prefers-reduced-motion:reduce){#loadbar{animation:none;background:#C9B27B}}
.empty .eico{width:36px;height:36px;fill:none;stroke:currentColor;stroke-width:1.5;opacity:.5;display:block;margin:0 auto 8px}
/* back links: the arrow points the way back in either direction */
.back::before{content:"→ "}[dir=ltr] .back::before{content:"← "}
/* figure cards: the last row stretches to the full width instead of leaving one card alone with empty gaps */
.grid:has(> .card.kpi){display:flex;flex-wrap:wrap}.grid:has(> .card.kpi) > *{flex:1 1 200px;min-width:0}@media(max-width:600px){.grid:has(> .card.kpi) > *{flex-basis:150px}}
/* the Waad logo always shows: in the side menu on wide screens, in the top bar when the menu is folded away (phones, tablets) */
.tlogo{display:none;flex:none}.tlogo .wlogo{height:30px}
@media(max-width:860px){.tlogo{display:inline-flex;align-items:center}}
.btn.menu .bi{display:block}
/* electronic signature */
.sigpad{width:100%;max-width:600px;aspect-ratio:600/220;height:auto;border:1.5px dashed var(--line2);border-radius:12px;background:#fff;touch-action:none;display:block;cursor:crosshair}
.sigimg{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;max-width:420px}.sigimg img{width:100%;height:auto;display:block}
/* global search */
.gsr{max-height:55vh;overflow:auto;margin-top:8px}.gsg{font-size:12px;color:var(--muted);font-weight:600;margin:10px 4px 4px}.gsi{display:block;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none}.gsi:hover,.gsi.on{background:var(--soft2)}
/* notes on records */
.notes .nrow{border-bottom:1px solid var(--line3);padding:8px 0}.notes .nrow:last-child{border-bottom:0}.notes .nadd{margin-top:10px}
/* customer portal */
.portal{max-width:920px;margin:0 auto;padding:16px}.portal .brand{margin:24px auto}.phead{display:flex;gap:12px;align-items:center;margin-bottom:12px}.phead h1{margin:0}.plogo{height:52px;width:auto;border-radius:8px}

/* «الامتثال» cards (compliance.js) */
.cmpl{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:12px}
.cmc{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;border-inline-start:4px solid var(--line)}
.cmc.ok{border-inline-start-color:var(--ok,#1f9d55)}.cmc.warn{border-inline-start-color:#d98e04}.cmc.bad{border-inline-start-color:var(--bad)}.cmc.info{border-inline-start-color:#3b82f6}
.cmc .v{font-size:26px;font-weight:700}.cmc .cml{color:var(--muted,#6b7280);margin-top:auto}.cmc:hover{box-shadow:0 8px 20px -14px rgba(20,32,57,.4)}

.svb{position:relative;cursor:pointer}.svb input{position:absolute;opacity:0;inset:0}.svb span{display:inline-flex;min-width:34px;height:34px;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;padding:0 6px}.svb input:checked+span{background:var(--pri,#1e3a8a);color:#fff;border-color:transparent}.svb input:focus-visible+span{outline:2px solid var(--pri,#1e3a8a)}

/* «الصلاحيات»: department rows in the role grid */
tr.pgrp td{padding-top:14px;color:var(--muted,#6b7280);font-size:13px}
.viewonly .head .btn,.viewonly .head button{display:none}
.paysteps{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.pstep{flex:1 1 180px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}.pstep.done{border-color:var(--ok,#16a34a)}.pstep.now{border-color:var(--accent);background:var(--soft)}
.ptbl{width:100%;border-collapse:collapse;font-size:11px}.ptbl th,.ptbl td{border:1px solid #999;padding:3px 5px;text-align:start}.ptbl td.num{text-align:end}.ptbl thead th{background:#eee}
.psig{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px;font-size:12px;break-inside:avoid}.psig>div{display:flex;flex-direction:column;gap:6px}.psig .psl{margin-top:18px;border-top:1px dotted #555;padding-top:4px}
.winv .ptbl{font-size:13px;margin-top:10px}.winv .ptbl tfoot td{background:#f6f6f6}
.hmore,.hmore-i{display:contents}.hmore-t{display:none}
@media(max-width:700px){.hmore{display:block;position:relative}.hmore-t{display:inline-flex}.hmore-i{display:none;position:absolute;inset-inline-end:0;top:calc(100% + 4px);z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh2);padding:6px;flex-direction:column;gap:4px;min-width:230px}.hmore.open .hmore-i{display:flex}.hmore-i .btn{width:100%;justify-content:flex-start}}
/* ===== Waad brand guidelines (2026): tokens, type, focus, motion ===== */
:root{--brand-navy:#142039;--brand-gold:#C9B27B;--brand-blue:#217FE1;--brand-sage:#81988C}
h1,h2,h3,.ph-co{font-family:WaadSAR,"Plus Jakarta Sans","Noto Kufi Arabic","IBM Plex Sans Arabic",system-ui,sans-serif;letter-spacing:0}
.btn{border-radius:8px;transition:background-color .15s,border-color .15s,color .15s,box-shadow .15s}
.card{border-radius:12px}
:focus-visible{outline:2px solid var(--brand-blue);outline-offset:2px}
#page>div{animation:wfade .25s cubic-bezier(.22,1,.36,1)}
@keyframes wfade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#page>div{animation:none}.btn{transition:none}}
@media print{h1,h2,h3{font-family:inherit}}
.hbars{display:flex;flex-direction:column;gap:8px}.hb{display:grid;grid-template-columns:minmax(90px,1.2fr) 2fr auto;gap:8px;align-items:center}.hbt{height:10px;background:var(--line);border-radius:4px;overflow:hidden}.hbt i{display:block;height:100%;background:var(--brand-blue,#217FE1);border-radius:4px}
.kpi b{font-size:22px;display:block;margin-top:4px}
@media(max-width:480px){.hb{grid-template-columns:1fr auto}.hb .hbt{grid-column:1/-1;order:3}}

function showErr(where, e) { const box = typeof where === 'string' ? $(where) : where; const m = e && e.message ? e.message : String(e); if (box) { box.innerHTML = `<div class="err" role="alert">${esc(m)}</div>`; try { box.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (x) {} } else toast(m); }
function formData(f) { const o = {}; for (const el of f.elements) { if (!el.name) continue; if (el.type === 'checkbox') o[el.name] = el.checked; else o[el.name] = el.value.trim(); } return o; }
const blank = v => v === '' || v == null ? null : v;
const snSplit = v => [...new Set(String(v || '').split(/[\n,;،]+/).map(x => x.trim()).filter(Boolean))];
async function busy(btn, fn) { if (btn) { btn.disabled = true; } try { return await fn(); } finally { if (btn) btn.disabled = false; } }
function tbl(cols, rows, { empty = 'لا توجد بيانات', onRow, foot } = {}) {
  if (!rows || !rows.length) return `<div class="tw"><div class="empty"><svg class="eico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16v12H4zM4 7l2-3h12l2 3M9 12h6"/></svg><div>${esc(empty)}</div></div></div>`;
  return `<div class="tw"><table><thead><tr>${cols.map(c => `<th class="${c.r ? 'r' : ''}">${esc(c.t)}</th>`).join('')}</tr></thead><tbody>${rows.map((r, i) => `<tr${onRow ? ` class="click" data-row="${i}"` : ''}>${cols.map(c => `<td class="${c.r ? 'r num' : ''}">${c.h ? c.h(r) : esc(r[c.k])}</td>`).join('')}</tr>`).join('')}</tbody>${foot ? `<tfoot><tr>${foot}</tr></tfoot>` : ''}</table></div>`;
}
function bindRows(root, rows, fn) { $$('tr[data-row]', root).forEach(tr => tr.onclick = () => fn(rows[+tr.dataset.row])); }
const opt = (v, t, sel) => `<option value="${esc(v)}"${String(sel) === String(v) ? ' selected' : ''}>${esc(t)}</option>`;
// a field: its label is tied to its control (for / id), so screen readers announce what each input is (WCAG 1.3.1, 4.1.2)
let FIELD_N = 0;
const field = (label, input, cls = '') => { input = String(input); let id = (input.match(/<(?:input|select|textarea)\b[^>]*\sid="([^"]+)"/) || [])[1];
  if (!id && /<(?:input|select|textarea)\b/.test(input)) { id = 'fld' + (++FIELD_N); input = input.replace(/<(input|select|textarea)\b/, m => m + ` id="${id}"`); }
  return `<div class="${cls}"><label${id ? ` for="${id}"` : ''}>${esc(label)}${/\srequired(?=[\s>="])/.test(input) ? ' <span class="req" aria-hidden="true">*</span>' : ''}</label>${input}</div>`; };
const inp = (name, v = '', extra = '') => `<input name="${name}" value="${esc(v == null ? '' : v)}" ${extra}>`;
// password field with a show/hide eye toggle (used on login and wherever a password is typed)
const pwInput = (name, ac = 'current-password', extra = 'required') => `<div class="pwrap"><input name="${name}" type="password" autocomplete="${ac}" dir="ltr" ${extra}><button type="button" class="peye" tabindex="-1" aria-label="إظهار كلمة المرور" title="إظهار كلمة المرور"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/><line class="pe-slash" x1="4" y1="20" x2="20" y2="4"/></svg></button></div>`;
document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('.peye'); if (!b) return; const i = b.parentNode.querySelector('input'); if (!i) return; const show = i.type === 'password'; i.type = show ? 'text' : 'password'; b.classList.toggle('on', show); const lbl = show ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور'; b.setAttribute('aria-label', lbl); b.title = lbl; });

/* modal */
function modal(title, body, { ok = 'حفظ', onOk, wide } = {}) {
  const d = $('#dlg');
  d.style.width = wide ? 'min(960px,calc(100vw - 32px))' : '';
  d.innerHTML = `<form method="dialog" id="mform" novalidate><div class="dh"><b>${esc(title)}</b><button type="button" class="x" aria-label="إغلاق" id="mx">×</button></div><div class="db">${body}<div id="merr"></div></div>${onOk ? `<div class="df"><button type="button" class="btn" id="mc">إلغاء</button><button class="btn pri" id="mok">${esc(ok)}</button></div>` : ''}</form>`;
  const close = () => d.close();
  $('#mx', d).onclick = close; if ($('#mc', d)) $('#mc', d).onclick = close;
  $('#mform', d).onsubmit = async ev => { ev.preventDefault(); if (!onOk) return close(); const b = $('#mok', d); try { await busy(b, () => onOk(formData($('#mform', d)), d)); close(); } catch (e) { showErr($('#merr', d), e); } };
  d.showModal(); const first = $('input:not([type=hidden]):not([type=checkbox]):not([type=radio]):not([type=date]):not([readonly]),textarea', d); if (first) first.focus();   // never a dropdown: on phones that opens it setTimeout(() => markWide(d), 60);
  return d;
}
const confirmBox = (title, msg, okText = 'تأكيد') => new Promise(res => { modal(title, `<p>${esc(msg)}</p>`, { ok: okText, onOk: async () => res(true) }); $('#dlg').addEventListener('close', () => res(false), { once: true }); });

/* ===== printing: every printout carries the company letterhead (logo, name, CR, VAT) ===== */
function printHead(title) {
  const c = S.company || {}, ids = [c.cr_no && 'السجل التجاري ' + c.cr_no, c.vat_no && 'الرقم الضريبي ' + c.vat_no].filter(Boolean).join(' · ');
  return `<div class="ph"><div class="ph-brand">${c.logo ? `<img class="ph-logo" src="${esc(c.logo)}" alt="">` : ''}<div><div class="ph-co">${esc(c.name || '')}</div>${ids ? `<div class="ph-ids">${esc(ids)}</div>` : ''}${c.address ? `<div class="ph-ids">${esc(c.address)}</div>` : ''}</div></div>
    <div class="ph-meta">${title ? `<div class="ph-t">${esc(title)}</div>` : ''}<div>تاريخ الطباعة: <span class="num">${esc(today())}</span></div></div></div>`;
}
// print only `node` (one prepared sheet, or a copy of part of the page): everything else is hidden for this job
function printWith(node, pageCss) {
  let pa = document.getElementById('printarea'); if (!pa) { pa = document.createElement('div'); pa.id = 'printarea'; document.body.appendChild(pa); }
  pa.replaceChildren(node);
  const st = document.createElement('style'); st.textContent = pageCss; document.head.appendChild(st);
  document.body.classList.add('printing');
  const done = () => { document.body.classList.remove('printing'); st.remove(); pa.replaceChildren(); window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  window.print();
}
function printBlock(node, title) {
  const doc = document.createElement('div'); doc.className = 'pdoc'; doc.innerHTML = printHead(title);
  const cp = node.cloneNode(true); cp.removeAttribute('id'); cp.querySelectorAll('.btn,button,input[type=file],.wa').forEach(x => x.remove()); doc.appendChild(cp);
  printWith(doc, '@page{size:A4 portrait;margin:12mm}');
}

  if (open) { open.classList.remove('open'); const b = open.querySelector('.hmore-t'); if (b) b.setAttribute('aria-expanded', 'false'); } });

// Waad's own invoice for a subscription payment (0114): a tax invoice with the QR code when Waad has a VAT number, else a plain invoice
async function waadInvoicePrint(id) {
  const v = await db.rpc('waad_invoice', { p_payment: id }), s = v.seller || {}, b = v.buyer || {}, m = x => money(+x);
  const t = !v.tax ? tr('فاتورة') : b.vat ? tr('فاتورة ضريبية') : tr('فاتورة ضريبية مبسطة');   // a VAT-registered customer gets a (standard) tax invoice
  const qr = v.tax && typeof QR !== 'undefined' ? QR.svg(QR.zatca({ seller: s.name, vat: s.vat, time: new Date(v.at).toISOString().replace(/\.\d{3}Z$/, 'Z'), total: v.total, tax: v.vat }), 120) : '';
  const n = document.createElement('div'); n.className = 'pdoc winv';
  n.innerHTML = `<div class="ph"><div class="ph-brand"><img class="ph-logo" src="${LOGO_L}" alt=""><div><div class="ph-co">${esc(s.name || 'وعد')}</div>
      ${s.vat ? `<div class="ph-ids">${esc(tr('الرقم الضريبي'))} <span class="num">${esc(s.vat)}</span></div>` : ''}${s.cr ? `<div class="ph-ids">${esc(tr('السجل التجاري'))} <span class="num">${esc(s.cr)}</span></div>` : ''}${s.address ? `<div class="ph-ids">${esc(s.address)}</div>` : ''}</div></div>
      <div class="ph-meta"><div class="ph-t">${esc(t)}</div><div>${esc(tr('رقم الفاتورة'))}: <span class="num">${esc(v.no || '')}</span></div><div>${esc(tr('التاريخ'))}: <span class="num">${esc(v.date)}</span></div></div></div>
    <p><b>${esc(tr('العميل'))}:</b> ${esc(b.name || '')}${b.vat ? ` · ${esc(tr('الرقم الضريبي'))} <span class="num">${esc(b.vat)}</span>` : ''}${b.cr ? ` · ${esc(tr('السجل التجاري'))} <span class="num">${esc(b.cr)}</span>` : ''}${b.city ? ` · ${esc(b.city)}` : ''}</p>
    <table class="ptbl"><thead><tr><th>${esc(tr('البيان'))}</th><th>${esc(tr('المدة'))}</th><th>${esc(tr('المبلغ'))}</th></tr></thead>
      <tbody><tr><td>${esc(tr('اشتراك نظام وعد'))}${v.plan ? ' — ' + esc(v.plan) : ''}</td><td>${v.days ? `<span class="num">${v.days}</span> ${esc(tr('يوم'))}` : '—'}</td><td class="num">${m(v.net)}</td></tr></tbody>
      <tfoot>${v.tax ? `<tr><td colspan="2">${esc(tr('الإجمالي قبل الضريبة'))}</td><td class="num">${m(v.net)}</td></tr><tr><td colspan="2">${esc(tr('ضريبة القيمة المضافة'))} <span class="num">${+v.rate}%</span></td><td class="num">${m(v.vat)}</td></tr>` : ''}
      <tr><td colspan="2"><b>${esc(tr('الإجمالي'))}</b></td><td class="num"><b>${m(v.total)}</b></td></tr></tfoot></table>
    <div class="row" style="justify-content:space-between;align-items:flex-end;margin-top:14px"><div class="small">${esc(tr('حالة الدفع'))}: ${esc(tr('مدفوعة'))}${v.note ? '<br>' + esc(v.note) : ''}${v.tax ? '' : '<br>' + esc(tr('غير خاضعة لضريبة القيمة المضافة'))}</div>${qr}</div>`;
  printWith(n, '@page{size:A4 portrait;margin:14mm}');
}
// the browser's own print (Ctrl+P) on any page gets the same letterhead
window.addEventListener('beforeprint', () => {
  if (document.body.classList.contains('printing')) return;
  let h = document.getElementById('printhead'); if (!h) { h = document.createElement('div'); h.id = 'printhead'; document.body.prepend(h); }
  const t = document.querySelector('#page h1'); h.innerHTML = S.company && S.session ? printHead(t ? t.textContent.trim() : '') : '';
});

// three modes: follow the device (default), always light, always dark
const THEMES = { auto: ['المظهر: حسب الجهاز', '◐'], light: ['المظهر: نهاري', '☀'], dark: ['المظهر: ليلي', '☾'] };
// the system is dark by default; the admin site keeps its own setting and is light by default
const THEME_KEY = typeof ADMIN_SITE !== 'undefined' ? 'waad.atheme' : 'waad.theme', THEME_DEF = typeof ADMIN_SITE !== 'undefined' ? 'light' : 'dark';
const curTheme = () => { const t = LS.get(THEME_KEY); return THEMES[t] ? t : THEME_DEF; };
function applyTheme(t) { if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  for (const b of document.querySelectorAll('[data-theme-btn]')) { const [label, icon] = THEMES[curTheme()]; b.title = label; b.setAttribute('aria-label', label); if (b.dataset.themeBtn === 'menu') b.innerHTML = `<span class="ic">${icon}</span><span>${esc(label)}</span>`; else b.textContent = b.dataset.themeBtn === 'icon' ? icon : label; } }
applyTheme(curTheme());
function toggleTheme() { const order = THEME_DEF === 'light' ? ['light', 'dark', 'auto'] : ['dark', 'light', 'auto'], t = order[(order.indexOf(curTheme()) + 1) % 3]; LS.set(THEME_KEY, t === THEME_DEF ? null : t); applyTheme(t); toast(THEMES[t][0]); }

const brand = () => `<div class="brand"><img class="wlogo wl-d" src="${LOGO_D}" alt="وعد Waad"><img class="wlogo wl-l" src="${LOGO_L}" alt="وعد Waad"></div>`;
// company code can arrive in the link HR shares: …/waad/?c=1FB695
(() => { try { const c = new URLSearchParams(location.search).get('c'); if (c && /^[A-Za-z0-9]{4,10}$/.test(c) && c.toUpperCase() !== LS.get('waad.ccode')) { LS.set('waad.ccode', c.toUpperCase()); LS.set('waad.cname', null); } } catch (e) {} })();
const adminEmail = user => String(user).trim().toLowerCase() + '@admin.waad.app';   // Waad team accounts (admin site)
const staffEmail = (code, empNo) => String(empNo).trim().toLowerCase() + '.' + String(code).trim().toLowerCase() + '@staff.waad.app';
// the public website (landing page) sits one folder up from the app: site/app/ -> site/, pages.dev/app/ -> pages.dev/
const SITE_URL = new URL('../', location.href.split('#')[0]).href;
// inside the store apps (Google Play TWA / iPhone Capacitor shell; both open the system with ?src=app): no subscription,
// prices or payment prompts anywhere — subscribing happens on the website only (owner's decision, 2026-11-17)
const IN_APP = (() => { try {
  if (window.Capacitor && typeof Capacitor.isNativePlatform === 'function' && Capacitor.isNativePlatform()) return true;
  if (new URLSearchParams(location.search).get('src') === 'app' || /^android-app:\/\//.test(document.referrer)) sessionStorage.setItem('waad.inapp', '1');
  return sessionStorage.getItem('waad.inapp') === '1'; } catch (e) { return false; } })();
// the admin site (site/admin/) is a separate build of the same code (build.py sets ADMIN_SITE): Waad's own team only
const ADMIN = typeof ADMIN_SITE !== 'undefined';
const DEV_FILE = /waad-(app|admin)\.html$/.test(location.pathname);   // the dev server serves the two builds side by side
const ADMIN_URL = DEV_FILE ? 'waad-admin.html' : new URL('../admin/', location.href.split('#')[0]).href;
const APP_URL = DEV_FILE ? 'waad-app.html' : new URL('../app/', location.href.split('#')[0]).href;
function authView(tab = LS.get('waad.authtab') || 'staff', msg = '') {
  if (ADMIN) return adminAuthView(msg);   // the admin site signs in with a username (platform.js)
  const app = $('#app'); const ccode = LS.get('waad.ccode') || '', cname = LS.get('waad.cname') || '';
  if (tab === 'staff' && ccode && !cname) {   // code from a link: resolve the company name first
    db.rpc('company_by_code', { p_code: ccode }).then(n => { if (n) { LS.set('waad.cname', n); } else { LS.set('waad.ccode', null); } authView('staff', msg); }).catch(() => { LS.set('waad.ccode', null); authView('staff', msg); });
    app.innerHTML = '<div class="auth"><div class="muted">جاري التحميل…</div></div>'; return;
  }
  const step = tab === 'staff' ? (ccode ? 'login' : 'code') : tab;
  let body = '', btn = 'دخول', foot = '';
  if (step === 'code') {
    body = `<h2 style="margin-bottom:4px">رمز المنشأة</h2><p class="muted small" style="margin-top:0">أدخل رمز منشأتك مرة واحدة — تزودك به الموارد البشرية — وسيتذكره النظام.</p>
      ${field('رمز المنشأة', `<input name="code" required dir="ltr" autocapitalize="characters" autocomplete="organization" style="text-transform:uppercase;letter-spacing:3px;font-size:18px;text-align:center" placeholder="1FB695">`)}`;
    btn = 'متابعة';
  } else if (step === 'login') {
    body = `<div class="note" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span>المنشأة: <b>${esc(cname)}</b></span><a href="#" id="chg" class="small">تغيير</a></div>
      ${field('الرقم الوظيفي', `<input name="emp" required dir="ltr" inputmode="numeric" autocomplete="username" value="${esc(LS.get('waad.empno') || '')}">`)}<div style="height:10px"></div>
      ${field('كلمة المرور', pwInput('password', 'current-password'))}${rememberBox()}`;
    foot = `<p class="muted small" style="margin:10px 0 0;text-align:center">أول دخول؟ استخدم كلمة المرور التي زودتك بها الموارد البشرية، وسيُطلب منك تغييرها. </p><div style="margin-top:6px;text-align:center"><a href="#" id="sforgot" class="small">نسيت كلمة المرور؟</a></div>`;
  } else {
    body = `${field('البريد الإلكتروني', `<input name="email" type="email" autocomplete="email" required dir="ltr">`)}<div style="height:10px"></div>
      ${field('كلمة المرور', pwInput('password', tab === 'in' ? 'current-password' : 'new-password'))}${tab === 'in' ? rememberBox() : ''}
      ${tab === 'up' ? `<div style="height:10px"></div>${field('تأكيد كلمة المرور', pwInput('password2', 'new-password'))}
        <label class="row small" style="gap:6px;margin-top:10px;align-items:flex-start"><input type="checkbox" name="agree" style="width:auto;margin-top:3px"> <span>أوافق على <a href="#/terms">الشروط والأحكام</a> و<a href="#/privacy">سياسة الخصوصية</a></span></label>` : ''}`;
    btn = tab === 'up' ? 'إنشاء الحساب' : 'دخول';
    foot = tab === 'in' ? `<div style="margin-top:10px;text-align:center"><a href="#" id="forgot" class="small">نسيت كلمة المرور؟</a></div>`
      : `<p class="muted small" style="margin:10px 0 0">لصاحب منشأة جديدة، أو لمن وصلته دعوة بالبريد من الإدارة. الموظفون لا يسجلون هنا — يدخلون برمز المنشأة ورقمهم الوظيفي.</p>`;
  }
  const links = tab === 'staff' ? `<a href="#" data-go="in">دخول الإدارة بالبريد</a> · <a href="#" data-go="up">حساب جديد بالبريد</a>` : `<a href="#" data-go="staff">دخول الموظفين</a> · ${tab === 'in' ? '<a href="#" data-go="up">حساب جديد بالبريد</a>' : '<a href="#" data-go="in">لديك حساب؟ دخول بالبريد</a>'}`;
  app.innerHTML = `<div class="auth"><div class="abox">${brand()}<div class="atag">${esc(tr('حلول دقيقة.. لوعد موثوق'))}</div><div class="card">
    ${tab !== 'staff' ? `<h2>${tab === 'in' ? 'دخول الإدارة بالبريد' : 'حساب جديد بالبريد'}</h2>` : ''}
    ${msg ? `<div class="note">${esc(msg)}</div>` : ''}
    <form id="af" novalidate>${body}<div id="aerr"></div><div style="height:12px"></div><button class="btn pri full" id="ab">${btn}</button>${foot}</form><div id="sso"></div></div>
    <p class="muted small" style="text-align:center">${links}</p>
    <p class="muted small" style="text-align:center"><a href="#" id="theme" data-theme-btn="text"></a> · ${langBtn('linkbtn')}</p>
    <p class="muted small afoot"><a href="${SITE_URL}" id="tosite">← الموقع الرئيسي</a> · نظام وعد السحابي لإدارة المنشآت © ${new Date().getFullYear()} · <a href="#/privacy">سياسة الخصوصية</a> · <a href="#/terms">الشروط والأحكام</a></p></div></div>`;
  $('#lg').onclick = () => setLang(LANG === 'en' ? 'ar' : 'en');
  if ($('#sso')) ssoButtons($('#sso'), tab).catch(() => {});
  $$('[data-go]', app).forEach(a => a.onclick = e => { e.preventDefault(); authView(a.dataset.go); });
  $('#theme').onclick = e => { e.preventDefault(); toggleTheme(); }; applyTheme(curTheme());
  if ($('#chg')) $('#chg').onclick = e => { e.preventDefault(); LS.set('waad.ccode', null); LS.set('waad.cname', null); LS.set('waad.empno', null); authView('staff'); };
  if ($('#sforgot')) $('#sforgot').onclick = async e => { e.preventDefault(); const n = $('#af').emp.value.trim(); if (!/^[A-Za-z0-9_-]{1,20}$/.test(n)) return showErr('#aerr', 'اكتب رقمك الوظيفي أولا');
    try { await db.rpc('staff_password_help', { p_code: ccode, p_emp_no: n }); authView('staff', 'إذا كان الرقم مرتبطا بحساب دخول، وصل طلبك إلى الموارد البشرية في منشأتك، وستزودك بكلمة مرور مؤقتة.'); } catch (er) { showErr('#aerr', er); } };
  if ($('#forgot')) $('#forgot').onclick = async e => { e.preventDefault(); const em = $('#af').email.value.trim(); if (!em) return showErr('#aerr', 'يرجى إدخال البريد الإلكتروني أولا'); try { await authApi.recover(em); authView('in', 'أرسلنا رابط إعادة تعيين كلمة المرور إلى بريدك (إن كان مسجلا).'); } catch (er) { showErr('#aerr', er); } };
  $('#af').onsubmit = async e => {
    e.preventDefault(); const f = formData(e.target);
    if (step === 'code') {
      const c = f.code.replace(/\s/g, '').toUpperCase();
      if (!/^[A-Z0-9]{4,10}$/.test(c)) return showErr('#aerr', 'أدخل رمز المنشأة كما وصلك');
      try { await busy($('#ab'), async () => { const n = await db.rpc('company_by_code', { p_code: c }); if (!n) throw new Error('رمز المنشأة غير صحيح — تأكد منه مع الموارد البشرية'); LS.set('waad.ccode', c); LS.set('waad.cname', n); authView('staff'); }); } catch (er) { showErr('#aerr', er); }
      return;
    }
    if (step === 'login') {
      if (!/^[A-Za-z0-9_-]{1,20}$/.test(f.emp)) return showErr('#aerr', 'أدخل الرقم الوظيفي (أرقام إنجليزية)');
      if (!f.password) return showErr('#aerr', 'أدخل كلمة المرور');
      try { await busy($('#ab'), async () => { await authApi.signIn(staffEmail(ccode, f.emp), f.password); LS.set('waad.authtab', 'staff'); rememberSet(f.remember); LS.set('waad.empno', f.remember ? f.emp : null); return boot(); }); }
      catch (er) { showErr('#aerr', /غير صحيحة/.test(er.message) ? 'الرقم الوظيفي أو كلمة المرور غير صحيحة' : er); }
      return;
    }
    if (!(f.email || '').trim()) return showErr('#aerr', 'يرجى إدخال البريد الإلكتروني');
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email)) return showErr('#aerr', 'البريد الإلكتروني غير صحيح');
    if (!f.password) return showErr('#aerr', 'أدخل كلمة المرور');
    if (tab === 'up' && f.password.length < 8) return showErr('#aerr', 'كلمة المرور 8 أحرف على الأقل');
    if (tab === 'up' && f.password !== f.password2) return showErr('#aerr', 'كلمتا المرور غير متطابقتين');
    if (tab === 'up' && !f.agree) return showErr('#aerr', 'وافق على الشروط والأحكام وسياسة الخصوصية لإنشاء الحساب');
    if (tab === 'up') { LS.set('waad.terms', TERMS_VERSION); LS.set('waad.authtab', 'in'); }
    try {
      await busy($('#ab'), async () => {
        if (tab === 'in') { await authApi.signIn(f.email, f.password); LS.set('waad.authtab', 'in'); rememberSet(f.remember); return boot(); }
        const signedIn = await authApi.signUp(f.email, f.password);
        if (signedIn) return boot();
        authView('in', 'أنشأنا حسابك. افتح رسالة التأكيد في بريدك ثم سجّل الدخول.');
      });
    } catch (er) { showErr('#aerr', er); }
  };
}

/* first login with a temporary password → choose a personal one */
function changePasswordView(forced = true) {
  $('#app').innerHTML = `<div class="auth"><div class="abox">${brand()}<div class="card"><h2>${forced ? 'اختر كلمة مرور جديدة' : 'تغيير كلمة المرور'}</h2>

async function loadContext(pre) {
  S.companies = pre || await db.rpc('my_companies');
  if (!S.companies.length) return false;
  let c = S.companies.find(x => x.company_id === S.cid) || S.companies[0];
  S.cid = c.company_id; LS.set('waad.cid', S.cid); S.role = c.role; S.roles = new Set(c.roles && c.roles.length ? c.roles : [c.role]); S.emp = c.employee_id; S.mustChange = !!c.must_change_password; if (c.code) { LS.set('waad.ccode', c.code); LS.set('waad.cname', c.name); }
  const fr = ['accountant', 'storekeeper', 'manager', 'employee'].filter(r => S.roles.has(r));   // jobs whose permissions HR sets (0111, 0112)
  const [[co], [sub], , fp, me, pf, team] = await Promise.all([db.get('companies', { id: 'eq.' + S.cid }), db.get('company_subscriptions', { company_id: 'eq.' + S.cid }).catch(() => []), preloadNames(),
    fr.length ? db.get('finance_permissions', { company_id: 'eq.' + S.cid, role: 'in.(' + fr.join(',') + ')', select: 'perm' }) : [],
    S.emp ? db.get('employees', { id: 'eq.' + S.emp }) : [], S.emp ? db.get('petty_funds', { employee_id: 'eq.' + S.emp, select: 'id', limit: 1 }).catch(() => []) : [],
    S.emp ? db.get('employees', { company_id: 'eq.' + S.cid, manager_id: 'eq.' + S.emp, end_date: 'is.null', select: 'id', limit: 1 }).catch(() => []) : []]);
  S.company = co; S.sub = sub || null;
  // the group this account owns (0140/0141): adds «المجموعة» under the dashboard once known
  S.group = c.group_id ? await db.rpc('my_group').catch(() => null) : null;   // null unless this account owns the group
  if (typeof cfLoad === 'function') await cfLoad();
  S.perms = new Set();
  (c.perms || []).forEach(p => S.perms.add(p));
  if (!(c.perms || []).length) fp.forEach(p => S.perms.add(p.perm));   // personal permissions, when set, replace the role's defaults
  S.myEmp = me[0] || null;
  S.hasPetty = pf.length > 0; S.hasTeam = team.length > 0;
  const myPrj = S.emp && (!S.sub || (S.sub.modules || []).includes('proj')) ? await db.rpc('my_time_projects', { p_company: S.cid }).catch(() => []) : [];
  S.myTime = myPrj.length > 0; S.myPM = myPrj.some(p => p.manager);   // «ساعات عملي» and the manager of a project (0123, 0125)
  S.zatcaOn = false;
  // linked = the company's unit or any branch's unit (0139)
  if (isFin()) Promise.all([db.get('zatca_settings', { company_id: 'eq.' + S.cid, select: 'enabled' }), db.get('zatca_units', { company_id: 'eq.' + S.cid, enabled: 'is.true', select: 'branch_id' }).catch(() => [])])
    .then(([r, u]) => { S.zatcaOn = !!(r[0] && r[0].enabled) || u.length > 0; if (S.zatcaOn) zatcaKick(); }).catch(() => {});
  return true;
}

// links from auth emails (password recovery, sign-up confirmation) come back as #access_token=…&type=… or #error=…
async function authFromLink() {
  const h = location.hash || '';
  if (!/(^#|&)(access_token|error_code|error)=/.test(h)) return null;
  const p = new URLSearchParams(h.slice(1));
  history.replaceState(null, '', location.pathname + location.search);
  if (!p.get('access_token')) return { error: p.get('error_code') === 'otp_expired' ? 'انتهت صلاحية الرابط أو استُخدم من قبل — اطلب رابطا جديدا' : 'الرابط غير صالح — اطلب رابطا جديدا' };
  setSession({ access_token: p.get('access_token'), refresh_token: p.get('refresh_token'), expires_in: +p.get('expires_in') || 3600, user: null });
  try { const u = await api('/auth/v1/user'); setSession({ access_token: p.get('access_token'), refresh_token: p.get('refresh_token'), expires_in: +p.get('expires_in') || 3600, user: u }); }
  catch (e) { setSession(null); return { error: 'الرابط غير صالح — اطلب رابطا جديدا' }; }
  return { type: p.get('type') };
}
// the landing page links to app/?start=signup (new company) or ?start=signin (owner/admin e-mail login)
function startTab() {
  const q = new URLSearchParams(location.search), t = { signup: 'up', signin: 'in', staff: 'staff' }[q.get('start')];
  if (/^[0-9A-Fa-f]{7}$/.test(q.get('ref') || '')) { LS.set('waad.ref', q.get('ref').toUpperCase()); q.delete('ref'); history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '') + location.hash); }   // «ادعُ منشأة» (0115)
  if (q.has('start')) { q.delete('start'); history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '') + location.hash); }
  return t;
}
/* «تذكر دخولي»: on by default; off = the sign-in ends when the browser closes */
const rememberBox = () => `<label class="row small" style="gap:6px;margin-top:10px"><input type="checkbox" name="remember" checked style="width:auto"> <span>${esc(tr('تذكر دخولي على هذا الجهاز'))}</span></label>`;
function rememberSet(on) { LS.set('waad.noremember', on ? null : 1); try { sessionStorage.setItem('waad.live', '1'); sessionStorage.setItem('waad.unlocked', '1'); } catch (e) {} }
async function boot() {
  try { if (LS.get('waad.noremember') && S.session && !sessionStorage.getItem('waad.live')) setSession(null); } catch (e) {}
  const link = await authFromLink();
  if (link && link.error) return authView('in', link.error);
  if (link && link.type === 'recovery') return changePasswordView('recovery');
  if (typeof portalToken === 'function' && portalToken()) return portalView(portalToken());   // a customer's private link: no sign-in
  if (typeof careersToken === 'function' && careersToken()) return careersView(careersToken());
  if (typeof coToken === 'function' && coToken()) return coPublicView(coToken());   // a customer approves a change order: no sign-in   // the company's public careers page: no sign-in
  if (!S.session) return legalHash() ? legalView(legalHash()) : authView(startTab());
  if (!ADMIN && typeof bioGate === 'function' && bioGate()) return;
  try {
    // startup calls that do not depend on each other go out together (each round trip to the server costs ~0.2 s)
    const [mfa, plat, comps] = await Promise.all([db.rpc('mfa_state').catch(() => null), db.rpc('is_platform_admin').catch(() => false), db.rpc('my_companies').catch(e => { if (e.status === 401) throw e; return null; })]);
    S.mfa = mfa; S.platform = plat;
    if (mfa && mfa.enrolled && mfa.aal !== 'aal2') return mfaChallengeView();
    if (LS.get('waad.terms')) { db.rpc('accept_terms', { p_version: LS.get('waad.terms') }).catch(() => {}); LS.set('waad.terms', null); }
    if (ADMIN) {
      if (!S.platform) return (await db.rpc('platform_needs_mfa').catch(() => false)) ? adminMfaView() : notAdminView();
      const me = await db.rpc('platform_admin_me').catch(() => null); S.pme = me || {};
      return me && me.must_change ? changePasswordView(true) : platformView();
    }
    if (S.platform && (/^#\/platform/.test(location.hash) || !(comps || []).length)) { location.href = ADMIN_URL; return; }
    // a Waad team account (username sign-in) never gets a company: it belongs on the admin site
    if (!(comps || []).length && /@admin\.waad\.app$/i.test((S.session.user || {}).email || '')) { location.href = ADMIN_URL; return; }
    if (!(comps || []).length && await db.rpc('my_ended').catch(() => false)) return endedView();
    if (!(await loadContext(comps))) return onboardView();
    if (S.mustChange) return changePasswordView(true);
    if (S.sub && S.sub.status === 'pending') return pendingView();
  } catch (e) {
    if (e.status === 401) { setSession(null); return authView('in', 'انتهت الجلسة — سجّل الدخول مجددا'); }
    $('#app').innerHTML = `<div class="auth"><div class="abox">${brand()}<div class="card"><div class="err">${esc(e.message)}</div><button class="btn" onclick="boot()">إعادة المحاولة</button></div></div></div>`; return;
  }
  shell(); route();
}

// d = the result of company_export / platform_company_export; returns a ZIP Blob
async function exportZip(d, companyName) {
  const tables = d.tables || {}, files = [], done = new Set(), ar = LANG !== 'en';
  const cell = v => v == null ? '' : typeof v === 'number' ? v : typeof v === 'boolean' ? (v ? (ar ? 'نعم' : 'Yes') : (ar ? 'لا' : 'No')) : (typeof v === 'object' ? JSON.stringify(v) : String(v)).slice(0, 32000);
  const sheet = t => { const rows = tables[t]; done.add(t); if (!rows || !rows.length) return null;
    const all = [...new Set(rows.flatMap(r => Object.keys(r)))].filter(c => c !== 'company_id' && c !== 'data' && !(t === 'companies' && c === 'logo'));
    const ids = all.filter(c => c === 'id' || /_id$/.test(c)), cols = [...all.filter(c => !ids.includes(c)), ...ids];
    return { name: expPick(EXP_T[t] || [t, t]), rows: [cols.map(c => EXP_C[c] ? expPick(EXP_C[c]) : c), ...rows.map(r => cols.map(c => cell(r[c])))] }; };
  const index = [];
  EXP_SECTIONS.forEach(([sn, list], i) => { const sh = list.map(sheet).filter(Boolean); if (!sh.length) return;
    const fname = String(i + 1).padStart(2, '0') + ' ' + expPick(sn) + '.xlsx'; index.push([fname, sh.map(s => s.name + ' (' + (s.rows.length - 1) + ')').join('، ')]);
    files.push([fname, sh]); });
  const fileT = Object.keys(tables).filter(t => (tables[t] || []).some(r => r && 'file_name' in r));
  const rest = Object.keys(tables).filter(t => !done.has(t) && !fileT.includes(t)).sort().map(sheet).filter(Boolean);
  if (rest.length) { const fname = '99 ' + (ar ? 'أخرى' : 'Other') + '.xlsx'; index.push([fname, rest.map(s => s.name).join('، ')]); files.push([fname, rest]); }
  // attachments: a list sheet + the files themselves
  const att = [], attRows = [[ar ? 'المجلد' : 'Folder', ar ? 'اسم الملف' : 'File name', ar ? 'المسار في الملف المضغوط' : 'Path in the ZIP', 'id']], used = new Set();
  for (const t of fileT) { const folder = expSafe(expPick(EXP_T[t] || [t, t]));
    for (const r of tables[t]) { let fn = expSafe(r.file_name) || String(r.id).slice(0, 8), path = (ar ? 'المرفقات/' : 'Attachments/') + folder + '/' + fn;
      if (used.has(path)) path = path.replace(/(\.[^./]*)?$/, m => '-' + String(r.id).slice(0, 6) + m); used.add(path);
      attRows.push([folder, r.file_name || '', r.data ? path : (ar ? 'غير مضمّن' : 'not included'), r.id]);
      if (r.data) try { att.push([path, expB64(r.data)]); } catch (e) { /* a damaged file is listed but skipped */ } } }
  if (attRows.length > 1) { const fname = '98 ' + (ar ? 'قائمة المرفقات' : 'Attachments list') + '.xlsx'; index.push([fname, String(attRows.length - 1)]); files.push([fname, [{ name: ar ? 'المرفقات' : 'Attachments', rows: attRows }]]); }
  const entries = [];
  for (const [fname, sheets] of files) entries.push([fname, new Uint8Array(await xlsxBook(sheets).arrayBuffer())]);
  const readme = [(ar ? 'نسخة كاملة من بيانات المنشأة: ' : 'Full copy of the company data: ') + companyName, (ar ? 'تاريخ التصدير: ' : 'Exported at: ') + String(d.exported_at || '').slice(0, 19).replace('T', ' '), '',
    ...index.map(([f, s]) => f + '\n   ' + s), '', ar ? 'كل ملف Excel قسم، وكل ورقة فيه جدول. الأعمدة id وما ينتهي بـ _id تربط الجداول ببعضها. المرفقات الأصلية في مجلد «المرفقات».' : 'Each Excel file is a section and each sheet a table. The id and *_id columns link the tables. The original attachments are in the «Attachments» folder.'].join('\n');
  return zipStore([[ar ? 'اقرأني.txt' : 'README.txt', '﻿' + readme], ...entries, ...att], 'application/zip');
}

// every table inside a box as one Excel sheet each (numbers stay numbers)
function tablesXlsx(root, name) { const num = t => { const v = t.replace(/[,\s\u2066\u2069\u20C1\u00A0]/g, ''); return /^-?\d+(\.\d+)?$/.test(v) ? (t.includes('\u20C1') ? { sar: +v } : +v) : t; };
  const sheets = Array.from(root.querySelectorAll('table')).map((tb, i) => ({ name: (name || 'Waad') + (i ? ' ' + (i + 1) : ''), rows: Array.from(tb.rows).map(r => Array.from(r.cells).map(c => num(c.innerText.trim()))) }));
  if (!sheets.length) return toast(tr('لا توجد بيانات للتصدير')); anSave(xlsxBook(sheets), (name || 'waad') + '.xlsx'); }

/* ZATCA phase-1 e-invoice QR: TLV (seller, VAT no., timestamp, total, VAT) → base64 → QR code (byte mode, ECC M).
   Self-contained QR encoder (no external library): versions 1–40, all 8 masks scored, best kept. */
const QR = (() => {
  const ECC = [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26, 26, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28];
  const BLK = [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16, 17, 17, 18, 20, 21, 23, 25, 26, 28, 29, 31, 33, 35, 37, 38, 40, 43, 45, 47, 49];
  const rawMods = v => { let r = (16 * v + 128) * v + 64; if (v >= 2) { const n = Math.floor(v / 7) + 2; r -= (25 * n - 10) * n - 55; if (v >= 7) r -= 36; } return r; };
  const dataCw = v => Math.floor(rawMods(v) / 8) - ECC[v] * BLK[v];
  const mul = (x, y) => { let z = 0; for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11d); z ^= ((y >>> i) & 1) * x; } return z & 255; };
  const divisor = deg => { const r = new Array(deg).fill(0); r[deg - 1] = 1; let root = 1; for (let i = 0; i < deg; i++) { for (let j = 0; j < r.length; j++) { r[j] = mul(r[j], root); if (j + 1 < r.length) r[j] ^= r[j + 1]; } root = mul(root, 2); } return r; };
  const remainder = (data, dv) => { const r = dv.map(() => 0); for (const b of data) { const f = b ^ r.shift(); r.push(0); dv.forEach((c, i) => r[i] ^= mul(c, f)); } return r; };
  const align = v => { if (v === 1) return []; const n = Math.floor(v / 7) + 2, step = v === 32 ? 26 : Math.ceil((v * 4 + 4) / (n * 2 - 2)) * 2, r = [6]; for (let p = v * 4 + 10; r.length < n; p -= step) r.splice(1, 0, p); return r; };

  function encode(bytes) {

      <button class="btn pri">${esc(tr('حفظ الأسئلة'))}</button>${cur.faq ? `<button type="button" class="btn" data-reset="faq">${esc(tr('رجوع للأسئلة الأصلية'))}</button>` : ''}</div></form>`;
  const save = async (key, value, btn, err) => { try { await busy(btn, () => db.rpc('platform_set_site_content', { p_key: key, p_value: value })); toast(tr('تم الحفظ')); platformView(); } catch (e) { showErr(err, e); } };
  $('#fcon', page).onsubmit = e => { e.preventDefault(); const f = e.target, p = f.phone.value.replace(/\D/g, '');
    if (!/^05\d{8}$/.test(p)) return showErr($('#econ', page), tr('اكتب رقم الجوال بالشكل 05XXXXXXXX'));
    save('contact', { phone: '966' + p.slice(1), email: f.email.value.trim() }, $('button.pri', f), $('#econ', page)); };
  $('#fban', page).onsubmit = e => { e.preventDefault(); const f = e.target;
    if (f.on.checked && !f.ar.value.trim()) return showErr($('#eban', page), tr('اكتب نص الشريط بالعربية'));
    save('banner', { on: f.on.checked, ar: f.ar.value.trim(), en: f.en.value.trim() }, $('button.pri', f), $('#eban', page)); };
  $$('[data-reset]', page).forEach(b => b.onclick = () => save(b.dataset.reset, null, b, $('#e' + { contact: 'con', banner: 'ban', faq: 'faq' }[b.dataset.reset], page)));
  // FAQ editor: questions are edited in place; ↑ ↓ reorder; ✕ removes
  const list = $('#faql', page);
  const read = () => { faq = $$('.fqi', list).map(d => ({ qa: d.querySelector('[name=qa]').value, aa: d.querySelector('[name=aa]').value, qe: d.querySelector('[name=qe]').value, ae: d.querySelector('[name=ae]').value })); };
  const draw = () => {
    list.innerHTML = faq.length ? faq.map((x, i) => `<div class="fqi" data-i="${i}"><div class="row" style="gap:6px;margin-bottom:6px"><b class="num">${i + 1}</b><div class="sp"></div>
        <button type="button" class="btn sm" data-mv="-1" aria-label="${esc(tr('أعلى'))}" ${i ? '' : 'disabled'}>↑</button><button type="button" class="btn sm" data-mv="1" aria-label="${esc(tr('أسفل'))}" ${i < faq.length - 1 ? '' : 'disabled'}>↓</button>
        <button type="button" class="btn sm danger" data-rm>${esc(tr('حذف'))}</button></div>
      <div class="fg">${field('السؤال بالعربية', `<input name="qa" value="${esc(x.qa)}" maxlength="200">`)}${field('السؤال بالإنجليزية', `<input name="qe" value="${esc(x.qe)}" maxlength="200" dir="ltr">`)}
        ${field('الجواب بالعربية', `<textarea name="aa" rows="3" maxlength="800">${esc(x.aa)}</textarea>`)}${field('الجواب بالإنجليزية', `<textarea name="ae" rows="3" maxlength="800" dir="ltr">${esc(x.ae)}</textarea>`)}</div></div>`).join('')
      : `<div class="empty">${esc(tr('لا توجد أسئلة. أضف سؤالا.'))}</div>`;
    $$('.fqi', list).forEach(d => { const i = +d.dataset.i;
      $$('[data-mv]', d).forEach(b => b.onclick = () => { read(); const j = i + +b.dataset.mv; [faq[i], faq[j]] = [faq[j], faq[i]]; draw(); });
      d.querySelector('[data-rm]').onclick = () => { read(); faq.splice(i, 1); draw(); }; });
  };
  draw();
  $('#faqadd', page).onclick = () => { read(); faq.push({ qa: '', aa: '', qe: '', ae: '' }); draw(); const l = $$('.fqi', list).pop(); l.scrollIntoView({ block: 'nearest' }); l.querySelector('input').focus(); };
  $('#ffaq', page).onsubmit = e => { e.preventDefault(); read();
    const out = faq.map(x => ({ qa: x.qa.trim(), aa: x.aa.trim(), qe: x.qe.trim(), ae: x.ae.trim() })).filter(x => x.qa || x.aa);
    if (out.some(x => !x.qa || !x.aa)) return showErr($('#efaq', page), tr('كل سؤال يحتاج سؤالا وجوابا بالعربية'));
    save('faq', out, $('#ffaq button.pri', page), $('#efaq', page)); };
};

        <div style="display:grid;gap:6px">${PPERMS.map(([k, t]) => `<label class="row" style="gap:8px"><input type="checkbox" data-pp="${k}"${(a.perms || []).includes(k) ? ' checked' : ''}> ${esc(tr(t))}</label>`).join('')}</div>

// record a payment; choosing a plan fills the amount and its period, and the subscription is extended by it
function platPayForm(c, plans) {
  const act = plans.filter(p => p.active);
  const d = modal(tr('تسجيل دفعة') + ': ' + c.name, `<div class="fg">
      ${field('الباقة', `<select name="plan"><option value="">${esc(tr('بدون باقة'))}</option>${act.map(p => opt(p.id, p.name + ' · ' + money0(p.price), '')).join('')}</select>`)}
      ${field('المبلغ (ريال)', '<input name="amount" type="number" min="0.01" step="0.01" required>')}
      ${field('تاريخ الدفع', `<input name="paid_on" type="date" value="${today()}">`)}
      ${field('الطريقة', `<select name="method">${Object.entries(PAY_M).map(([k, t]) => opt(k, tr(t), 'transfer')).join('')}</select>`)}
      ${field('يمدّد الاشتراك بالأيام (فارغ = بلا تمديد)', '<input name="days" type="number" min="1" max="3660">')}
      ${field('ملاحظة', '<input name="note" maxlength="300">', 'wide')}</div>
    <p class="muted small">${esc(tr('إذا حددت مدة أو باقة، يصبح الاشتراك «مفعّلا» وتُضاف المدة بعد تاريخ نهايته الحالي.'))}</p>`, {
    onOk: async f => {
      await db.rpc('platform_add_payment', { p_company: c.company_id, p_amount: +f.amount, p_paid_on: f.paid_on || null, p_method: f.method,
        p_plan: f.plan || null, p_days: f.days ? +f.days : null, p_note: f.note || null });

  d.querySelector('[name=plan]').onchange = e => { const p = act.find(x => x.id === e.target.value); if (p) { d.querySelector('[name=amount]').value = p.price; d.querySelector('[name=days]').value = p.period_days; } };
}

    <div class="card" id="cpays"><h2>${esc(tr('آخر الدفعات'))}</h2>
      ${tbl([{ t: 'التاريخ', h: p => `<span class="num">${esc(p.paid_on)}</span>` }, { t: 'المنشأة', h: p => esc(p.company) }, { t: 'المبلغ', r: 1, h: p => money0(p.amount) },
        { t: 'الباقة', h: p => esc(p.plan || '—') }, { t: 'الطريقة', h: p => esc(tr(PAY_M[p.method] || p.method)) }, { t: 'الفاتورة', h: p => p.inv_no ? `<button class="btn sm" data-winv="${p.id}"><span class="num">${esc(p.inv_no)}</span></button>` : '' }], pays.slice(0, 50), { empty: 'لا توجد دفعات', onRow: true })}</div>`;
  $('#padd', page).onclick = () => planForm({});
  const cards = $$('.card', page);
  bindRows($('#cplans', page), plans, planForm);
  bindRows($('#cpays', page), pays.slice(0, 50), p => { location.hash = '#/company/' + p.company_id; });
  db.rpc('platform_referrals').catch(() => []).then(rs => { const el = $('#crefs', page); if (!el || !rs.length) return; el.hidden = false;
    el.innerHTML = `<h2>${esc(tr('الإحالات (ادعُ منشأة)'))}</h2><p class="muted small" style="margin-top:-4px">${esc(tr('عند أول دفعة للمنشأة المدعوة يُضاف للمنشأة الداعية 30 يوما تلقائيا؛ وإن لم يكن لها اشتراك قائم تبقى الأيام «بانتظار التفعيل» حتى تضيفها يدويا.'))}</p>` +
      tbl([{ t: 'المنشأة الداعية', h: x => esc(x.referrer_name) }, { t: 'المنشأة المدعوة', h: x => esc(x.invited_name) }, { t: 'سجّلت', h: x => `<span class="num">${esc(x.joined_on)}</span>` },
        { t: 'المكافأة', h: x => x.rewarded_at ? `<span class="badge ok">${esc(tr('أُضيف شهر'))}</span>` : `<span class="badge">${esc(tr('لم تشترك بعد'))}</span>` },
        { t: 'بانتظار التفعيل', h: x => x.waiting_days ? `<span class="num">${x.waiting_days}</span> ${esc(tr('يوم'))} ${pcan('billing') ? `<button class="btn sm" data-rclr="${x.referrer}">${esc(tr('أضفتها'))}</button>` : ''}` : '—' }], rs);
    $$('[data-rclr]', el).forEach(b => b.onclick = async () => { await db.rpc('platform_referral_credit_clear', { p_company: b.dataset.rclr }); toast(tr('تم الحفظ')); platformView(); }); });
  $$('[data-winv]', page).forEach(b => b.onclick = ev => { ev.stopPropagation(); waadInvoicePrint(b.dataset.winv).catch(e => toast(e.message)); });
  if ($('#pinvs', page)) $('#pinvs', page).onclick = async () => { const v = await db.rpc('platform_invoice_settings') || {};
    modal(tr('بيانات فواتير وعد'), `<div class="fg">${field('اسم البائع (كما في السجل التجاري)', inp('inv_name', v.inv_name, 'maxlength="120"'))}${field('الرقم الضريبي (فارغ = غير مسجل في الضريبة)', inp('inv_vat', v.inv_vat, 'inputmode="numeric" maxlength="15"'))}
      ${field('السجل التجاري', inp('inv_cr', v.inv_cr, 'maxlength="30"'))}${field('نسبة الضريبة %', inp('inv_vat_rate', v.inv_vat_rate == null ? 15 : v.inv_vat_rate, 'type="number" min="0" max="100" step="0.01"'))}
      ${field('العنوان', inp('inv_address', v.inv_address, 'maxlength="200"'), 'wide')}</div>
      <p class="muted small">${esc(tr('مع الرقم الضريبي تصبح كل فاتورة فاتورة ضريبية: المبلغ المدفوع شامل الضريبة، وعليها رمز QR. بدونه تصدر فاتورة عادية بلا ضريبة. كل دفعة تُسجَّل تأخذ رقما متسلسلا W-السنة-الرقم، ويراها مالك المنشأة في إعداداته.'))}</p>`,
      { onOk: async f => { await db.rpc('platform_invoice_settings_set', { p: f }); toast(tr('تم الحفظ')); } }); };
};
function planForm(p) {
  modal(p.id ? tr('تعديل الباقة') : tr('باقة جديدة'), `<div class="fg">${field('اسم الباقة', inp('name', p.name, 'maxlength="40" required'))}
      ${field('السعر (ريال)', inp('price', p.price, 'type="number" min="0" step="0.01" required'))}${field('المدة بالأيام', inp('period_days', p.period_days || 30, 'type="number" min="1" max="3660"'))}
      ${field('الحد الأعلى للمستخدمين (فارغ = بدون حد)', inp('max_users', p.max_users, 'type="number" min="1"'))}
      ${field('الحد الأعلى للموظفين (فارغ = بدون حد)', inp('max_employees', p.max_employees, 'type="number" min="1"'))}
      ${field('الأقسام', modChecks(p.modules || Object.keys(MODULES)), 'wide')}
      <label class="row small wide" style="gap:6px"><input type="checkbox" name="active" ${p.active === false ? '' : 'checked'} style="width:auto"> ${esc(tr('متاحة للاختيار'))}</label></div>`, {
    wide: true, onOk: async (f, d) => {
      const mods = pickMods($('#mform', d)); if (!mods.length) throw new Error('اختر قسما واحدا على الأقل');
      await db.rpc('platform_save_plan', { p: { id: p.id || null, name: f.name, price: f.price, period_days: f.period_days, max_users: f.max_users || '', max_employees: f.max_employees || '', modules: mods, active: f.active } });
      toast(tr('تم الحفظ')); platformView();
    } });
}

// a receipt for a payment received (print or «Save as PDF»); Arabic and English on one sheet. Not a tax invoice.
function printReceipt(c, p, plan) {
  const no = 'R-' + String(p.id).replace(/-/g, '').slice(0, 8).toUpperCase(), M = PAY_M[p.method] || p.method;
  const M_EN = { transfer: 'Bank transfer', card: 'Card', cash: 'Cash', other: 'Other' }[p.method] || p.method;
  const row = (ar, en, v) => `<tr><th>${esc(ar)}<div class="en">${esc(en)}</div></th><td>${v}</td></tr>`;
  const w = document.createElement('div'); w.className = 'rcpt'; w.setAttribute('data-nt', '');
  w.innerHTML = `<div class="rh"><div>${brand()}</div><div class="rt"><b>إيصال استلام دفعة</b><div class="en">Payment receipt</div><div class="num">${esc(no)}</div></div></div>
    <table>${row('التاريخ', 'Date', `<span class="num">${esc(p.paid_on)}</span>`)}${row('استلمنا من', 'Received from', esc(c.name))}
      ${row('المبلغ', 'Amount', `<b class="num">${money0(p.amount)}</b>`)}${row('طريقة الدفع', 'Method', esc(M) + ' · ' + esc(M_EN))}
      ${plan ? row('الباقة', 'Plan', esc(plan.name)) : ''}${p.days ? row('مدة الاشتراك', 'Period', `<span class="num">${p.days}</span> يوم · days`) : ''}
      ${p.note ? row('ملاحظة', 'Note', esc(p.note)) : ''}</table>
    <p class="rf">هذا إيصال استلام وليس فاتورة ضريبية.<br><span class="en">This is a receipt of payment, not a tax invoice.</span></p>
    <p class="rf">وعد · Waad — ${esc(SITE_URL)}</p>`;
  printWith(w, `@page{size:A5 portrait;margin:12mm}
    .rcpt{font-family:inherit;color:#111;direction:rtl}.rcpt .en{direction:ltr;font-size:11px;color:#555}
    .rcpt .rh{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #946a24;padding-bottom:10px;margin-bottom:14px}
    .rcpt .rh .brand{justify-content:flex-start;margin:0}.rcpt .wlogo{height:40px}.rcpt .wl-d{display:none!important}.rcpt .wl-l{display:block!important}
    .rcpt .rt{text-align:left}.rcpt .rt b{font-size:18px}
    .rcpt table{width:100%;border-collapse:collapse;font-size:14px}.rcpt th,.rcpt td{border-bottom:1px solid #ddd;padding:8px 6px;text-align:start;vertical-align:top}
    .rcpt th{width:38%;color:#444;font-weight:600}.rcpt .rf{font-size:11px;color:#666;margin-top:14px;text-align:center}`);
}

/* ---------- support requests from customers ---------- */
const TK_KIND = { question: 'سؤال', problem: 'مشكلة', suggestion: 'اقتراح' };
const TK_ST = { open: ['بانتظار الرد', 'wait'], answered: ['تم الرد', 'ok'], closed: ['مغلق', ''] };
PV.support = async page => {
  const fk = ['open', 'answered', 'closed', 'all'].includes(LS.get('waad.tkf')) ? LS.get('waad.tkf') : 'open';
  const rows = await db.rpc('platform_tickets', { p_status: fk === 'all' ? null : fk });
  page.innerHTML = `<div class="head"><div><h1>${esc(tr('طلبات الدعم'))}</h1><div class="muted">${esc(tr('أسئلة ومشاكل واقتراحات من مدراء المنشآت. ردّك يظهر لهم في النظام ويوصلهم على الإيميل.'))}</div></div></div>
    <div class="ptabs pfil">${[['open', 'بانتظار الرد'], ['answered', 'تم الرد'], ['closed', 'مغلق'], ['all', 'الكل']].map(([k, t]) => `<a href="#" data-tf="${k}"${k === fk ? ' aria-current="page"' : ''}>${esc(tr(t))}</a>`).join('')}</div>
    ${tbl([{ t: 'الطلب', h: r => `<b data-nt>${esc(r.subject)}</b><div class="small muted">${esc(tr(TK_KIND[r.kind]))}${r.route ? ' · <span dir="ltr">' + esc(r.route) + '</span>' : ''}</div>` },
      { t: 'المنشأة', h: r => esc(r.company) + `<div class="small muted" dir="ltr">${esc(r.author || '')}</div>` },
      { t: 'الحالة', h: r => `<span class="badge ${TK_ST[r.status][1]}">${esc(tr(TK_ST[r.status][0]))}</span>` },
      { t: 'التاريخ', h: r => `<span class="num">${esc(String(r.created_at).slice(0, 16).replace('T', ' '))}</span>` }], rows, { empty: 'لا توجد طلبات هنا', onRow: true })}`;
  $$('[data-tf]', page).forEach(a => a.onclick = e => { e.preventDefault(); LS.set('waad.tkf', a.dataset.tf); platformView(); });
  bindRows(page, rows, ticketForm);
};
function ticketForm(r) {
  const d = modal(r.subject, `<p class="small muted" style="margin-top:0">${esc(r.company)} · <span dir="ltr">${esc(r.author || '')}</span> · <span class="num">${esc(String(r.created_at).slice(0, 16).replace('T', ' '))}</span>${r.route ? ' · <span dir="ltr">' + esc(r.route) + '</span>' : ''}</p>
    <div class="supb card" style="padding:10px 12px" data-nt>${esc(r.body)}</div>
    <div class="row" style="gap:6px;flex-wrap:wrap;margin-top:12px" data-nt>${esc(tr('ردود جاهزة'))}: ${cannedList().map((c, i) => `<button type="button" class="btn sm" data-cn="${i}">${esc(c[0])}</button>`).join('')}
      <button type="button" class="btn sm" id="cnsave">${esc(tr('احفظ الرد كرد جاهز'))}</button></div>
    <div class="fg" style="margin-top:8px">${field('ردّك', `<textarea name="reply" rows="6" maxlength="3000">${esc(r.reply || '')}</textarea>`, 'wide')}
      ${field('الحالة', `<select name="status">${opt('answered', tr('تم الرد'), r.status === 'open' ? 'answered' : r.status)}${opt('open', tr('بانتظار الرد'), r.status === 'open' ? '' : r.status)}${opt('closed', tr('مغلق'), r.status)}</select>`)}</div>
    <div class="row" style="gap:8px;flex-wrap:wrap;margin-top:8px">${mailBtns(r.author, 'وعد: ' + r.subject)}</div>`, {
    wide: true, ok: 'حفظ وإرسال', onOk: async f => {
      if (f.status === 'answered' && !(f.reply || '').trim()) throw new Error('اكتب الرد');
      await db.rpc('platform_reply_ticket', { p_id: r.id, p_reply: f.reply || null, p_status: f.status });
      toast(tr('تم الحفظ — يوصل الرد للعميل على الإيميل خلال دقائق')); platformView();
    } });
  bindCopy(d);
  const ta = d.querySelector('[name=reply]');
  d.querySelectorAll('[data-cn]').forEach(bt => bt.onclick = () => { const t = cannedList()[+bt.dataset.cn][1], at = ta.selectionStart ?? ta.value.length;
    ta.value = ta.value.slice(0, at) + t + ta.value.slice(ta.selectionEnd ?? at); ta.focus(); });
  d.querySelector('#cnsave').onclick = () => { const t = ta.value.trim(); if (t.length < 10) return toast(tr('اكتب الرد أولا'));
    const name = prompt(tr('اسم مختصر للرد الجاهز')); if (!name) return;
    const mine = LS.get('waad.canned') || []; mine.push([name.slice(0, 30), t]); LS.set('waad.canned', mine.slice(-20)); toast(tr('حُفظ الرد الجاهز على هذا الجهاز')); d.close(); ticketForm(r); };
}
// the built-in replies (support_lib.js) plus the ones this team member saved on this device
const cannedList = () => [...CANNED, ...(LS.get('waad.canned') || [])];

/* ---------- script errors users ran into (message, place, screen; no record contents) ---------- */
PV.errors = async page => {
  const n = [1, 7, 30].includes(LS.get('waad.errdays')) ? LS.get('waad.errdays') : 7;
  const rows = await db.rpc('platform_errors', { p_days: n });
  page.innerHTML = `<div class="head"><div><h1>${esc(tr('أخطاء النظام'))}</h1><div class="muted">${esc(tr('أخطاء حدثت في متصفحات المستخدمين، مجمّعة حسب الرسالة، ولا تتضمن أي بيانات من داخل المنشآت.'))}</div></div>
      <select id="edays" style="width:auto">${[1, 7, 30].map(d => opt(d, d === 1 ? tr('آخر يوم') : tr('آخر') + ' ' + arCount(d, 'يوم'), n)).join('')}</select></div>
    <div class="grid" style="margin-bottom:14px">${pkpi('أخطاء مختلفة', rows.length)}${pkpi('مرات الحدوث', rows.reduce((a, r) => a + r.times, 0))}${pkpi('منشآت تأثرت', rows.length ? Math.max(...rows.map(r => r.companies)) : 0, 'أعلى عدد لخطأ واحد')}</div>
    ${tbl([{ t: 'الخطأ', h: r => `<span dir="ltr" class="small" style="word-break:break-word">${esc(r.message)}</span>` }, { t: 'الشاشة', h: r => `<span dir="ltr" class="small">${esc(r.route || '—')}</span>` },
      { t: 'عدد المرات', r: 1, h: r => r.times }, { t: 'مستخدمين', r: 1, h: r => r.users }, { t: 'منشآت', r: 1, h: r => r.companies },
      { t: 'آخر مرة', h: r => `<span class="num">${esc(String(r.last_at).slice(0, 16).replace('T', ' '))}</span>` }], rows, { empty: 'لا توجد أخطاء في هذه الفترة 👌', onRow: true })}
    <p class="muted small">${esc(tr('اضغط على خطأ لتشوف مكانه في الكود والمتصفح. أرسل الصورة للمطوّر.'))}</p>`;
  $('#edays', page).onchange = e => { LS.set('waad.errdays', +e.target.value); platformView(); };
  bindRows(page, rows, r => modal(tr('تفاصيل الخطأ'), `<div dir="ltr" class="small" style="white-space:pre-wrap;word-break:break-word" data-nt><b>${esc(r.message)}</b>
source: ${esc(r.source || '—')}
screen: ${esc(r.route || '—')}
browser: ${esc(r.agent || '—')}
times: ${r.times} · users: ${r.users} · companies: ${r.companies} · last: ${esc(String(r.last_at))}</div>`));
};

applyLang();
boot();
</script>
</body>
</html>
