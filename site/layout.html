<style>
:root{--navy:#131b2e;--navy2:#1c2a45;--ink:#0f172a;--muted:#5b6b82;--line:#e2e8f0;--bg:#f6f8fc;--card:#fff;--gold:#946a24;--gold2:#d6ad5e;--blue:#2563eb;--ok:#0d9488;--r:16px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
section[id]{scroll-margin-top:72px}  /* menu links land below the sticky header */
body{margin:0;font-family:"IBM Plex Sans Arabic",system-ui,Tahoma,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.7;-webkit-font-smoothing:antialiased}
html[lang=en] .ar,html[lang=ar] .en{display:none!important}
a{color:inherit}
.wrap{max-width:1140px;margin:0 auto;padding:0 20px}
/* header */
header{position:sticky;top:0;z-index:20;background:rgba(19,27,46,.92);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid rgba(255,255,255,.08)}
.bar{display:flex;align-items:center;gap:16px;height:68px}
.brand img{height:38px;display:block}
nav.links{display:flex;gap:22px;margin-inline-start:12px}
nav.links a{color:#cbd5e1;text-decoration:none;font-size:15px;font-weight:500}
nav.links a:hover{color:#fff}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:11px 20px;font-weight:600;font-size:15px;text-decoration:none;border:1px solid transparent;cursor:pointer;font-family:inherit;white-space:nowrap;transition:transform .15s,background .15s}
.btn:active{transform:scale(.98)}
.btn.gold{background:var(--gold);color:#fff}.btn.gold:hover{background:#7d5a1c}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.28)}.btn.ghost:hover{background:rgba(255,255,255,.08)}
.btn.line{background:#fff;color:var(--navy);border-color:var(--line)}.btn.line:hover{border-color:#94a3b8}
.lang{background:transparent;border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:10px;padding:8px 12px;font-family:inherit;font-weight:600;cursor:pointer}
.mlogin{display:none!important}
.menu{display:none;background:transparent;border:0;color:#fff;font-size:26px;cursor:pointer;padding:4px 8px}
/* hero */
.hero{background:var(--navy);color:#fff;padding:84px 0 96px;overflow:hidden}
.hero-g{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#e2e8f0;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500}
.pill b{width:8px;height:8px;border-radius:50%;background:var(--gold2);display:inline-block}
h1{font-size:clamp(32px,5vw,52px);line-height:1.25;margin:18px 0 16px;font-weight:700;letter-spacing:-.5px}
h1 em{font-style:normal;color:var(--gold2)}
.lead{font-size:clamp(16px,2vw,19px);color:#cbd5e1;max-width:620px;margin:0 0 30px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.note7{margin:12px 0 0;color:#e0b45e;font-size:14px;font-weight:600}
.trust{display:flex;gap:22px;flex-wrap:wrap;margin-top:34px;color:#94a3b8;font-size:14px}
.trust span{display:inline-flex;align-items:center;gap:7px}
.trust svg{width:18px;height:18px;color:var(--gold2)}
/* product preview */
.shot{background:linear-gradient(180deg,#1f2b44,#172238);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:16px;box-shadow:0 30px 60px -20px rgba(0,0,0,.55)}

.shot .tb button{width:10px;height:10px;padding:0;border:0;border-radius:999px;background:#334155;cursor:pointer;transition:width .3s,background .3s}
.shot .tb button.on{width:24px;background:var(--gold2)}
.slides{display:grid}.slide{grid-area:1/1;opacity:0;transform:translateY(8px);transition:opacity .6s,transform .6s;pointer-events:none}
.slide.on{opacity:1;transform:none;pointer-events:auto}
.slide .st{color:#e2e8f0;font-size:13px;font-weight:700;margin-bottom:10px}
.k .dn{color:#e0b45e;font-size:12px}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px}
.k small{color:#94a3b8;font-size:12px;display:block}.k b{font-size:20px;color:#fff;font-variant-numeric:tabular-nums}

.rows{margin-top:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;overflow:hidden}
.rows div{display:flex;justify-content:space-between;padding:10px 12px;font-size:13px;color:#cbd5e1;border-top:1px solid rgba(255,255,255,.06)}
.rows div:first-child{border-top:0;color:#94a3b8;font-size:12px}
.tag{border-radius:999px;padding:1px 10px;font-size:11px;font-weight:600}
.tag.ok{background:rgba(63,195,146,.15);color:#3fc392}.tag.w{background:rgba(224,180,94,.15);color:#e0b45e}
/* inner-page header */
.phero{background:var(--navy);color:#fff;padding:56px 0 48px;border-bottom:3px solid var(--gold)}
.phero h1{margin:0 0 10px;font-size:clamp(28px,4vw,42px);line-height:1.3}.phero p{margin:0;max-width:640px;color:#cbd5e1;font-size:17px}
nav.links a[aria-current=page]{color:#fff;box-shadow:inset 0 -2px 0 var(--gold2)}
.more{margin:24px 0 0}.more a{color:var(--gold);font-weight:700;text-decoration:none;border-bottom:1px solid currentColor}.dark .more a{color:var(--gold2)}
.minis{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:12px;max-width:860px;margin:0}
.mini{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);color:#e2e8f0;text-decoration:none;font-weight:600;font-size:15px;transition:border-color .2s,background .2s}

.mini:hover,.mini[aria-expanded=true]{border-color:rgba(214,173,94,.55);background:rgba(255,255,255,.07)}
.mini[aria-expanded=true]{box-shadow:inset 0 0 0 1px rgba(214,173,94,.55)}
.sdet{max-width:860px;margin:14px 0 0}
.sd[hidden]{display:none}
.sd{display:flex;gap:16px;align-items:flex-start;padding:20px;border-radius:14px;background:rgba(214,173,94,.08);border:1px solid rgba(214,173,94,.35);animation:sdin .25s ease}
.sd .ic{flex:none;margin:0}.sd h3{margin:0 0 6px;font-size:18px;color:#fff}.sd p{margin:0;color:#cbd5e1;line-height:1.8}
.shint{color:#94a3b8;font-size:14px;margin:4px 0 0}.sdet .sd:not([hidden])~.shint{display:none}
@keyframes sdin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.mini .ic{flex:none;width:38px;height:38px;margin:0;border-radius:10px}.mini .ic svg{width:20px;height:20px}
@media(max-width:760px){.minis{grid-template-columns:1fr 1fr;gap:10px}.mini{padding:12px;font-size:14px;gap:10px}.mini .ic{width:34px;height:34px}}
/* rows: name on one side, details on the other, thin lines between */
.rows2 .r{display:grid;grid-template-columns:minmax(200px,1fr) 1.6fr;gap:12px 32px;padding:22px 0;border-top:1px solid var(--line)}
.rows2 .r:last-child{border-bottom:1px solid var(--line)}
.rows2 h3,.rows2 h2{margin:0 0 4px;font-size:19px;line-height:1.5}.rows2 p{margin:0;color:var(--muted)}
.rows2 ul{margin:0;padding:0;list-style:none;display:grid;gap:6px;align-content:start}
.rows2 li{position:relative;padding-inline-start:18px;color:#334155}
.rows2 li:before{content:"";position:absolute;inset-inline-start:2px;top:.7em;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.rows2 .r:not(:has(ul)){grid-template-columns:1fr}
.rows2.compact{display:grid;grid-template-columns:1fr 1fr;column-gap:48px}
.rows2.compact .r{padding:18px 0}.rows2.compact .r:nth-last-child(2){border-bottom:1px solid var(--line)}
.dark .rows2 .r{border-color:rgba(255,255,255,.12)}.dark .rows2 h3{color:#fff}.dark .rows2 p{color:#cbd5e1}
@media(max-width:760px){.rows2 .r{grid-template-columns:1fr;padding:18px 0}.rows2.compact{grid-template-columns:1fr}.rows2.compact .r:nth-last-child(2){border-bottom:0}}
/* home: modules as tabs, details beside them */
.mtabs{display:grid;grid-template-columns:290px 1fr;gap:24px;align-items:start}
.mtl{display:grid;gap:6px}
.mt{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:12px;font:inherit;font-weight:600;font-size:16px;color:#334155;background:none;border:1px solid transparent;cursor:pointer;text-align:start;width:100%}
.mt svg{flex:none;width:22px;height:22px;color:var(--muted)}
.mt:hover:not([aria-selected=true]){background:rgba(255,255,255,.55);color:var(--ink)}
.mt[aria-selected=true]{background:#fff;border-color:var(--line);box-shadow:0 8px 24px -16px rgba(15,23,42,.35);color:var(--ink)}.mt[aria-selected=true] svg{color:var(--gold)}
.mps{background:var(--navy);color:#fff;border-radius:20px;padding:34px;min-height:340px}
.mp[hidden]{display:none}
.mp h3{font-size:26px;margin:0 0 8px}.mp>p{color:#cbd5e1;margin:0 0 22px;font-size:17px}
.mp ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mp li{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px 14px;color:#e2e8f0}
.mp:not([hidden]){animation:sdin .25s ease}
@media(max-width:860px){.mtabs{grid-template-columns:1fr;gap:14px}
  .mtl{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.mtl::-webkit-scrollbar{display:none}
  .mt{width:auto;flex:none;white-space:nowrap;padding:10px 14px;font-size:15px;border-color:var(--line);background:#fff}
  .mps{padding:24px;min-height:0}.mp h3{font-size:22px}.mp ul{grid-template-columns:1fr}}
.faq{max-width:820px}
.nw{white-space:nowrap}
.crow{max-width:820px}.crow .r{grid-template-columns:1fr auto!important;align-items:center}.crow .rh p{font-size:18px;color:var(--ink)}
@media(max-width:520px){.crow .r{grid-template-columns:1fr!important}.crow .btn{justify-self:start}}
/* sections */
section{padding:84px 0}
.sh{max-width:680px;margin:0 0 32px}
.eyebrow{color:var(--gold);font-weight:700;font-size:14px;letter-spacing:.5px}
h2{font-size:clamp(26px,3.6vw,38px);line-height:1.3;margin:8px 0 12px}
.sh p{color:var(--muted);font-size:17px;margin:0}
.grid{display:grid;gap:18px}
.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px;transition:box-shadow .2s,transform .2s}
.ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:#eef3ff;color:var(--blue);margin-bottom:14px}
.ic svg{width:24px;height:24px}
.card h3{margin:0 0 8px;font-size:20px}
.card p{margin:0 0 12px;color:var(--muted)}
.card ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.card li{position:relative;padding-inline-start:22px;color:#334155;font-size:15px}
.card li:before{content:"";position:absolute;inset-inline-start:2px;top:.62em;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.dark{background:var(--navy);color:#fff}
.dark .sh p{color:#94a3b8}
.dark .eyebrow{color:var(--gold2)}
.dark .card{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.09)}
.dark .card p,.dark .card li{color:#cbd5e1}
.dark .ic{background:rgba(184,137,58,.15);color:var(--gold2)}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:grid;gap:14px;max-width:720px}
.steps li{counter-increment:s;display:flex;gap:14px;align-items:baseline;font-size:17px;color:#334155}
.steps li:before{content:counter(s) ".";font-weight:700;color:var(--gold);min-width:22px}
.step{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:26px;position:relative}
.step:before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;margin-bottom:12px}
.step h3{margin:0 0 6px;font-size:19px}.step p{margin:0;color:var(--muted)}
details{background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px 20px;margin-bottom:12px}
summary{cursor:pointer;font-weight:600;font-size:17px;padding:14px 0;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";color:var(--gold);font-size:22px;line-height:1}
details[open] summary:after{content:"−"}
details p{margin:0 0 16px;color:var(--muted)}
.band{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;border-radius:24px;padding:48px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.band h2{margin:0 0 6px}.band p{margin:0;color:#cbd5e1}
.ccard{display:flex;flex-direction:column;align-items:flex-start;text-decoration:none;color:inherit}
.ccard p{margin:2px 0 18px;color:var(--muted);font-size:17px}.ccard .ic svg{width:24px;height:24px}.ccard .btn{margin-top:auto}
footer{background:#0d1424;color:#94a3b8;padding:40px 0;font-size:14px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.foot img{height:32px}
.foot nav{display:flex;gap:20px;flex-wrap:wrap}.foot a{text-decoration:none}.foot a:hover{color:#fff}
@media(max-width:960px){.hero-g{grid-template-columns:1fr}.shot{max-width:520px;width:100%;margin-inline:auto}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:760px){nav.links{display:none}.menu{display:block}.hide-m{display:none}
  nav.links.open .mlogin{display:inline-flex!important;color:#fff}
  nav.links.open{display:flex;flex-direction:column;position:absolute;top:68px;inset-inline:0;background:var(--navy);padding:16px 20px;gap:14px;border-bottom:1px solid rgba(255,255,255,.08)}
  .g3,.g2{grid-template-columns:1fr}.hero{padding:56px 0 64px}section{padding:60px 0}.band{padding:30px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<script>
(function(){
  var d=document.documentElement;
  document.getElementById('yr').textContent=new Date().getFullYear();
  var cur=document.body.dataset.page;[].forEach.call(document.querySelectorAll('#nl [data-page]'),function(a){if(a.dataset.page===cur)a.setAttribute('aria-current','page')});
  document.getElementById('lg').onclick=function(){var l=d.lang==='en'?'ar':'en';d.lang=l;d.dir=l==='en'?'ltr':'rtl';try{localStorage.setItem('waad.lang',JSON.stringify(l))}catch(e){}};
  var nl=document.getElementById('nl');document.getElementById('mn').onclick=function(){nl.classList.toggle('open')};
  nl.addEventListener('click',function(e){if(e.target.closest('a'))nl.classList.remove('open')});
  // home «built for Saudi»: each tile opens its details below the grid; tapping it again closes them
  [].forEach.call(document.querySelectorAll('.minis .mini'),function(b){b.onclick=function(){
    var open=b.getAttribute('aria-expanded')!=='true';
    [].forEach.call(document.querySelectorAll('.minis .mini'),function(x){x.setAttribute('aria-expanded','false')});
    [].forEach.call(document.querySelectorAll('#sdet .sd'),function(x){x.hidden=!(open&&x.dataset.i===b.dataset.i)});
    if(open){b.setAttribute('aria-expanded','true');var d=document.querySelector('#sdet .sd[data-i="'+b.dataset.i+'"]'),r=d.getBoundingClientRect();if(r.bottom>innerHeight)d.scrollIntoView({block:'nearest',behavior:'smooth'})}
  }});
  // home modules: tabs (click or arrow keys) switch the details pane
  var tl=document.querySelector('.mtl');
  if(tl){var ts=[].slice.call(tl.querySelectorAll('.mt'));
    var pick=function(t,focus){ts.forEach(function(x){var on=x===t;x.setAttribute('aria-selected',on);x.tabIndex=on?0:-1;document.getElementById(x.getAttribute('aria-controls')).hidden=!on});
      if(focus)t.focus();if(tl.scrollWidth>tl.clientWidth)t.scrollIntoView({block:'nearest',inline:'nearest'})};
    ts.forEach(function(t,i){t.onclick=function(){pick(t)};t.onkeydown=function(e){
      var rtl=document.documentElement.dir==='rtl',k=e.key,d=(k==='ArrowDown'||k===(rtl?'ArrowLeft':'ArrowRight'))?1:(k==='ArrowUp'||k===(rtl?'ArrowRight':'ArrowLeft'))?-1:0;
      if(d){e.preventDefault();pick(ts[(i+d+ts.length)%ts.length],true)}}});}
  // hero preview: three dashboards that rotate by themselves (paused on hover, off for reduced motion)
  var sh=document.getElementById('shot');
  if(sh){var sl=sh.querySelectorAll('.slide'),dt=sh.querySelectorAll('.tb button'),cur=0,tm=null;
    var show=function(i){cur=(i+sl.length)%sl.length;for(var j=0;j<sl.length;j++){sl[j].classList.toggle('on',j===cur);dt[j].classList.toggle('on',j===cur)}};
    var still=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
    var go=function(){if(!still&&!tm)tm=setInterval(function(){if(!document.hidden)show(cur+1)},4500)},stop=function(){clearInterval(tm);tm=null};
    for(var j=0;j<dt.length;j++)(function(j){dt[j].onclick=function(){show(j);stop();go()}})(j);
    sh.addEventListener('mouseenter',stop);sh.addEventListener('mouseleave',go);go();}
})();
</script>
